# Project: PHP Gallery
# Repository: https://github.com/klusik/PHP_gallery
# File: .github/workflows/release-promotion.yml
# Module Type: Protected Release Promotion Workflow
# Purpose: Inspect an exact qualification, promote through a PR and publish verified assets.
# Responsibilities:
#   - Keep reader/build jobs isolated from protected publication credentials
#   - Require manual single-owner environment approval for every release write
#   - Retain original failed evidence for explicit maintainer exceptions
# Author: Rudolf Klusal
name: Protected release promotion

on:
  workflow_dispatch:
    inputs:
      qualification_run:
        description: Completed Release qualification run ID (current attempt).
        required: true
        type: string
      candidate_sha:
        description: Exact 40-character prepared candidate SHA.
        required: true
        type: string
      release_branch:
        description: Qualified release/v_X.Y[.Z] branch.
        required: true
        type: string
      mode:
        description: Plan is read-only; promote opens a bot PR for manual owner review and merge; publish is separate; bootstrap only proposes the first release PR.
        required: true
        type: choice
        default: plan
        options: [plan, promote, publish, bootstrap]
      manual_review:
        description: Human acceptance evidence/reference (required for writes).
        required: false
        type: string
      ruleset_attestation_comment:
        description: Unedited owner JSON approval on issue 133 for this exact tooling SHA; empty never attests hidden bypass actors.
        required: false
        type: string
      override_ack:
        description: Read-only plan diagnostics only; red-check override cannot publish.
        type: boolean
        default: false
      override_reason:
        description: Maintainer reason for an exceptional release.
        required: false
        type: string
      accepted_failures:
        description: Exact failed/skipped job names, one per line, including the red gate.
        required: false
        type: string

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: release-promotion-${{ inputs.release_branch }}
  cancel-in-progress: false

env:
  QUALIFICATION_RUN: ${{ inputs.qualification_run }}
  CANDIDATE_SHA: ${{ inputs.candidate_sha }}
  RELEASE_BRANCH: ${{ inputs.release_branch }}
  OVERRIDE_ACK: ${{ inputs.override_ack }}
  OVERRIDE_REASON: ${{ inputs.override_reason }}
  ACCEPTED_FAILURES: ${{ inputs.accepted_failures }}
  MANUAL_REVIEW: ${{ inputs.manual_review }}
  RULESET_ATTESTATION_COMMENT: ${{ inputs.ruleset_attestation_comment }}

jobs:
  inspect:
    if: ${{ inputs.mode != 'bootstrap' }}
    name: Inspect immutable qualification and scope
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.inspect.outputs.version }}
      source_base: ${{ steps.inspect.outputs.source_base }}
      winapp_changed: ${{ steps.scope.outputs.winapp_changed }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Require trusted main or exact owner recovery dispatch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_MODE: ${{ inputs.mode }}
        run: |
          node --input-type=module <<'NODE'
          import {readRequest,validateRequest,api} from './.github/scripts/release-promotion.mjs';
          import {requireOwnerDispatch,requirePublicationRecoveryDispatch} from './.github/scripts/release-owner-authorization.mjs';
          const request=readRequest();
          validateRequest(request);
          if (process.env.GITHUB_EVENT_NAME!=='workflow_dispatch') throw new Error('BLOCKED manual dispatch required.');
          if (process.env.GITHUB_REF!=='refs/heads/main') {
            if (!requirePublicationRecoveryDispatch(process.env.GITHUB_REPOSITORY,process.env,request)) throw new Error('BLOCKED untrusted dispatch ref.');
            requireOwnerDispatch(process.env.GITHUB_REPOSITORY,api,process.env,request);
          }
          NODE
      - name: Download candidate identity from the requested run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REQUESTED_MODE: ${{ inputs.mode }}
        run: |
          node --input-type=module <<'NODE'
          import {readRequest,validateRequest} from './.github/scripts/release-promotion.mjs';
          validateRequest({...readRequest(),mode:process.env.REQUESTED_MODE});
          NODE
          gh run download "${QUALIFICATION_RUN}" --repo "${GITHUB_REPOSITORY}" --name release-qualification-record --dir release-record
      - id: inspect
        name: Validate all mandatory server-owned jobs and prepared SHA
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_MODE: plan
          RELEASE_INSPECTION_TARGET: ${{ inputs.mode }}
        run: node .github/scripts/release-promotion.mjs
      - name: Retain bounded stale-main recovery evidence
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: release-main-recovery-inspect
          path: ${{ runner.temp }}/release-recovery.json
          if-no-files-found: ignore
          retention-days: 90
      - id: scope
        name: Determine required installer build from complete Git history
        env:
          SOURCE_BASE: ${{ steps.inspect.outputs.source_base }}
        run: |
          set -euo pipefail
          paths="$(git diff --name-only "${SOURCE_BASE}" "${CANDIDATE_SHA}" -- winapp ':!winapp/tests' ':!winapp/README.md')"
          if [[ -n "${paths}" ]]; then echo 'winapp_changed=true' >> "${GITHUB_OUTPUT}"; else echo 'winapp_changed=false' >> "${GITHUB_OUTPUT}"; fi

  package:
    name: Build and verify public release assets without write credentials
    needs: inspect
    if: ${{ inputs.mode == 'publish' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          path: tooling
          persist-credentials: false
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.candidate_sha }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: zip
          coverage: none
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Download complete qualification evidence
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh run download "${QUALIFICATION_RUN}" --repo "${GITHUB_REPOSITORY}" --dir qualification-evidence
      - name: Check final integrity and build canonical production archive
        env:
          SOURCE_BASE: ${{ needs.inspect.outputs.source_base }}
          RELEASE_VERSION: ${{ needs.inspect.outputs.version }}
          CANDIDATE_WORKSPACE: ${{ github.workspace }}/candidate
          RELEASE_ASSETS: ${{ runner.temp }}/release-assets
          QUALIFICATION_EVIDENCE: ${{ github.workspace }}/qualification-evidence
        run: node tooling/.github/scripts/release-assets.mjs
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: verified-publication-assets
          path: ${{ runner.temp }}/release-assets/*
          if-no-files-found: error
          retention-days: 30

  installer:
    name: Build required Windows companion installer
    needs: inspect
    if: ${{ inputs.mode == 'publish' && needs.inspect.outputs.winapp_changed == 'true' }}
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.candidate_sha }}
          persist-credentials: false
      - name: Require hosted Inno Setup and build the canonical installer
        shell: pwsh
        run: |
          $compiler = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (!(Test-Path -LiteralPath $compiler)) { throw 'BLOCKED hosted Inno Setup 6 is unavailable.' }
          python winapp/build_installer.py --iscc $compiler
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $installers = @(Get-ChildItem -LiteralPath winapp/dist -Filter '*.exe' -File -Recurse)
          $metadata = @(Get-ChildItem -LiteralPath winapp/dist -Filter 'winapp-update.json' -File -Recurse)
          if ($installers.Count -ne 1 -or $metadata.Count -ne 1) { throw 'BLOCKED ambiguous installer output.' }
          $artifactDirectory = Join-Path $env:RUNNER_TEMP 'winapp-release'
          New-Item -ItemType Directory -Path $artifactDirectory | Out-Null
          Copy-Item -LiteralPath $installers[0].FullName -Destination $artifactDirectory
          Copy-Item -LiteralPath $metadata[0].FullName -Destination $artifactDirectory
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: release-winapp-installer
          path: ${{ runner.temp }}/winapp-release/*
          if-no-files-found: error
          retention-days: 30

  publication-readiness:
    name: Read-only production publication readiness before owner approval
    needs: [inspect, package, installer]
    if: ${{ always() && github.ref == 'refs/heads/hotfix/v_0.126-publication-recovery' && inputs.mode == 'publish' && needs.inspect.result == 'success' && needs.package.result == 'success' && (needs.inspect.outputs.winapp_changed != 'true' || needs.installer.result == 'success') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Download original qualification identity
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh run download "${QUALIFICATION_RUN}" --repo "${GITHUB_REPOSITORY}" --name release-qualification-record --dir release-record
      - uses: actions/download-artifact@v8.0.1
        with:
          name: verified-publication-assets
          path: release-assets
      - uses: actions/download-artifact@v8.0.1
        if: ${{ needs.inspect.outputs.winapp_changed == 'true' }}
        with:
          name: release-winapp-installer
          path: release-assets
      - name: Run the production validators through GET-only adapters
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_MODE: publish
          RELEASE_ASSETS: ${{ github.workspace }}/release-assets
        run: node .github/scripts/release-publication-readiness.mjs
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: publication-readiness
          path: ${{ runner.temp }}/publication-readiness.json
          if-no-files-found: error
          retention-days: 90

  apply:
    name: Owner-approved release PR or publication
    needs: [inspect, package, installer]
    if: ${{ always() && github.ref == 'refs/heads/main' && inputs.mode != 'plan' && inputs.mode != 'bootstrap' && needs.inspect.result == 'success' && (inputs.mode == 'promote' || (needs.package.result == 'success' && (needs.inspect.outputs.winapp_changed != 'true' || needs.installer.result == 'success'))) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release-promotion
    permissions:
      contents: write
      pull-requests: write
      actions: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Download exact qualification identity again after approval
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh run download "${QUALIFICATION_RUN}" --repo "${GITHUB_REPOSITORY}" --name release-qualification-record --dir release-record
      - uses: actions/download-artifact@v8.0.1
        if: ${{ inputs.mode == 'publish' }}
        with:
          name: verified-publication-assets
          path: release-assets
      - uses: actions/download-artifact@v8.0.1
        if: ${{ inputs.mode == 'publish' && needs.inspect.outputs.winapp_changed == 'true' }}
        with:
          name: release-winapp-installer
          path: release-assets
      - name: Revalidate protected controls, exact SHA and original CI before writes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_MODE: ${{ inputs.mode }}
          RELEASE_ASSETS: ${{ github.workspace }}/release-assets
        run: node .github/scripts/release-promotion.mjs
      - name: Retain approved-action stale-main recovery decision
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: release-main-recovery-approved
          path: ${{ runner.temp }}/release-recovery.json
          if-no-files-found: ignore
          retention-days: 90

  recover-publication:
    name: Owner-approved publication recovery for v_0.126 only
    needs: [inspect, package, installer, publication-readiness]
    if: ${{ always() && github.repository == 'klusik/PHP_gallery' && github.ref == 'refs/heads/hotfix/v_0.126-publication-recovery' && github.actor == 'klusik' && github.triggering_actor == 'klusik' && inputs.mode == 'publish' && inputs.release_branch == 'release/v_0.126' && inputs.candidate_sha == 'aef94a6688c7a437abfed3cc4bc2c29a283421bf' && inputs.qualification_run == '38000825301' && !inputs.override_ack && needs.publication-readiness.result == 'success' && needs.inspect.result == 'success' && needs.package.result == 'success' && (needs.inspect.outputs.winapp_changed != 'true' || needs.installer.result == 'success') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: release-publication-recovery-v_0.126
    permissions:
      contents: write
      pull-requests: read
      actions: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Download original qualification after owner environment approval
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh run download "${QUALIFICATION_RUN}" --repo "${GITHUB_REPOSITORY}" --name release-qualification-record --dir release-record
      - uses: actions/download-artifact@v8.0.1
        with:
          name: verified-publication-assets
          path: release-assets
      - uses: actions/download-artifact@v8.0.1
        if: ${{ needs.inspect.outputs.winapp_changed == 'true' }}
        with:
          name: release-winapp-installer
          path: release-assets
      - name: Reuse canonical publisher with pinned recovery guards before every write
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_MODE: publish
          RELEASE_ASSETS: ${{ github.workspace }}/release-assets
        run: node .github/scripts/release-promotion.mjs

  bootstrap:
    name: Owner-dispatched first-release PR proposal only
    if: ${{ inputs.mode == 'bootstrap' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # This existing workflow filename is dispatchable at the reviewed release ref.
    # Main-only deployment environments cannot authorize a release-ref deployment.
    # No contents write permission means no main update, tag or publication authority.
    permissions:
      contents: read
      actions: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Read completed exact candidate qualification
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh run download "${QUALIFICATION_RUN}" --repo "${GITHUB_REPOSITORY}" --name release-qualification-record --dir release-record
      - name: Verify owner and legacy predecessor and propose the bot PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_MODE: bootstrap
        run: node .github/scripts/release-promotion.mjs
