# Project: PHP Gallery
# Repository: https://github.com/klusik/PHP_gallery
# File: .github/workflows/release-promotion.yml
# Module Type: Automatic Reviewed Release Completion
# Purpose: Merge and tag exact qualified release heads after one human approval.
# Responsibilities:
#   - Observe human approval after assembly without relying on token-created events
#   - Finish tagging in the same job and support reruns after an interrupted merge
#   - Preserve server protections, immutable tags and linear develop history
#   - Fill the verified draft with authenticated assets; publication remains manual
#   - Retain completion evidence before retiring the exact fully synchronized release ref
# Author: Rudolf Klusal
# License: MIT License (see LICENSE file in repository)

# Reading path: authenticate exact prepared Q and assembly -> observe human
# approval -> protected merge M -> immutable tag -> safe develop FF -> fill
# unpublished draft -> retain evidence -> retire the completed release ref.
# Q is the reviewed release head; M must have the reviewed parents and Q's
# tree. Recovery reuses verified server state after an interrupted operation.
# Probe modes exercise dispatch routing separately from release completion.
name: Automatic reviewed release completion
run-name: Release completion ${{ inputs.mode || github.event_name }} at ${{ github.ref_name }}

# Entry points and typed inputs: these select when this workflow can run.
on:
  # Assembly explicitly starts complete on Q; probes use separate guarded jobs.
  workflow_dispatch:
    inputs:

      # Choices select separate guarded jobs; the default is shown below.
      mode:
        description: Automatic completion or read-only feature-branch transport probe.
        type: choice
        default: complete
        options: [complete, probe, probe-child]
      pr_number:
        description: Server-derived bot release PR number; supplied by qualification.
        type: string
      candidate_sha:
        description: Exact qualified Q; supplied by qualification.
        type: string
      qualification_run:
        description: Exact hosted release run; supplied by qualification.
        type: string
      release_branch:
        description: Qualified release branch; supplied by qualification.
        type: string
  # Also support observing an already merged bot release PR through server events.
  pull_request:
    types: [closed]

# Default GITHUB_TOKEN scope. A job-level permissions block replaces this
# default; permissions omitted from that block receive no access.
permissions:
  contents: read

# Allow one active run per group. cancel-in-progress: false
# lets an active operation finish rather than interrupting its writes.
concurrency:
  group: release-completion-${{ inputs.pr_number || github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: false

# Workflow-wide environment inherited by jobs. A job/step may override
# individual values; expressions are resolved by Actions before execution.
env:
  PHP_GALLERY_RELEASE_TRUST_DEVELOP: '1'
  RELEASE_PR_NUMBER: ${{ inputs.pr_number || github.event.pull_request.number }}
  CANDIDATE_SHA: ${{ inputs.candidate_sha || github.event.pull_request.head.sha }}
  REQUESTED_RUN: ${{ inputs.qualification_run }}
  RELEASE_BRANCH: ${{ inputs.release_branch || github.event.pull_request.head.ref }}

# Jobs form a dependency graph: needs orders jobs and exposes their outputs.
# Steps inside one job run sequentially on that job's runner.
jobs:

  # Only same-repository canonical bot release handoffs enter completion.
  # Authenticate the server run/check/retained Q before executing Q code,
  # then let the lifecycle helper recheck review, protections and live refs.
  complete:
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.mode == 'complete' && startsWith(github.ref, 'refs/heads/release/v_')) ||
      (github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == 'github-actions[bot]' &&
      startsWith(github.event.pull_request.head.ref, 'release/v_') &&
      github.event_name == 'pull_request' && github.event.pull_request.merged == true)
    name: Complete exact reviewed release and safe develop FF

    # Job outputs promote selected step outputs for needs.<job>.outputs in
    # other jobs; values come from the steps that export each named output.
    outputs:
      draft_ready: ${{ steps.completion.outputs.draft_ready }}
    runs-on: ubuntu-24.04
    # Four-hour review observation plus bounded qualification/transport retries;
    # pending reviews dispatch the same Q again without another human action.
    timeout-minutes: 300
    permissions:
      contents: write
      pull-requests: write
      actions: write
      checks: read
      statuses: write
    steps:

      # Validate bot PR/repository/ref/SHA and the Actions-created successful
      # release check before checking out code that receives write authority.
      - name: Verify server qualification before executing the release checkout
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${RELEASE_PR_NUMBER}" > "${RUNNER_TEMP}/completion-pr.json"
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          const e=process.env, pr=JSON.parse(readFileSync(e.RUNNER_TEMP+'/completion-pr.json','utf8'));
          // A PR number or branch name alone is not authority. Bind repository,
          // bot author, canonical ref and exact Q before executing release code.
          if (!/^[1-9]\d*$/.test(e.RELEASE_PR_NUMBER) || pr.number!==Number(e.RELEASE_PR_NUMBER)
            || !/^[a-f0-9]{40}$/.test(e.CANDIDATE_SHA) || pr.head?.sha!==e.CANDIDATE_SHA
            || pr.head?.repo?.full_name!==e.GITHUB_REPOSITORY || pr.base?.repo?.full_name!==e.GITHUB_REPOSITORY
            || pr.base?.ref!=='main' || pr.user?.login!=='github-actions[bot]' || pr.head?.ref!==e.RELEASE_BRANCH
            || !/^release\/v_(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)(?:\.(?:0|[1-9]\d*))?$/.test(e.RELEASE_BRANCH)
            || (e.GITHUB_EVENT_NAME==='workflow_dispatch' && (e.GITHUB_REF!=='refs/heads/'+e.RELEASE_BRANCH || e.GITHUB_SHA!==e.CANDIDATE_SHA))) {
            throw Error('BLOCKED foreign or stale automatic release handoff');
          }
          NODE
          # Only reviewed same-repository bot releases enter this job. Still require
          # a real successful Actions release identity before checking out its code.
          gh api "repos/${GITHUB_REPOSITORY}/commits/${CANDIDATE_SHA}/check-runs?per_page=100&filter=all" > "${RUNNER_TEMP}/checks.json"
          node --input-type=module <<'NODE'
          import {readFileSync,appendFileSync} from 'node:fs';
          const e=process.env, listing=JSON.parse(readFileSync(e.RUNNER_TEMP+'/checks.json','utf8'));
          // Reject truncated inventories and authenticate the Actions App creator.
          if (listing.total_count>=100 || listing.total_count!==listing.check_runs?.length) throw Error('BLOCKED incomplete checks');
          const checks=listing.check_runs.filter(c=>c.name==='Release qualification' && c.app?.id===15368 && c.head_sha===e.CANDIDATE_SHA
            && /^release:[1-9]\d*:[1-9]\d*:[a-f0-9]{40}$/.test(c.external_id)
            && c.external_id.split(':')[3]===e.CANDIDATE_SHA).sort((a,b)=>b.id-a.id);
          if (!checks.length || checks[0].status!=='completed' || checks[0].conclusion!=='success') throw Error('BLOCKED exact Q is not green');
          if (e.REQUESTED_RUN && e.REQUESTED_RUN!==checks[0].external_id.split(':')[1]) throw Error('BLOCKED superseded dispatch qualification');
          appendFileSync(e.GITHUB_ENV,'QUALIFICATION_RUN='+checks[0].external_id.split(':')[1]+'\n');
          NODE

      # The check can appear before the assembly run finishes retaining artifacts.
      # Wait boundedly for that original run to finish successfully before reading it.
      - name: Wait for the qualification run to finish if approval arrived immediately
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: timeout 300s gh run watch "${QUALIFICATION_RUN}" --repo "${GITHUB_REPOSITORY}" --exit-status --interval 5

      # Cross-check original run/attempt, workflow path, source branch and retained
      # record with the exact-Q Actions check; stale or foreign evidence blocks.
      - name: Bind successful server run and retained Q record before checkout
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${QUALIFICATION_RUN}" > "${RUNNER_TEMP}/qualification-run.json"
          gh run download "${QUALIFICATION_RUN}" --repo "${GITHUB_REPOSITORY}" --name release-qualification-record --dir "${RUNNER_TEMP}/qualification-bootstrap"
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          const e=process.env, run=JSON.parse(readFileSync(e.RUNNER_TEMP+'/qualification-run.json','utf8'));
          const record=JSON.parse(readFileSync(e.RUNNER_TEMP+'/qualification-bootstrap/release-candidate.json','utf8'));
          const listing=JSON.parse(readFileSync(e.RUNNER_TEMP+'/checks.json','utf8'));
          const identity='release:'+e.QUALIFICATION_RUN+':'+run.run_attempt+':'+e.CANDIDATE_SHA;
          // Require the original successful run and its retained exact-Q record,
          // not a similarly named check or an older successful release attempt.
          if (run.path!=='.github/workflows/release-qualification.yml' || !['push','workflow_dispatch'].includes(run.event)
            || run.head_branch!==e.RELEASE_BRANCH || run.repository?.full_name!==e.GITHUB_REPOSITORY
            || run.status!=='completed' || run.conclusion!=='success' || String(run.id)!==e.QUALIFICATION_RUN
            || record.repository!==e.GITHUB_REPOSITORY || record.branch!==e.RELEASE_BRANCH
            || record.candidate_sha!==e.CANDIDATE_SHA || record.run_id!==e.QUALIFICATION_RUN
            || record.run_attempt!==String(run.run_attempt) || record.ready!==true
            || record.automated_result!=='success' || record.override!==false
            || !listing.check_runs.some(c=>c.name==='Release qualification' && c.external_id===identity
              && c.app?.id===15368 && c.head_sha===e.CANDIDATE_SHA && c.status==='completed' && c.conclusion==='success')) {
            throw Error('BLOCKED server run or retained qualification does not authorize exact Q checkout');
          }
          NODE

      # Check out the selected snapshot; with.ref pins source identity where set.
      # with: controls checkout depth and whether Git credentials remain available.
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0

      # Select the Node runtime for repository MJS helpers/fixtures.
      # Package-manager caching is disabled for this framework-free source checkout.
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'
          package-manager-cache: false

      # The lifecycle helper waits for real review and checks live protections/refs,
      # then verifies merge parents/tree, immutable tag, safe develop ancestry
      # and complete unpublished draft assets. Publication remains manual.
      - name: Revalidate qualification and review, then protected merge, tag and FF
        id: completion
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/scripts/release-completion.mjs

      # Preserve actual completion/sync and permanent evidence even on partial
      # failure, so retries can resume from observed immutable server state.
      - name: Retain immutable completion identity and reconciliation status
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: release-completion-record
          path: |
            ${{ runner.temp }}/release-completion.json
            ${{ runner.temp }}/release-evidence.json
            ${{ runner.temp }}/release-evidence.sha256
          if-no-files-found: ignore
          retention-days: 90

  # After successful DRAFT_READY completion, download this run's retained
  # record and independently verify tag, ancestry, assets and dependencies.
  # Delete only the release ref still at Q; incomplete sync retains it.
  retire-draft-branch:
    needs: complete
    if: ${{ needs.complete.outputs.draft_ready == 'true' }}
    name: Retire release branch after verified draft and retained evidence
    runs-on: ubuntu-24.04
    # Type: number. Units: minutes. Scope: this final cleanup job.
    # Consumers: Actions job timeout. Rationale: ten minutes covers read-only
    # proof checks and one leased deletion without an unbounded cleanup worker.
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
      pull-requests: read
      checks: read
    steps:

      # Check out the selected snapshot; with.ref pins source identity where set.
      # with: controls checkout depth and whether Git credentials remain available.
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          persist-credentials: false

      # Select the Node runtime for repository MJS helpers/fixtures.
      # Package-manager caching is disabled for this framework-free source checkout.
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'
          package-manager-cache: false

      # Read this same run's completion archive rather than trusting only a mutable
      # release ref; it also supports recovery after a successful ref deletion.
      - name: Download this run's retained completion before cleanup
        uses: actions/download-artifact@v8.0.1
        with:
          name: release-completion-record
          path: ${{ runner.temp }}/retained-completion

      # Authenticate DRAFT_READY, uploaded asset digests, tag/main/develop ancestry
      # and no dependent work before an exact-Q leased deletion.
      - name: Recheck ready draft, ancestry, dependencies and exact deletion lease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_COMPLETION_FILE: ${{ runner.temp }}/retained-completion/release-completion.json
        run: node .github/scripts/release-draft-retirement.mjs

  # Feature-only diagnostic mode records selected workflow identity and
  # token-policy visibility. probe dispatches one probe-child; that child
  # does not dispatch again. Neither mode runs the completion job.
  transport-probe:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      (inputs.mode == 'probe' || inputs.mode == 'probe-child') &&
      (startsWith(github.ref, 'refs/heads/feature/') || startsWith(github.ref, 'refs/heads/fix/') || startsWith(github.ref, 'refs/heads/codex/'))
    name: Observe dispatch routing and Actions-token policy without release writes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    steps:

      # Check out the selected snapshot; with.ref pins source identity where set.
      # with: controls checkout depth and whether Git credentials remain available.
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      # Select the Node runtime for repository MJS helpers/fixtures.
      # Package-manager caching is disabled for this framework-free source checkout.
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'
          package-manager-cache: false

      # Record the real event/ref/SHA/actor and visible token policy. Build one
      # child dispatch payload only in parent probe mode, without release writes.
      - name: Retain actual selected workflow identity and policy visibility
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SELECTED_WORKFLOW: ${{ github.workflow_ref }}
          PROBE_MODE: ${{ inputs.mode }}
        run: |
          node .github/scripts/release-readiness.mjs
          node --input-type=module <<'NODE'
          import {writeFileSync,appendFileSync} from 'node:fs';
          const e=process.env;
          const proof={event:e.GITHUB_EVENT_NAME,ref:e.GITHUB_REF,sha:e.GITHUB_SHA,workflow:e.SELECTED_WORKFLOW,
            actor:e.GITHUB_ACTOR,mode:e.PROBE_MODE,run:e.GITHUB_RUN_ID,protected_writes:'NONE',release_acceptance:'NOT_RUN'};
          writeFileSync(e.RUNNER_TEMP+'/dispatch-routing.json',JSON.stringify(proof,null,2)+'\n');
          appendFileSync(e.GITHUB_STEP_SUMMARY,JSON.stringify(proof,null,2)+'\n');
          if (e.PROBE_MODE==='probe') writeFileSync(e.RUNNER_TEMP+'/dispatch-child.json',JSON.stringify({
            ref:e.GITHUB_REF_NAME,inputs:{mode:'probe-child'}}));
          NODE

      # Exercise explicit dispatch transport with the existing Actions token;
      # probe-child cannot recursively dispatch more children.
      - name: Dispatch one read-only child using the existing GITHUB_TOKEN
        if: ${{ inputs.mode == 'probe' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/release-promotion.yml/dispatches" --method POST --input "${RUNNER_TEMP}/dispatch-child.json"

      # Persist the listed evidence/output files beyond this ephemeral runner.
      # The artifact name identifies what downstream jobs or maintainers retrieve.
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: release-dispatch-transport-${{ inputs.mode }}
          path: |
            ${{ runner.temp }}/dispatch-routing.json
            ${{ runner.temp }}/release-readiness.json
          if-no-files-found: error
          retention-days: 90
