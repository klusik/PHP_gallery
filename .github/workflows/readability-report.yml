# Project: PHP Gallery
# Repository: https://github.com/klusik/PHP_gallery
# File: .github/workflows/readability-report.yml
# Module Type: On-demand Advisory Workflow
# Purpose: Report readability using the selected branch's own exact source.
# Responsibilities:
#   - Keep recommendations separate from required source qualification.
#   - Retain complete contextual reports and operational diagnostics.
# Author: Rudolf Klusal
# License: MIT License (see LICENSE file in repository)

# Reading path: manual dispatch -> bind selected source/evaluator SHA ->
# central advisory profile -> concise summary plus complete report artifact.
# Advice helps a maintainer review readability; it is separate from BASIC,
# FULL and protected-branch qualification. Run failures still retain evidence.
name: Code readability report
run-name: Readability · ${{ github.ref_name }} · ${{ github.sha }}

# Entry points and typed inputs: these select when this workflow can run.
on:
  workflow_dispatch:

# Default GITHUB_TOKEN scope. A job-level permissions block replaces this
# default; permissions omitted from that block receive no access.
permissions:
  contents: read

# Jobs form a dependency graph: needs orders jobs and exposes their outputs.
# Steps inside one job run sequentially on that job's runner.
jobs:

  # Use the selected branch's own immutable source and evaluator together.
  # The central profile owns discovery/reporting; YAML only provisions its
  # runtimes and retains advice plus operational failure diagnostics.
  readability:
    name: Advisory source readability
    runs-on: ubuntu-24.04
    # Bound setup, central reporting and artifact publication for one advisory job.
    # Type: integer. Units: minutes. Scope: this workflow's readability job.
    # Consumers: GitHub Actions job cancellation.
    # Rationale: 10 minutes allows setup and upload around the 240-second scan
    # while terminating a stalled optional run independently of required CI.
    timeout-minutes: 10
    env:
      PHP_GALLERY_BROWSER: disabled
      GALLERY_WORKFLOW_BROWSER: disabled
    steps:

      # Check out the selected snapshot; with.ref pins source identity where set.
      # with: controls checkout depth and whether Git credentials remain available.
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          # Fetch only the selected immutable snapshot; analysis needs no history.
          # Type: integer. Units: commits. Scope: this job's checkout.
          # Consumers: actions/checkout and the reporter's Git blob discovery.
          # Rationale: depth 1 provides HEAD and its complete tree without
          # downloading unrelated history for a whole-tree advisory report.
          fetch-depth: 1
          persist-credentials: false

      # Require the dispatched branch, checkout and workflow revision to agree.
      # An advisory result must not accidentally describe a different evaluator.
      - name: Verify selected branch and evaluator identity
        shell: bash
        env:
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
        run: |
          set -euo pipefail
          test "${GITHUB_REF_TYPE}" = branch
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test "${WORKFLOW_SHA}" = "${GITHUB_SHA}"
          test "${WORKFLOW_REF}" = "${GITHUB_REPOSITORY}/.github/workflows/readability-report.yml@${GITHUB_REF}"
          printf 'Selected branch: %s\nImmutable source/evaluator SHA: %s\n' \
            "${GITHUB_REF_NAME}" "${GITHUB_SHA}" >> "${GITHUB_STEP_SUMMARY}"

      # Provision the PHP runtime/extensions used by the following central helper.
      # coverage: none avoids collecting code-coverage instrumentation here.
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      # Delegate whole-tree readability discovery and reporting to audit.php;
      # recommendations do not become mandatory source qualification.
      - name: Central advisory profile
        run: php scripts/audit.php --profile=readability

      # Find one central summary and append it to the Actions page. If a report
      # could not be produced, direct the reader to retained diagnostics.
      - name: Publish concise advice summary
        if: ${{ always() }}
        shell: bash
        run: |
          shopt -s nullglob
          reports=(cache/test-audit/*/readability/summary.md)
          if (( ${#reports[@]} == 1 )); then
            cat "${reports[0]}" >> "${GITHUB_STEP_SUMMARY}"
          else
            echo 'Report unavailable; inspect audit diagnostics in the artifact.' \
              >> "${GITHUB_STEP_SUMMARY}"
          fi

      # Upload complete advice and operational evidence even on failure, with
      # the exact source SHA in the artifact name for later review.
      - name: Retain complete report and detailed diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: readability-report-${{ github.sha }}
          path: cache/test-audit/
          if-no-files-found: error
          # Retain complete diagnostics for asynchronous maintainer review.
          # Type: integer. Units: days. Scope: this run's readability artifact.
          # Consumers: GitHub Actions artifact retention and report readers.
          # Rationale: 30 days covers later review without retaining bulky
          # whole-tree reports indefinitely; reports never qualify a candidate.
          retention-days: 30
