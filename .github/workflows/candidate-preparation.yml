# Project: PHP Gallery
# Repository: https://github.com/klusik/PHP_gallery
# File: .github/workflows/candidate-preparation.yml
# Module Type: Basic Source Workflow
# Purpose: Run BASIC on feature pushes and qualify explicitly selected CI maintenance.
# Responsibilities:
#   - Bind BASIC source evidence to the exact unsuperseded feature/squash SHA
#   - Leave preparation and full execution to the requested develop integration
#   - Require one final prepared commit before explicit maintenance FULL and a reviewed CI installation PR
# Author: Rudolf Klusal
# License: MIT License (see LICENSE file in repository)

# Reading path: ordinary push -> basic -> retained source evidence.
# The remaining jobs run only for an explicit maintenance/install_ci dispatch.
# BASIC checks syntax and changed named-declaration documentation; integration
# owns generated preparation and the complete functional matrix.
# Actions expressions (${{ ... }}) read event, input and earlier-job values.
# YAML uses # comments; run: | contains a script in the selected shell.
# uses: runs an action/reusable workflow; with: supplies its inputs.
# id: gives a step an address for steps.<id>.outputs and .outcome.
# GITHUB_OUTPUT exports step outputs; GITHUB_ENV configures later steps;
# GITHUB_STEP_SUMMARY adds Markdown to the run's human-readable summary.
# run: | preserves script newlines; run: >- folds YAML lines into one command.
# Inside a script, use that language's comments (# in Bash, // in JavaScript).
name: Basic source checks

# Entry points and typed inputs: these select when this workflow can run.
on:
  # Ordinary pushes receive only fast BASIC feedback on this working ref.
  push:
    branches:
      - 'feature/**'
      - 'fix/**'
      - 'bugfix/**'
      - 'hotfix/**'
      - 'codex/**'
  # The Actions Run workflow button can explicitly request maintenance FULL.
  workflow_dispatch:
    inputs:
      maintenance_full:
        description: Explicit full hosted verification of CI infrastructure; ordinary pushes remain BASIC.
        required: false
        type: boolean
        default: false
      install_ci:
        description: Qualify this CI-only branch based on main with FULL and release audit, then open a bot PR for human approval.
        required: false
        type: boolean
        default: false

# Default GITHUB_TOKEN scope. A job-level permissions block replaces this
# default; permissions omitted from that block receive no access.
permissions:
  contents: read

# Serialize by source ref and replace obsolete runs when a newer event
# arrives. Different feature/release refs use different groups.
concurrency:
  group: basic-source-${{ github.ref }}
  cancel-in-progress: true

# Jobs form a dependency graph: needs orders jobs and exposes their outputs.
# Steps inside one job run sequentially on that job's runner.
jobs:

  # Fast feedback on the exact event SHA. Check the current remote head
  # before and after the audit so a superseded commit cannot qualify a branch.
  basic:
    name: Basic source checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      # Publish a check result, without permission to change source files.
      checks: write
    env:
      # BASIC is source-only; browser capabilities belong to FULL owners.
      PHP_GALLERY_BROWSER: disabled
      GALLERY_WORKFLOW_BROWSER: disabled
    steps:

      # Check out the selected snapshot; with.ref pins source identity where set.
      # with: controls checkout depth and whether Git credentials remain available.
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      # Provision the PHP runtime/extensions used by the following central helper.
      # coverage: none avoids collecting code-coverage instrumentation here.
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none

      # Select the Node runtime for repository MJS helpers/fixtures.
      # Package-manager caching is disabled for this framework-free source checkout.
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'
          package-manager-cache: false

      # Require a supported working branch and an unchanged remote event SHA.
      # The merge-base with origin/main fixes the delta consumed by BASIC.
      - id: identity
        name: Bind the source comparison base
        shell: bash
        run: |
          set -euo pipefail
          case "${GITHUB_REF_NAME}" in
            feature/*|fix/*|bugfix/*|hotfix/*|codex/*) ;;
            *) echo '::error::BASIC source checks require an ordinary working branch.' >&2; exit 1 ;;
          esac
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test "$(git ls-remote --heads origin "refs/heads/${GITHUB_REF_NAME}" | cut -f1)" = "${GITHUB_SHA}"
          echo "PHP_GALLERY_SOURCE_BASE=$(git merge-base "${GITHUB_SHA}" origin/main)" >> "${GITHUB_ENV}"

      # Delegate syntax and changed named-declaration documentation to the sole
      # audit orchestrator; this profile does not execute functional FULL tests.
      - id: audit
        name: Central BASIC syntax and declaration checks
        run: php scripts/audit.php --profile=basic --changed

      # Run even after a failed audit and recheck the remote head. A newer push
      # invalidates evidence from this older event SHA.
      - id: current
        if: ${{ always() }}
        name: Reject superseded BASIC source evidence
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote --heads origin "refs/heads/${GITHUB_REF_NAME}" | cut -f1)" = "${GITHUB_SHA}"

      # Combine the audit and live-head outcomes into a SHA-bound Actions check.
      # The external_id carries run, attempt and SHA for later authentication.
      - if: ${{ always() }}
        name: Publish BASIC source identity without a FULL context
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AUDIT_OUTCOME: ${{ steps.audit.outcome }}
          CURRENT_OUTCOME: ${{ steps.current.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import {writeFileSync} from 'node:fs';
          const e=process.env;
          // A successful audit is insufficient if the remote head has moved.
          // Retain provider run/attempt identity for integration's evidence reader.
          const check={name:'Basic source qualification',head_sha:e.GITHUB_SHA,status:'completed',
            conclusion:e.AUDIT_OUTCOME==='success'&&e.CURRENT_OUTCOME==='success'?'success':'failure',
            external_id:`basic:${e.GITHUB_RUN_ID}:${e.GITHUB_RUN_ATTEMPT}:${e.GITHUB_SHA}`,
            details_url:`https://github.com/${e.GITHUB_REPOSITORY}/actions/runs/${e.GITHUB_RUN_ID}`,
            output:{title:'BASIC source checks',summary:'PHP/JavaScript syntax and named declaration documentation only; no FULL integration or generated preparation.'}};
          writeFileSync(e.RUNNER_TEMP+'/basic-source-check.json',JSON.stringify(check));
          NODE
          gh api "repos/${GITHUB_REPOSITORY}/check-runs" --method POST --input "${RUNNER_TEMP}/basic-source-check.json"

      # Persist the listed evidence/output files beyond this ephemeral runner.
      # The artifact name identifies what downstream jobs or maintainers retrieve.
      - if: ${{ always() }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: basic-source-evidence
          path: |
            cache/test-audit/latest.json
            cache/test-audit/latest.md
            cache/test-audit/**/source-documentation-changed.json
            cache/test-audit/**/source-failures.md
          if-no-files-found: error
          retention-days: 90

  # Explicit maintenance path only: validate one commit above main, generate
  # canonical artifacts and publish them only to the selected working branch.
  # A generated child stops here for squash and fresh BASIC before FULL.
  prepare:
    needs: basic
    if: ${{ github.event_name == 'workflow_dispatch' && (inputs.maintenance_full || inputs.install_ci) }}
    name: Prepare source candidate at event SHA
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write

    # Job outputs promote selected step outputs for needs.<job>.outputs in
    # other jobs; values come from the steps that export each named output.
    outputs:
      source_base: ${{ steps.guard.outputs.source_base }}
      candidate_sha: ${{ steps.publish.outputs.candidate_sha }}
      preparation_changed: ${{ steps.publish.outputs.changed }}
    steps:

      # Check out the selected snapshot; with.ref pins source identity where set.
      # with: controls checkout depth and whether Git credentials remain available.
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      # Provision the PHP runtime/extensions used by the following central helper.
      # coverage: none avoids collecting code-coverage instrumentation here.
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: zip, mbstring
          coverage: none

      # Select the Node runtime for repository MJS helpers/fixtures.
      # Package-manager caching is disabled for this framework-free source checkout.
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'
          package-manager-cache: false

      # Record server policy visibility using the existing token, so later
      # installation decisions can distinguish missing access from source failure.
      - name: Inspect live release control visibility with the existing workflow token
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/scripts/release-readiness.mjs

      # Persist the listed evidence/output files beyond this ephemeral runner.
      # The artifact name identifies what downstream jobs or maintainers retrieve.
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: live-release-readiness
          path: ${{ runner.temp }}/release-readiness.json
          if-no-files-found: error
          retention-days: 90

      # Refuse protected/non-branch refs, moved heads and multiple commits.
      # Maintenance FULL starts only from one direct child of the frozen base.
      - id: guard
        name: Check branch identity and source provenance
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" != "branch" ]]; then
            echo "::error::Candidate preparation requires a mutable source branch." >&2
            exit 1
          fi
          case "${GITHUB_REF_NAME}" in
            feature/*|fix/*|bugfix/*|hotfix/*|codex/*) ;;
            *)
              echo "::error::Candidate preparation refuses non-feature/fix branch: ${GITHUB_REF_NAME}" >&2
              exit 1
              ;;
          esac
          if [[ "$(git rev-parse HEAD)" != "${GITHUB_SHA}" ]]; then
            echo "::error::Event SHA and actual checkout differ; refusing candidate preparation." >&2
            exit 1
          fi
          remote_sha="$(git ls-remote --heads origin "refs/heads/${GITHUB_REF_NAME}" | cut -f1)"
          if [[ "${remote_sha}" != "${GITHUB_SHA}" ]]; then
            echo "::error::Source branch moved before preparation; do not write an older candidate." >&2
            exit 1
          fi
          source_base="$(git merge-base "${GITHUB_SHA}" origin/main)"
          if [[ -z "${source_base}" ]]; then
            echo "::error::Could not find the reviewed source comparison base." >&2
            exit 1
          fi
          if [[ "$(git rev-list --count "${source_base}..${GITHUB_SHA}")" != '1' \
            || "$(git show -s --format=%P "${GITHUB_SHA}")" != "${source_base}" ]]; then
            echo '::error::Squash the complete feature, including generated bot commits, to one commit above the comparison base before FULL.' >&2
            exit 1
          fi
          echo "source_sha=${GITHUB_SHA}" >> "${GITHUB_OUTPUT}"
          echo "source_base=${source_base}" >> "${GITHUB_OUTPUT}"

      # Find source-policy failures before spending time regenerating artifacts.
      # The central profile uses the previously frozen source comparison base.
      - name: Cheap source-policy preflight before generation
        env:
          PHP_GALLERY_SOURCE_BASE: ${{ steps.guard.outputs.source_base }}
          PHP_GALLERY_BROWSER: disabled
          GALLERY_WORKFLOW_BROWSER: disabled
        run: php scripts/audit.php --profile=release-preflight

      # Generate runtime modules, inventory and manifest in their owned order.
      # Fix SOURCE_DATE_EPOCH to the source commit, then check without repairing.
      - name: Prepare and verify canonical candidate artifacts
        shell: bash
        run: |
          set -euo pipefail
          # A rerun of the same input SHA must render the same generated tree.
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct "${GITHUB_SHA}")"
          php scripts/prepare_candidate.php
          php scripts/prepare_candidate.php --check

      # Stage only the three generated paths and recheck the remote source.
      # Reuse an identical already-published tree; refuse a different writer.
      # A new child requires squash plus fresh BASIC before maintenance FULL.
      - id: publish
        name: Commit only generated artifacts with a non-forced branch lease
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.guard.outputs.source_sha }}
        run: |
          set -euo pipefail
          git add -- app/runtime/modules.php app/production-files.json app/core-manifest.json
          # A no-op preserves the event SHA, avoiding unnecessary qualification.
          if git diff --cached --quiet; then
            echo "changed=false" >> "${GITHUB_OUTPUT}"
            echo "All generated artifacts already match their authored inputs."
          else
            git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m 'chore(candidate): refresh reviewed generated artifacts'
            echo "changed=true" >> "${GITHUB_OUTPUT}"
          fi
          candidate_sha="$(git rev-parse HEAD)"
          # Refuse out-of-order publication if another writer advanced the branch.
          remote_sha="$(git ls-remote --heads origin "refs/heads/${GITHUB_REF_NAME}" | cut -f1)"
          if [[ "${remote_sha}" == "${SOURCE_SHA}" ]]; then
            if [[ "${candidate_sha}" != "${SOURCE_SHA}" ]]; then
              if ! git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"; then
                echo "::error::Source branch advanced while publishing; refusing a stale candidate." >&2
                exit 1
              fi
            fi
          else
            # Manual rerun of the same input can reuse an already-published tree,
            # but a newer and different branch head must never be overwritten.
            git fetch --no-tags origin "refs/heads/${GITHUB_REF_NAME}"
            remote_tree="$(git rev-parse 'FETCH_HEAD^{tree}')"
            if [[ "${remote_tree}" != "$(git rev-parse 'HEAD^{tree}')" ]]; then
              echo "::error::Source branch changed during preparation; refusing an out-of-order write." >&2
              exit 1
            fi
            candidate_sha="${remote_sha}"
            echo "Candidate tree was already published at ${candidate_sha}."
          fi
          latest_sha="$(git ls-remote --heads origin "refs/heads/${GITHUB_REF_NAME}" | cut -f1)"
          if [[ "${latest_sha}" != "${candidate_sha}" ]]; then
            echo "::error::Published branch head is not the prepared candidate SHA." >&2
            exit 1
          fi
          if [[ "${candidate_sha}" != "${SOURCE_SHA}" ]]; then
            # FULL must see the final squashed SHA, not a generated child commit.
            echo '::error::Preparation published generated changes. Squash the complete prepared tree, obtain fresh BASIC, and dispatch FULL on that final SHA.' >&2
            exit 1
          fi
          echo "candidate_sha=${candidate_sha}" >> "${GITHUB_OUTPUT}"
          echo "Prepared candidate SHA: ${candidate_sha}"

      # Show the compact existing audit summary on failure; the artifact below
      # retains detailed reports without flooding successful logs.
      - name: Show source/preparation failure diagnostics
        if: failure()
        shell: bash
        run: |
          if [[ -f cache/test-audit/latest.md ]]; then
            sed -n '1,150p' cache/test-audit/latest.md
          fi

      # Retain available source failures even when preparation failed early.
      # Missing optional diagnostics do not hide the original failing step.
      - name: Upload source preflight diagnostics
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: candidate-source-preflight
          path: |
            cache/test-audit/latest.json
            cache/test-audit/latest.md
            cache/test-audit/**/source-failures.md
            cache/test-audit/**/source-documentation-changed.log
            cache/test-audit/**/source-policy-changed.log
            cache/test-audit/**/source-contract-inventory.log
            cache/test-audit/**/python-import-policy.log
            cache/test-audit/**/js-lint.log
            cache/test-audit/**/ci-workflow-contract.log
            cache/test-audit/**/source-documentation-changed.json
            cache/test-audit/**/source-policy-changed.json
            cache/test-audit/**/source-documentation.json
            cache/test-audit/**/source-policy.json
            cache/test-audit/**/source-debt-ratchet.json
            cache/test-audit/**/python-import-policy.json
          if-no-files-found: ignore
          retention-days: 7

  # Call the shared matrix on the prepared SHA. install_ci selects its
  # additional release audit; an ordinary push never reaches this job.
  qualify:
    name: Full CI for the published prepared SHA
    needs: prepare
    if: ${{ needs.prepare.result == 'success' && needs.prepare.outputs.candidate_sha == github.sha }}
    uses: ./.github/workflows/gallery-workflows.yml
    with:
      audit_profile: ${{ inputs.install_ci && 'release' || 'full' }}
      checkout_ref: ${{ needs.prepare.outputs.candidate_sha }}
      source_base: ${{ needs.prepare.outputs.source_base }}

  # After matrix execution, check both its result and the live feature head.
  # Publish exact-SHA check contexts only for that unchanged candidate.
  gate:
    name: Reject superseded qualification
    needs: [prepare, qualify]
    if: ${{ always() && needs.prepare.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      checks: write
    steps:

      # Check out the selected snapshot; with.ref pins source identity where set.
      # with: controls checkout depth and whether Git credentials remain available.
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.candidate_sha }}

      # A green matrix authorizes only its exact candidate. Recheck live HEAD
      # so a later feature push cannot inherit that older result.
      - id: gate
        name: Verify successful qualification and unchanged published branch head
        shell: bash
        env:
          CANDIDATE_SHA: ${{ needs.prepare.outputs.candidate_sha }}
          QUALIFICATION_RESULT: ${{ needs.qualify.result }}
        run: |
          set -euo pipefail
          if [[ "${QUALIFICATION_RESULT}" != "success" ]]; then
            echo "::error::Prepared candidate did not pass the authoritative CI workflow." >&2
            exit 1
          fi
          remote_sha="$(git ls-remote --heads origin "refs/heads/${GITHUB_REF_NAME}" | cut -f1)"
          if [[ "${remote_sha}" != "${CANDIDATE_SHA}" ]]; then
            echo "::error::Source branch advanced after preparation; this qualification is stale." >&2
            exit 1
          fi
          echo "PASS prepared candidate ${CANDIDATE_SHA}; remote branch head is unchanged."

      # Write the candidate summary and public check contexts for the verified
      # aggregate. A reusable job's prefixed name alone may not match branch rules.
      - name: Publish SHA-bound hosted qualification result
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CANDIDATE_SHA: ${{ needs.prepare.outputs.candidate_sha }}
          SOURCE_BASE: ${{ needs.prepare.outputs.source_base }}
          GATE_OUTCOME: ${{ steps.gate.outcome }}
        run: |
          node --input-type=module <<'NODE'
          import {writeFileSync, appendFileSync} from 'node:fs';
          const e = process.env;
          const summary = `Branch: ${e.GITHUB_REF_NAME}\nCandidate: ${e.CANDIDATE_SHA}\nComparison base: ${e.SOURCE_BASE}\nResult: ${e.GATE_OUTCOME}\nWorkflow: https://github.com/${e.GITHUB_REPOSITORY}/actions/runs/${e.GITHUB_RUN_ID}`;
          appendFileSync(e.GITHUB_STEP_SUMMARY, summary + '\n');
          writeFileSync(e.RUNNER_TEMP + '/candidate-check.json', JSON.stringify({name:'Candidate qualification',
            external_id:`candidate:${e.GITHUB_RUN_ID}:${e.GITHUB_RUN_ATTEMPT}:${e.CANDIDATE_SHA}`,
            head_sha:e.CANDIDATE_SHA, status:'completed', conclusion:e.GATE_OUTCOME === 'success' ? 'success' : 'failure',
            details_url:`https://github.com/${e.GITHUB_REPOSITORY}/actions/runs/${e.GITHUB_RUN_ID}`,
            output:{title:'Exact prepared source candidate',summary}}));
          NODE
          gh api "repos/${GITHUB_REPOSITORY}/check-runs" --method POST --input "${RUNNER_TEMP}/candidate-check.json"
          # A reusable workflow may prefix its native job context even when SHA is unchanged.
          # Bind the required public context to the verified aggregate for every candidate.
          node --input-type=module <<'NODE'
          import {readFileSync,writeFileSync} from 'node:fs';
          const file = process.env.RUNNER_TEMP + '/candidate-check.json';
          const check = JSON.parse(readFileSync(file,'utf8'));
          check.name = 'Complete required CI matrix';
          writeFileSync(process.env.RUNNER_TEMP + '/prepared-matrix-check.json',JSON.stringify(check));
          NODE
          gh api "repos/${GITHUB_REPOSITORY}/check-runs" --method POST --input "${RUNNER_TEMP}/prepared-matrix-check.json"

  # Optional CI-only installation proposal after every preceding gate.
  # The helper authenticates native owners and scope, retains its record,
  # and opens a bot PR that still needs normal human review.
  install-ci:
    name: Propose qualified CI installation
    needs: [prepare, qualify, gate]
    if: ${{ inputs.install_ci && needs.prepare.result == 'success' && needs.qualify.result == 'success' && needs.gate.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
      checks: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CANDIDATE_SHA: ${{ needs.prepare.outputs.candidate_sha }}
      SOURCE_BASE: ${{ needs.prepare.outputs.source_base }}
    steps:

      # Check out the selected snapshot; with.ref pins source identity where set.
      # with: controls checkout depth and whether Git credentials remain available.
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      # Select the Node runtime for repository MJS helpers/fixtures.
      # Package-manager caching is disabled for this framework-free source checkout.
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'
          package-manager-cache: false

      # Authenticate the complete native matrix, source/main leases and CI-only
      # scope before preparing a proposed main installation record.
      - name: Verify every native owner and installation scope
        run: node .github/scripts/ci-installation.mjs qualify

      # Persist the listed evidence/output files beyond this ephemeral runner.
      # The artifact name identifies what downstream jobs or maintainers retrieve.
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: ci-installation-record
          path: ${{ runner.temp }}/ci-installation.json
          if-no-files-found: error
          retention-days: 90

      # Use the retained qualification to open the bot installation PR.
      # Normal protected review/merge policy still controls installation.
      - name: Propose the exact qualified candidate for human review
        run: node .github/scripts/ci-installation.mjs propose
