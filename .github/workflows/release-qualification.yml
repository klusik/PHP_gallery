# Project: PHP Gallery
# Repository: https://github.com/klusik/PHP_gallery
# File: .github/workflows/release-qualification.yml
# Module Type: Release Qualification Workflow
# Purpose: Assemble a release from already qualified protected develop and stage the human-reviewed publication.
# Responsibilities:
#   - Validate mutable release branch identity before repository writes
#   - Apply deterministic release preparation and commit it back only to the same release branch
#   - Generate missing release-note prose through tightly scoped GitHub Copilot CLI
#   - Preserve completed maintainer-authored release notes without invoking AI
#   - Export large changes or provider failures for externally authored notes
#   - Trust the selected protected develop source without replaying source qualification
#   - Build all maintained manuals, notes, manifest and authenticated release attachments
#   - Expose one aggregate release qualification gate
# Author: Rudolf Klusal
# License: MIT License (see LICENSE file in repository)

# Reading path: freeze identities -> prepare metadata and editorial notes
# -> build four manuals -> refresh integrity -> release-gate -> assets and
# optional installer -> propose PR and dispatch reviewed completion.
# Protected develop A already passed source qualification. This workflow
# assembles prepared release Q; its green gate means assembly is complete.
# NOTES_PENDING exports an editorial handoff and stops before builds or a PR.
# release-promotion.yml observes human approval; publishing remains manual.
name: Release qualification

# Entry points and typed inputs: these select when this workflow can run.
on:
  # User-originated release pushes can start assembly; bot handoffs dispatch it.
  push:
    branches:
      - 'release/v_*'
  workflow_dispatch:
    inputs:

      # Begin Release also supplies its run/attempt to authenticate frozen A.
      begin_source_sha:
        description: Frozen develop source supplied only by Begin Release initialization.
        type: string
        default: ''
      begin_run:
        description: Authenticated initiating Begin Release run ID.
        type: string
        default: ''
      begin_attempt:
        description: Exact initiating Begin Release attempt.
        type: string
        default: ''

      # Continuation accepts source/prompt-bound JSON from the retained handoff.
      external_notes:
        description: Paste the single-line response JSON from the release-notes-handoff prompt.
        type: string
        default: ''

      # external exports evidence without spending provider requests.
      notes_mode:
        description: Use external to export evidence without trying Copilot.
        type: choice
        default: auto
        options: [auto, external]

# Default GITHUB_TOKEN scope. A job-level permissions block replaces this
# default; permissions omitted from that block receive no access.
permissions:
  contents: read

# Serialize by source ref and replace obsolete runs when a newer event
# arrives. Different feature/release refs use different groups.
concurrency:
  group: release-qualification-${{ github.ref }}
  cancel-in-progress: true

# Workflow-wide environment inherited by jobs. A job/step may override
# individual values; expressions are resolved by Actions before execution.
env:
  # Source admission belongs to protected develop; this stage checks assembly.
  PHP_GALLERY_RELEASE_TRUST_DEVELOP: '1'

# Jobs form a dependency graph: needs orders jobs and exposes their outputs.
# Steps inside one job run sequentially on that job's runner.
jobs:

  # Capture actual main as a Git identity. The constant bootstrap=false
  # selects the current protected-develop assembly path; the historical
  # release-bootstrap.yml reusable matrix is not called here.
  coverage-owner:
    name: Select release source
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read

    # Job outputs promote selected step outputs for needs.<job>.outputs in
    # other jobs; values come from the steps that export each named output.
    outputs:
      bootstrap: 'false'
      main_sha: ${{ steps.source.outputs.main_sha }}
    steps:

      # Read main from the server and expose its SHA. This freezes a Git base;
      # it does not rerun source qualification on already protected develop.
      - id: source
        name: Freeze the observed main Git base
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "main_sha=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')" >> "${GITHUB_OUTPUT}"

  # Assemble on the leased release branch: preserve immutable origin, prepare
  # metadata/notes, compile all four manuals and regenerate final hashes.
  # Export ready only after consistency checks on the prepared candidate.
  prepare:
    name: Prepare release candidate
    needs: coverage-owner
    if: ${{ needs.coverage-owner.outputs.bootstrap == 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    permissions:
      contents: write
      actions: read

    # Job outputs promote selected step outputs for needs.<job>.outputs in
    # other jobs; values come from the steps that export each named output.
    outputs:
      version: ${{ steps.final.outputs.version }}
      candidate_sha: ${{ steps.final.outputs.candidate_sha }}
      source_base: ${{ steps.origin.outputs.source_base }}
      base_tag: ${{ steps.origin.outputs.base_tag }}
      provenance_json: ${{ steps.origin.outputs.provenance_json }}
      origin_commit_sha: ${{ steps.origin.outputs.origin_commit_sha }}
      selected_develop_sha: ${{ steps.origin.outputs.selected_develop_sha }}
      integration_identity_json: ${{ steps.integration.outputs.identity_json }}
      initial_main_sha: ${{ steps.origin.outputs.initial_main_sha }}
      previous_stable_tag: ${{ steps.origin.outputs.previous_stable_tag }}
      previous_stable_sha: ${{ steps.origin.outputs.previous_stable_sha }}
      ready: ${{ steps.final.outputs.ready }}
      preparation_changed: ${{ steps.commit.outputs.changed }}
      winapp_changed: ${{ steps.final.outputs.winapp_changed }}
      installer_required: ${{ steps.final.outputs.installer_required }}
      notes_pending: ${{ steps.notes.outputs.pending }}
    steps:

      # Check out the selected snapshot; with.ref pins source identity where set.
      # with: controls checkout depth and whether Git credentials remain available.
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      # Provision the PHP runtime/extensions used by the following central helper.
      # coverage: none avoids collecting code-coverage instrumentation here.
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: zip, mbstring
          coverage: none

      # Select the Node runtime for repository MJS helpers/fixtures.
      # Package-manager caching is disabled for this framework-free source checkout.
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'
          package-manager-cache: false

      # Require canonical release/v_X.Y[.Z] spelling and export the version
      # without the branch prefix for metadata and note generators.
      - id: release
        name: Validate release branch identity
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "${GITHUB_REF_NAME}" =~ ^release/v_((0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(\.((0|[1-9][0-9]*)))?)$ ]]; then
            echo "::error::Expected canonical release/v_X.Y[.Z] branch." >&2
            exit 1
          fi
          echo "version=${GITHUB_REF_NAME#release/v_}" >> "${GITHUB_OUTPUT}"

      # Create or reuse origin/predecessor provenance. Begin Release inputs bind
      # initialization to its authenticated frozen source and initiating attempt.
      - id: initialize
        name: Initialize or reuse immutable origin after release push
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BEGIN_SOURCE_SHA: ${{ inputs.begin_source_sha }}
          BEGIN_RELEASE_RUN_ID: ${{ inputs.begin_run }}
          BEGIN_RELEASE_RUN_ATTEMPT: ${{ inputs.begin_attempt }}
        run: node .github/scripts/start-new-release.mjs

      # Resolve frozen develop/main identities and the real previous stable tag
      # from Git history; downstream deltas must retain this same provenance.
      - id: origin
        name: Verify immutable release develop origin and prior main tag
        env:
          ORIGIN_CHECKOUT_SHA: ${{ steps.initialize.outputs.candidate_sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/scripts/release-origin.mjs

      # Load the selected protected-develop identity directly and require exact A.
      # Current assembly trusts its admission rather than replaying old FULL.
      - id: integration
        name: Capture the qualified protected develop source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SELECTED_DEVELOP_SHA: ${{ steps.origin.outputs.selected_develop_sha }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import {appendFileSync} from 'node:fs';
          import {loadDevelopSource} from './.github/scripts/coverage-artifacts.mjs';
          const identity=loadDevelopSource(process.env.GITHUB_REPOSITORY,process.env.SELECTED_DEVELOP_SHA);
          if(identity.candidate_sha!==process.env.SELECTED_DEVELOP_SHA) {
            throw new Error('BLOCKED exact selected-develop integration identity is unavailable.');
          }
          appendFileSync(process.env.GITHUB_OUTPUT,`identity_json=${JSON.stringify(identity)}\n`);
          NODE

      # Align release metadata and four manual edition markers. One fixed
      # release epoch is shared by compilation and integrity generation/retries.
      - name: Apply deterministic release preparation
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          # New releases bind to the immutable event commit; completed metadata
          # retains its original date on retries, including the bot-prepared head.
          export RELEASE_INITIAL_EPOCH="$(git show -s --format=%ct "${GITHUB_SHA}")"
          php .github/scripts/prepare_release_candidate.php "${RELEASE_VERSION}"
          # Share one release timestamp between manifest generation and PDF compilation.
          export SOURCE_DATE_EPOCH="$(php -r '
            $metadata = json_decode(file_get_contents("release-metadata.json"), true, 512, JSON_THROW_ON_ERROR);
            $moment = new DateTimeImmutable($metadata[$argv[1]]["released_at"], new DateTimeZone("Europe/Prague"));
            echo $moment->getTimestamp();
          ' "${RELEASE_VERSION}")"
          echo "SOURCE_DATE_EPOCH=${SOURCE_DATE_EPOCH}" >> "${GITHUB_ENV}"
          php scripts/generate_production_files.php
          if ! php scripts/generate_manifest.php --check; then
            php scripts/generate_manifest.php
          fi

      # Preserve completed maintainer prose. A missing section or TODO marker
      # selects generation/continuation rather than pretending notes are ready.
      - id: notes-before
        name: Check existing editorial release notes
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          if php -r '
            require "scripts/release_lib.php";
            $section = \PhpGallery\Release\patch_notes_section(getcwd(), $argv[1]);
            exit($section !== null
              && !str_contains($section, "RELEASE_NOTES_TODO")
              && preg_match("/\\bTODO\\b/i", $section) !== 1 ? 0 : 1);
          ' "${RELEASE_VERSION}"; then
            echo "complete=true" >> "${GITHUB_OUTPUT}"
          else
            echo "complete=false" >> "${GITHUB_OUTPUT}"
          fi

      # Build source-bound evidence from the actual predecessor delta and notes
      # template before provider selection; complete source evidence is retained.
      - name: Build complete release-note evidence prompt
        if: ${{ steps.notes-before.outputs.complete != 'true' }}
        # Bound the whole local evidence step independently of Copilot and TeX.
        timeout-minutes: 2
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          BASE_TAG: ${{ steps.origin.outputs.base_tag }}
          PHP_GALLERY_RELEASE_BASE: ${{ steps.origin.outputs.source_base }}
        run: |
          set -euo pipefail
          php .github/scripts/patch_notes_ai.php prompt \
            "${RELEASE_VERSION}" "${BASE_TAG}" "${GITHUB_REPOSITORY}" \
            "${RUNNER_TEMP}/release-notes-prompt.txt"

      # Route by complete evidence size, provider availability and explicit mode.
      # Supplied external JSON must match the rebuilt source/prompt identities.
      - id: notes-route
        name: Select bounded Copilot work or external AI handoff
        if: ${{ steps.notes-before.outputs.complete != 'true' }}
        timeout-minutes: 2
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          COPILOT_AVAILABLE: ${{ secrets.COPILOT_GITHUB_TOKEN != '' }}
          NOTES_MODE: ${{ inputs.notes_mode || 'auto' }}
          EXTERNAL_NOTES: ${{ inputs.external_notes }}
        run: >-
          php .github/scripts/patch_notes_handoff.php
          "${RELEASE_VERSION}" "${GITHUB_REPOSITORY}"
          "${RUNNER_TEMP}/release-notes-prompt.txt"
          "${RUNNER_TEMP}/release-notes-handoff"

      # Apply only the externally authored response accepted by handoff validation;
      # application/filesystem errors remain mandatory assembly failures.
      - id: apply-external
        name: Apply verified externally supplied release notes
        if: ${{ steps.notes-route.outputs.mode == 'supplied' }}
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: >-
          php .github/scripts/patch_notes_ai.php apply "${RELEASE_VERSION}"
          "${RUNNER_TEMP}/release-notes-handoff/accepted-notes.md"

      # Set up the optional editorial provider only after routing admits it.
      # Setup failure can select external handoff through the later notes gate.
      - id: copilot-install
        name: Install GitHub Copilot CLI
        if: ${{ steps.notes-route.outputs.mode == 'copilot' }}
        # Optional provider setup may fail; evidence export and assembly integrity may not.
        continue-on-error: true
        timeout-minutes: 2
        shell: bash
        run: npm install -g @github/copilot

      # Create complete bounded extraction requests without discarding diff bytes;
      # the shared evidence helper owns reduction and validation rules.
      - name: Prepare bounded Copilot evidence slices
        if: ${{ steps.notes-route.outputs.mode == 'copilot' && steps.copilot-install.outcome == 'success' }}
        timeout-minutes: 2
        shell: bash
        run: |
          set -euo pipefail
          php .github/scripts/patch_notes_ai_chunks.php prepare \
            "${RUNNER_TEMP}/release-notes-prompt.txt" \
            "${RUNNER_TEMP}/release-notes-evidence"

      # Process and validate each evidence pass before final synthesis. Timeouts
      # and the existing unavailable-model fallback are bounded; the current
      # assembly path routes provider failure to an external editorial handoff.
      - id: copilot
        name: Generate release notes with Copilot from every diff slice
        if: ${{ steps.notes-route.outputs.mode == 'copilot' && steps.copilot-install.outcome == 'success' }}
        continue-on-error: true
        # One admitted evidence slice plus synthesis, including bounded model fallback.
        timeout-minutes: 20
        shell: bash
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          COPILOT_AUTO_UPDATE: 'false'
          GITHUB_COPILOT_PROMPT_MODE_EXTENSIONS: 'false'
        run: |
          set -euo pipefail
          if [[ -z "${COPILOT_GITHUB_TOKEN:-}" ]]; then
            echo "::error::COPILOT_GITHUB_TOKEN is required for GitHub release-note generation." >&2
            exit 1
          fi

          evidence_dir="${RUNNER_TEMP}/release-notes-evidence"
          error_log="${RUNNER_TEMP}/copilot-release-notes.err"
          selected_model='gpt-6-luna'
          run_copilot() {
            local prompt_path="$1" response_path="$2" label="$3"
            if timeout --kill-after=10s 240s \
              copilot -s --model "${selected_model}" --no-ask-user \
              < "${prompt_path}" > "${response_path}" 2> "${error_log}"; then
              return 0
            fi
            if [[ "${selected_model}" == 'gpt-6-luna' ]] &&
              grep -Fq 'Model "gpt-6-luna" from --model flag is not available.' "${error_log}"; then
              selected_model='auto'
              echo "::warning::gpt-6-luna is unavailable; using Copilot auto for all remaining evidence passes."
              if timeout --kill-after=10s 240s \
                copilot -s --model auto --no-ask-user \
                < "${prompt_path}" > "${response_path}" 2> "${error_log}"; then
                return 0
              fi
            fi
            if grep -Fq "Request exceeds the model's prompt budget" "${error_log}"; then
              echo "::error::Copilot prompt budget exceeded at ${label}; no diff bytes have been discarded." >&2
            else
              echo "::error::Copilot failed or timed out at ${label}; original diff and intermediate evidence remain unchanged." >&2
            fi
            return 1
          }

          # Each diff and reduction part must succeed; none may be skipped.
          # Digest hierarchy reduces context without trimming any source slice.
          shopt -s nullglob
          completed=false
          for ((level=0; level<12; level++)); do
            printf -v stage '%02d' "${level}"
            inputs=("${evidence_dir}/level-${stage}-"*.prompt)
            if (( ${#inputs[@]} == 0 )); then
              echo "::error::Missing Copilot evidence requests for level ${stage}." >&2
              exit 1
            fi
            echo "Processing ${#inputs[@]} bounded Copilot evidence requests in level ${stage}."
            for input_path in "${inputs[@]}"; do
              output_path="${input_path%.prompt}.md"
              label="$(basename "${input_path}")"
              echo "Copilot evidence request: ${label}"
              run_copilot "${input_path}" "${output_path}" "${label}"
              php .github/scripts/patch_notes_ai_chunks.php validate-summary "${output_path}"
            done
            php .github/scripts/patch_notes_ai_chunks.php advance "${evidence_dir}"
            if [[ -f "${evidence_dir}/final.prompt" ]]; then
              completed=true
              break
            fi
          done
          if [[ "${completed}" != true ]]; then
            echo "::error::Bounded Copilot evidence reduction did not finish." >&2
            exit 1
          fi

          echo "Generating final editorial release notes from fully processed evidence."
          run_copilot "${evidence_dir}/final.prompt" \
            "${RUNNER_TEMP}/release-notes-response.md" 'final release-note synthesis'

      # Reject incomplete/invalid provider prose before any application.
      # Optional provider validation failure still requires external completion.
      - id: validate-copilot
        name: Validate generated release-note prose
        if: ${{ steps.copilot.outcome == 'success' }}
        continue-on-error: true
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: >-
          php .github/scripts/patch_notes_ai.php validate
          "${RELEASE_VERSION}" "${RUNNER_TEMP}/release-notes-response.md"

      # Write only prose that passed validation; a failed write cannot be treated
      # as a harmless provider outage.
      - id: apply-copilot
        name: Apply validated generated release notes
        if: ${{ steps.validate-copilot.outcome == 'success' }}
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          php .github/scripts/patch_notes_ai.php apply \
            "${RELEASE_VERSION}" "${RUNNER_TEMP}/release-notes-response.md"

      # Retain available rejected model prose for diagnosis, excluding provider
      # authentication stderr and credentials from the artifact.
      - name: Upload rejected AI release-note response
        if: ${{ !cancelled() && (steps.copilot.outcome == 'failure' || steps.validate-copilot.outcome == 'failure') }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: release-notes-rejected-response
          path: ${{ runner.temp }}/release-notes-response.md
          if-no-files-found: ignore
          retention-days: 7

      # Join existing, external and Copilot paths. If none completed, export
      # NOTES_PENDING and skip assembly; otherwise require a real complete section.
      - id: notes
        name: Verify editorial release notes
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          EXISTING_NOTES: ${{ steps.notes-before.outputs.complete }}
          EXTERNAL_RESULT: ${{ steps.apply-external.outcome }}
          COPILOT_RESULT: ${{ steps.apply-copilot.outcome }}
          NOTES_REASON: ${{ steps.notes-route.outputs.reason }}
          DIFF_BYTES: ${{ steps.notes-route.outputs.diff_bytes }}
          SOURCE_FILES: ${{ steps.notes-route.outputs.source_files }}
          PROMPT_BYTES: ${{ steps.notes-route.outputs.prompt_bytes }}
          INSTALL_RESULT: ${{ steps.copilot-install.outcome }}
          PROVIDER_RESULT: ${{ steps.copilot.outcome }}
          VALIDATION_RESULT: ${{ steps.validate-copilot.outcome }}
        run: |
          set -euo pipefail
          if [[ "${EXISTING_NOTES}" != 'true' && "${EXTERNAL_RESULT}" != 'success' && "${COPILOT_RESULT}" != 'success' ]]; then
            # Successful handoff, not release success: later builds/gates stay off.
            echo 'complete=false' >> "${GITHUB_OUTPUT}"
            echo 'pending=true' >> "${GITHUB_OUTPUT}"
            {
              echo '### NOTES_PENDING: external release notes required'
              echo ''
              echo 'Download the **release-notes-handoff** artifact and give **prompt.txt** to your chosen AI.'
              echo "- Routing: ${NOTES_REASON}; diff bytes: ${DIFF_BYTES}; source files: ${SOURCE_FILES}; prompt bytes: ${PROMPT_BYTES}."
              echo "- Copilot setup: ${INSTALL_RESULT}; generation: ${PROVIDER_RESULT}; prose validation: ${VALIDATION_RESULT}."
              echo "In **Release qualification → Run workflow**, select **${GITHUB_REF_NAME}**, paste its single-line JSON into **external_notes** and run."
              echo 'See README.md in the bundle for CLI continuation when the dispatch button is not registered on main yet.'
              echo 'Copilot size routing or provider failure has paused assembly. No release qualification or PR has been produced.'
            } >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi
          php -r '
            require "scripts/release_lib.php";
            $section = \PhpGallery\Release\patch_notes_section(getcwd(), $argv[1]);
            exit($section !== null
              && !str_contains($section, "RELEASE_NOTES_TODO")
              && preg_match("/\\bTODO\\b/i", $section) !== 1 ? 0 : 1);
          ' "${RELEASE_VERSION}"
          echo "complete=true" >> "${GITHUB_OUTPUT}"
          echo "pending=false" >> "${GITHUB_OUTPUT}"

      # Retain the self-contained prompt/diff/template and identity manifest.
      # The runner exits successfully pending editorial work instead of waiting.
      - name: Export complete evidence for external release-note generation
        if: ${{ steps.notes.outputs.pending == 'true' }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: release-notes-handoff
          path: ${{ runner.temp }}/release-notes-handoff/
          if-no-files-found: error
          # Type: integer; Units: days; Scope: external editorial handoff artifacts.
          # Consumers: upload-artifact retention; Rationale: 30 days allow review without a waiting runner.
          retention-days: 30

      # Restore only the cache whose key hashes all locked toolchain inputs.
      # A miss selects explicit install/provision steps before verification.
      - id: tinytex-cache
        name: Restore cached TinyTeX
        if: ${{ steps.notes.outputs.complete == 'true' }}
        uses: actions/cache/restore@v6.1.0
        timeout-minutes: 3
        env:
          SEGMENT_DOWNLOAD_TIMEOUT_MINS: '2'
        with:
          path: ~/.TinyTeX
          key: tinytex-v2-ubuntu24.04-x86_64-${{ hashFiles('.github/texlive-lock.json', '.github/texlive-packages.txt', '.github/scripts/provision_tinytex.sh') }}

      # Install the locked bundle with bounded transport time; a cache miss is
      # an expected setup path, while an actual installation failure stops work.
      - name: Install locked TinyTeX bundle on cache miss
        if: ${{ steps.notes.outputs.complete == 'true' && steps.tinytex-cache.outputs.cache-hit != 'true' }}
        shell: bash
        timeout-minutes: 6
        run: timeout --kill-after=15s 300 bash .github/scripts/provision_tinytex.sh install

      # Install the frozen declared package set rather than resolving a fresh
      # unlocked environment; the provisioner owns provenance verification.
      - name: Provision frozen TeX Live packages on cache miss
        if: ${{ steps.notes.outputs.complete == 'true' && steps.tinytex-cache.outputs.cache-hit != 'true' }}
        shell: bash
        timeout-minutes: 11
        run: timeout --kill-after=15s 600 bash .github/scripts/provision_tinytex.sh provision

      # Verify the complete restored or provisioned toolchain before compilation.
      - name: Activate and verify locked TinyTeX
        if: ${{ steps.notes.outputs.complete == 'true' }}
        shell: bash
        run: bash .github/scripts/provision_tinytex.sh verify

      # Compile EN/CZ/DE/SV together. The first LaTeX pass produces index inputs;
      # makeindex and later passes settle indexes/references under one fixed epoch.
      - id: manuals
        name: Build all maintained manuals
        if: ${{ steps.notes.outputs.complete == 'true' }}
        shell: bash
        timeout-minutes: 3
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          # SOURCE_DATE_EPOCH is fixed by deterministic release preparation.
          export FORCE_SOURCE_DATE=1
          cd docs
          for base in PHP_Gallery_Manual PHP_Gallery_Manual_CZ PHP_Gallery_Manual_DE PHP_Gallery_Manual_SV; do
            echo "Manual ${base}: START"
            pdflatex -interaction=nonstopmode -halt-on-error "${base}.tex"
            makeindex "${base}.idx"
            pdflatex -interaction=nonstopmode -halt-on-error "${base}.tex"
            pdflatex -interaction=nonstopmode -halt-on-error "${base}.tex"
            echo "Manual ${base}: COMPLETE"
          done

      # Save a newly provisioned cache only after successful compilation proves
      # it usable; an existing exact cache does not need another save.
      - name: Save TinyTeX cache after successful manual build
        if: ${{ success() && steps.manuals.outcome == 'success' && steps.tinytex-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6.1.0
        timeout-minutes: 3
        with:
          path: ~/.TinyTeX
          key: ${{ steps.tinytex-cache.outputs.cache-primary-key }}

      # PDF bytes changed during compilation, so regenerate inventory first and
      # complete-file manifest last, after all managed content is final.
      - name: Refresh final integrity data after manual build
        if: ${{ steps.notes.outputs.complete == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          php scripts/generate_production_files.php
          if ! php scripts/generate_manifest.php --check; then
            php scripts/generate_manifest.php
          fi

      # Allow only release-owned paths, retain frozen main history before review
      # without changing the prepared tree, then publish under the release lease.
      # A retry may reuse identical bytes/history; differing concurrent work blocks.
      - id: commit
        name: Commit deterministic preparation to the release branch
        if: ${{ steps.notes.outputs.complete == 'true' }}
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          ORIGINAL_SHA: ${{ steps.initialize.outputs.candidate_sha }}
          INITIAL_MAIN_SHA: ${{ steps.origin.outputs.initial_main_sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          allowed='^(app/bootstrap\.php|app/core-manifest\.json|app/production-files\.json|README\.md|TESTING\.md|DATABASE\.md|ARCHITECTURE\.md|PATCH_NOTES\.md|release-metadata\.json|docs/PHP_Gallery_Manual(_CZ|_DE|_SV)?\.(tex|pdf))$'
          # Detect unexpected tracked/untracked output before staging anything.
          unexpected="$(
            git status --porcelain=v1 --untracked-files=all |
              sed -E 's/^.. //' |
              grep -Ev "${allowed}" || true
          )"
          if [[ -n "${unexpected}" ]]; then
            echo "Release preparation produced unexpected workspace paths:" >&2
            printf '%s\n' "${unexpected}" >&2
            exit 1
          fi

          git add -- \
            app/bootstrap.php app/core-manifest.json app/production-files.json \
            README.md TESTING.md DATABASE.md ARCHITECTURE.md PATCH_NOTES.md release-metadata.json \
            docs/PHP_Gallery_Manual.tex docs/PHP_Gallery_Manual.pdf \
            docs/PHP_Gallery_Manual_CZ.tex docs/PHP_Gallery_Manual_CZ.pdf \
            docs/PHP_Gallery_Manual_DE.tex docs/PHP_Gallery_Manual_DE.pdf \
            docs/PHP_Gallery_Manual_SV.tex docs/PHP_Gallery_Manual_SV.pdf

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git diff --cached --quiet; then
            git commit -m "chore(release): prepare v_${RELEASE_VERSION}"
          fi
          test "$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')" = "${INITIAL_MAIN_SHA}"
          # Link the frozen main before review, keeping every byte of the qualified prepared release.
          node --input-type=module <<'NODE'
          import {command} from './.github/scripts/release-promotion.mjs';
          import {linkReleaseHistory} from './.github/scripts/release-linear-sync.mjs';
          // Join the frozen main history before review, preserving Q's file tree.
          // A soft reset selects the linked commit without rewriting file bytes.
          const head=command('git',['rev-parse','HEAD']);
          const linked=linkReleaseHistory(head,process.env.INITIAL_MAIN_SHA,command);
          if(linked!==head) command('git',['reset','--soft',linked]);
          NODE
          if [[ "$(git rev-parse HEAD)" == "${ORIGINAL_SHA}" ]]; then
            echo "changed=false" >> "${GITHUB_OUTPUT}"
            echo "candidate_sha=${ORIGINAL_SHA}" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          git fetch origin "${GITHUB_REF_NAME}"
          remote_sha="$(git rev-parse "origin/${GITHUB_REF_NAME}")"
          if [[ "${remote_sha}" != "${ORIGINAL_SHA}" ]]; then
            # A rerun may rebuild the identical tree already committed by this workflow.
            # Reuse that current SHA without writing; any differing tree still fails the lease.
            if [[ "$(git rev-parse 'HEAD^{tree}')" == "$(git rev-parse "origin/${GITHUB_REF_NAME}^{tree}")" ]] &&
              git merge-base --is-ancestor "${INITIAL_MAIN_SHA}" "${remote_sha}"; then
              echo "Prepared tree already exists at current release head; reusing exact SHA."
              echo "changed=false" >> "${GITHUB_OUTPUT}"
              echo "candidate_sha=${remote_sha}" >> "${GITHUB_OUTPUT}"
              exit 0
            fi
            echo "Release branch changed during preparation; refusing stale write-back." >&2
            exit 1
          fi
          git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"

          echo "changed=true" >> "${GITHUB_OUTPUT}"
          echo "candidate_sha=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"

      # Check final inventory/manifest/release consistency and expose ready.
      # Determine installer scope separately from release metadata changes;
      # NOTES_PENDING exports ready=false without committing partial assembly.
      - id: final
        name: Verify prepared candidate state
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          NOTES_COMPLETE: ${{ steps.notes.outputs.complete }}
          PREPARED_SHA: ${{ steps.commit.outputs.candidate_sha }}
          ORIGIN_SHA: ${{ steps.initialize.outputs.candidate_sha }}
          SOURCE_BASE: ${{ steps.origin.outputs.source_base }}
          SELECTED_DEVELOP_SHA: ${{ steps.origin.outputs.selected_develop_sha }}
        run: |
          set -euo pipefail
          echo "version=${RELEASE_VERSION}" >> "${GITHUB_OUTPUT}"
          echo "candidate_sha=${PREPARED_SHA:-${ORIGIN_SHA}}" >> "${GITHUB_OUTPUT}"

          if [[ "${NOTES_COMPLETE}" != "true" ]]; then
            # Keep immutable origin available for the later external-note dispatch.
            echo "ready=false" >> "${GITHUB_OUTPUT}"
            echo "winapp_changed=false" >> "${GITHUB_OUTPUT}"
            echo "installer_required=false" >> "${GITHUB_OUTPUT}"
            {
              echo "### Release preparation"
              echo ""
              echo "- Version: \`${RELEASE_VERSION}\`"
              echo "- Source SHA: \`${ORIGIN_SHA}\`"
              echo "- Deterministic preparation: not committed while notes are pending"
              echo "- Editorial patch notes: **pending**"
              echo "- Release assembly: not completed"
              echo ""
              echo 'Continue using the release-notes-handoff artifact instructions above.'
            } >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi

          php scripts/generate_production_files.php --check
          php scripts/generate_manifest.php --check
          php scripts/check_release.php "${RELEASE_VERSION}"
          # Compare assembly changes against A separately from shipped WinApp
          # changes since the prior stable release; only the latter builds assets.
          integration_paths="$(git diff --name-only \
            "${SELECTED_DEVELOP_SHA}" "${PREPARED_SHA}" -- \
            winapp ':!winapp/tests' ':!winapp/README.md' ':!winapp/AGENTS.md')"
          if [[ -n "${integration_paths}" ]]; then echo 'winapp_changed=true' >> "${GITHUB_OUTPUT}"; else echo 'winapp_changed=false' >> "${GITHUB_OUTPUT}"; fi
          installer_paths="$(git diff --name-only \
            "${SOURCE_BASE}" "${SELECTED_DEVELOP_SHA}" -- \
            winapp ':!winapp/tests' ':!winapp/README.md' ':!winapp/AGENTS.md')"
          if [[ -n "${installer_paths}" ]]; then echo 'installer_required=true' >> "${GITHUB_OUTPUT}"; else echo 'installer_required=false' >> "${GITHUB_OUTPUT}"; fi
          echo "ready=true" >> "${GITHUB_OUTPUT}"
          {
            echo "### Release preparation"
            echo ""
            echo "- Version: \`${RELEASE_VERSION}\`"
            echo "- Candidate SHA: \`${PREPARED_SHA}\`"
            echo "- Production inventory: current"
            echo "- Integrity manifest: current"
            echo "- Release consistency: passed"
            echo "- Editorial patch notes: complete"
          } >> "${GITHUB_STEP_SUMMARY}"

  # Represent assembly success on exact Q and retain its provenance record.
  # Run on failures for diagnostics, but deliberately skip NOTES_PENDING;
  # a successful editorial handoff is not a qualified release candidate.
  release-gate:
    name: Release qualification gate
    if: ${{ always() && needs.coverage-owner.outputs.bootstrap == 'false' && !(needs.prepare.result == 'success' && needs.prepare.outputs.notes_pending == 'true') }}
    needs:
      - coverage-owner
      - prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      checks: write
    steps:

      # Require successful ready assembly and an unchanged remote release head.
      # The summary is evidence about exact Q, not another functional FULL run.
      - id: gate
        name: Summarize aggregate qualification
        shell: bash
        env:
          PREPARATION_RESULT: ${{ needs.prepare.result }}
          READY: ${{ needs.prepare.outputs.ready }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          CANDIDATE_SHA: ${{ needs.prepare.outputs.candidate_sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          {
            echo "### Release qualification gate"
            echo ""
            echo "- Version: \`${RELEASE_VERSION:-unresolved}\`"
            echo "- Candidate SHA: \`${CANDIDATE_SHA:-unresolved}\`"
            echo "- Preparation: **${PREPARATION_RESULT}**"
            echo "- Release inputs ready: **${READY:-false}**"
            echo "- Selected-develop A: \`${{ needs.prepare.outputs.selected_develop_sha }}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

          if [[ "${PREPARATION_RESULT}" != "success" ]]; then
            echo "Release preparation failed." >&2
            exit 1
          fi
          if [[ "${READY}" != "true" ]]; then
            echo "Release preparation is committed, but editorial release notes are still pending." >&2
            exit 1
          fi

          current_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${GITHUB_REF_NAME}" --jq '.object.sha')"
          # Successful assembly cannot authorize a subsequently advanced release.
          if [[ "${current_sha}" != "${CANDIDATE_SHA}" ]]; then
            echo "Release branch changed after preparation; this qualification is stale." >&2
            exit 1
          fi
          echo "Release inputs assembled from qualified protected develop."

      # Check out the selected snapshot; with.ref pins source identity where set.
      # with: controls checkout depth and whether Git credentials remain available.
      - uses: actions/checkout@v7.0.1
        if: ${{ always() && needs.prepare.outputs.candidate_sha != '' }}
        with:
          ref: ${{ needs.prepare.outputs.candidate_sha }}
          fetch-depth: 0
          persist-credentials: false

      # Select the Node runtime for repository MJS helpers/fixtures.
      # Package-manager caching is disabled for this framework-free source checkout.
      - uses: actions/setup-node@v7.0.0
        if: ${{ always() && needs.prepare.outputs.candidate_sha != '' }}
        with:
          node-version: '22'
          package-manager-cache: false

      # Build the lifecycle provenance record and exact-Q check payloads.
      # Record assembly outcome and protected-develop trust without inventing FULL.
      - name: Bind the result and retained record to the prepared SHA
        if: ${{ always() && needs.prepare.outputs.candidate_sha != '' }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CANDIDATE_SHA: ${{ needs.prepare.outputs.candidate_sha }}
          SOURCE_BASE: ${{ needs.prepare.outputs.source_base }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          BASE_TAG: ${{ needs.prepare.outputs.base_tag }}
          ORIGIN_COMMIT_SHA: ${{ needs.prepare.outputs.origin_commit_sha }}
          SELECTED_DEVELOP_SHA: ${{ needs.prepare.outputs.selected_develop_sha }}
          INITIAL_MAIN_SHA: ${{ needs.prepare.outputs.initial_main_sha }}
          PREVIOUS_STABLE_TAG: ${{ needs.prepare.outputs.previous_stable_tag }}
          PREVIOUS_STABLE_SHA: ${{ needs.prepare.outputs.previous_stable_sha }}
          PROVENANCE_JSON: ${{ needs.prepare.outputs.provenance_json }}
          READY: ${{ needs.prepare.outputs.ready }}
          GATE_OUTCOME: ${{ steps.gate.outcome }}
          RELEASE_TRUST_MODEL: protected-develop
          INTEGRATION_IDENTITY_JSON: ${{ needs.prepare.outputs.integration_identity_json }}
          WINAPP_CHANGED: ${{ needs.prepare.outputs.winapp_changed }}
          INSTALLER_REQUIRED: ${{ needs.prepare.outputs.installer_required }}
          OUTPUT_RECORD: ${{ runner.temp }}/release-candidate.json
          OUTPUT_CHECK: ${{ runner.temp }}/release-check.json
          OUTPUT_MATRIX_CHECK: ${{ runner.temp }}/prepared-matrix-check.json
        run: node .github/scripts/release-qualification-record.mjs

      # Publish SHA-bound release/required contexts from the recorded assembly
      # result so branch protection can evaluate the exact prepared candidate.
      - name: Publish exact release qualification checks
        if: ${{ always() && needs.prepare.outputs.candidate_sha != '' }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/check-runs" --method POST --input "${RUNNER_TEMP}/release-check.json"
          gh api "repos/${GITHUB_REPOSITORY}/check-runs" --method POST --input "${RUNNER_TEMP}/prepared-matrix-check.json"

      # Keep exact candidate/provenance evidence even on failure for diagnosis
      # and authenticated continuation; a retained record alone is not success.
      - name: Retain prepared candidate identity even when qualification is red
        if: ${{ always() && needs.prepare.outputs.candidate_sha != '' }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: release-qualification-record
          overwrite: true
          path: ${{ runner.temp }}/release-candidate.json
          if-no-files-found: error
          retention-days: 90

  # After the gate, build deterministic production attachments from exact Q
  # and retain them as Actions artifacts for later authenticated draft filling.
  assets:
    name: Prepare manual release assets
    needs: [prepare, release-gate]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:

      # Check out the selected snapshot; with.ref pins source identity where set.
      # with: controls checkout depth and whether Git credentials remain available.
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.candidate_sha }}
          fetch-depth: 0
          persist-credentials: false

      # Provision the PHP runtime/extensions used by the following central helper.
      # coverage: none avoids collecting code-coverage instrumentation here.
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: zip, mbstring
          coverage: none

      # Select the Node runtime for repository MJS helpers/fixtures.
      # Package-manager caching is disabled for this framework-free source checkout.
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'
          package-manager-cache: false

      # Retrieve retained outputs from earlier jobs into this runner's temporary
      # directory; jobs do not share their working filesystem.
      - uses: actions/download-artifact@v8.0.1
        with:
          path: ${{ runner.temp }}/qualification-evidence

      # Build attachments from verified Q, source base and retained evidence.
      # The asset helper checks complete content and records integrity digests.
      - name: Build deterministic production package and checksums
        env:
          CANDIDATE_SHA: ${{ needs.prepare.outputs.candidate_sha }}
          SOURCE_BASE: ${{ needs.prepare.outputs.source_base }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          CANDIDATE_WORKSPACE: ${{ github.workspace }}
          RELEASE_ASSETS: ${{ runner.temp }}/release-assets
          QUALIFICATION_EVIDENCE: ${{ runner.temp }}/qualification-evidence
        run: node .github/scripts/release-assets.mjs

      # Persist the listed evidence/output files beyond this ephemeral runner.
      # The artifact name identifies what downstream jobs or maintainers retrieve.
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: manual-release-assets
          path: ${{ runner.temp }}/release-assets/*
          if-no-files-found: error
          retention-days: 90

  # Build a Windows installer only when shipped companion inputs changed
  # relative to the previous release source. Otherwise completion preserves
  # the verified existing independent WinApp release assets.
  installer:
    name: Prepare Windows companion installer
    if: ${{ needs.prepare.outputs.installer_required == 'true' }}
    needs: [prepare, release-gate]
    runs-on: windows-2025
    timeout-minutes: 25
    permissions:
      contents: read
    steps:

      # Check out the selected snapshot; with.ref pins source identity where set.
      # with: controls checkout depth and whether Git credentials remain available.
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.candidate_sha }}
          persist-credentials: false

      # Use the declared Windows companion runtime and architecture for its
      # canonical installer build rather than the runner's incidental Python.
      - name: Select x64 CPython 3.14 for the installer
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          architecture: 'x64'
          check-latest: true

      # Probe runtime capability, require the hosted compiler, then accept exactly
      # one installer/update-metadata pair before retaining build outputs.
      - name: Build canonical installer with hosted Inno Setup
        shell: pwsh
        run: |
          $runtimeProbe = @'
          import json
          import sys
          sys.path.insert(0, 'winapp')
          from uploader.runtime_check import runtime_info
          print(json.dumps(runtime_info()))
          '@
          $runtimeProbe | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # Native process exit codes must be checked explicitly in PowerShell.
          $compiler = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (!(Test-Path -LiteralPath $compiler)) { throw 'BLOCKED hosted Inno Setup 6 is unavailable.' }
          python winapp/build_installer.py --iscc $compiler
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $installers = @(Get-ChildItem -LiteralPath winapp/dist -Filter '*.exe' -File -Recurse)
          # One installer and one update descriptor form the release attachment pair.
          $metadata = @(Get-ChildItem -LiteralPath winapp/dist -Filter 'winapp-update.json' -File -Recurse)
          if ($installers.Count -ne 1 -or $metadata.Count -ne 1) { throw 'BLOCKED ambiguous installer output.' }
          $artifactDirectory = Join-Path $env:RUNNER_TEMP 'winapp-release'
          New-Item -ItemType Directory -Path $artifactDirectory | Out-Null
          Copy-Item -LiteralPath $installers[0].FullName -Destination $artifactDirectory
          Copy-Item -LiteralPath $metadata[0].FullName -Destination $artifactDirectory

      # Persist the listed evidence/output files beyond this ephemeral runner.
      # The artifact name identifies what downstream jobs or maintainers retrieve.
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: manual-winapp-installer
          path: ${{ runner.temp }}/winapp-release/*
          if-no-files-found: error
          retention-days: 90

  # Join required attachments, allowing only the expected unchanged-installer
  # skip. Open/reuse the exact-Q bot PR and explicitly dispatch its observer;
  # this job never substitutes for the required human approval.
  propose:
    name: Open qualified release PR
    if: ${{ always() && needs.prepare.result == 'success' && needs.release-gate.result == 'success' && needs.assets.result == 'success' && (needs.installer.result == 'success' || needs.installer.result == 'skipped' && needs.prepare.outputs.installer_required == 'false') }}
    needs: [prepare, release-gate, assets, installer]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
      # Dispatch the existing completion filename at Q; GITHUB_TOKEN-created
      # PR/merge events are not the first-release bootstrap mechanism.
      actions: write
    steps:

      # Check out the selected snapshot; with.ref pins source identity where set.
      # with: controls checkout depth and whether Git credentials remain available.
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.candidate_sha }}
          persist-credentials: false

      # Select the Node runtime for repository MJS helpers/fixtures.
      # Package-manager caching is disabled for this framework-free source checkout.
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'
          package-manager-cache: false

      # Retrieve retained outputs from earlier jobs into this runner's temporary
      # directory; jobs do not share their working filesystem.
      - uses: actions/download-artifact@v8.0.1
        with:
          name: release-qualification-record
          path: ${{ runner.temp }}/release-record

      # Retrieve retained outputs from earlier jobs into this runner's temporary
      # directory; jobs do not share their working filesystem.
      - uses: actions/download-artifact@v8.0.1
        with:
          name: manual-release-assets
          path: ${{ runner.temp }}/release-assets

      # Consume the retained record and assets, open/reuse the bot PR, and
      # dispatch completion on Q explicitly. Human review remains a later gate.
      - name: Open or reuse exact-Q PR awaiting one human approval
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ACTION: open
          RELEASE_RECORD: ${{ runner.temp }}/release-record/release-candidate.json
          RELEASE_NOTES: ${{ runner.temp }}/release-assets/release-notes.md
          RELEASE_ASSETS: ${{ runner.temp }}/release-assets
        run: node .github/scripts/release-completion.mjs
