# Project: PHP Gallery
# Repository: https://github.com/klusik/PHP_gallery
# File: .github/workflows/release-reconciliation.yml
# Module Type: Protected Release Reconciliation Workflow
# Purpose: Inspect published release ancestry and request owner-reviewed synchronization into develop.
# Responsibilities:
#   - Keep read-only release inspection separate from protected branch-write credentials
#   - Prepare a reviewable single-parent working branch without pushing develop or requiring a PR
#   - Verify immutable published evidence and qualified exact-SHA reconciliation
# Author: Rudolf Klusal
name: Reviewed release reconciliation

on:
  workflow_dispatch:
    inputs:
      release_branch:
        description: Original published release/v_X.Y[.Z] identity.
        required: true
        type: string
      mode:
        description: Read-only plan, approved working proposal, or record an owner-performed FF.
        required: true
        type: choice
        default: plan
        options: [plan, propose, verify]
      result_sha:
        description: Exact Q or single-parent L already fast-forwarded by the owner.
        required: false
        type: string
      develop_base_sha:
        description: Exact develop HEAD observed before the owner FF.
        required: false
        type: string
      resolutions_json:
        description: Explicit per-path conflict decisions (JSON array); empty for conflict-free replay.
        required: false
        default: '[]'
        type: string
      manual_review:
        description: Owner acceptance reference required for propose/verify.
        required: false
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: reviewed-release-reconciliation-${{ inputs.release_branch }}
  cancel-in-progress: false

env:
  RELEASE_BRANCH: ${{ inputs.release_branch }}
  SYNC_MODE: ${{ inputs.mode }}
  SYNC_RESULT_SHA: ${{ inputs.result_sha }}
  SYNC_BASE_SHA: ${{ inputs.develop_base_sha }}
  SYNC_RESOLUTIONS: ${{ inputs.resolutions_json }}
  MANUAL_REVIEW: ${{ inputs.manual_review }}

jobs:
  inspect:
    if: ${{ inputs.mode == 'plan' }}
    name: Inspect published release and linear reconciliation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Inspect exact publication and reconciliation proof
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/scripts/release-reconciliation.mjs

  approved:
    if: ${{ inputs.mode != 'plan' }}
    name: Owner-approved working proposal or immutable acceptance record
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release-reconciliation
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Prepare working branch or verify owner FF without updating develop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/scripts/release-reconciliation.mjs
