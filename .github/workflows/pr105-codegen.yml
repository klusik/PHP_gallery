# Temporary deterministic codegen handoff for issue #103.
# This file is removed after the generated source plan has been committed.
name: PR105 generated plans
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: write
jobs:
  snapshot:
    if: ${{ github.event.pull_request.number == 105 && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Generate reviewed runtime modules and core manifest
        run: |
          php scripts/generate_runtime_modules.php
          php scripts/generate_manifest.php
          php scripts/generate_runtime_modules.php --check
          php scripts/generate_manifest.php --check
      - name: Commit generated sources to PR head
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/runtime/modules.php app/core-manifest.json
          if ! git diff --cached --quiet; then
            git commit -m 'build(runtime): regenerate module plan and integrity hashes (#103)'
            git push origin HEAD:${{ github.head_ref }}
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: pr105-generated-runtime-plan
          path: |
            app/runtime/modules.php
            app/core-manifest.json
          retention-days: 1
          if-no-files-found: error
