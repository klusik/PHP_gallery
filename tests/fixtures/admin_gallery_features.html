Module Type: Browser Test Fixture
Purpose: Verify immediate individual gallery controls with real gallery markup.
Responsibilities: Exercise exact scope, inherited maps, refusal and uncertain writes.
Author: Rudolf Klusal
License: MIT License (see LICENSE file in repository)

<html lang="en"><head><meta charset="utf-8"><title>Gallery feature controls</title>
<link rel="stylesheet" href="/public/assets/styles/base.css"><link rel="stylesheet" href="/public/assets/styles/public.css">
<link rel="stylesheet" href="/public/assets/styles/ui-button.css"><link rel="stylesheet" href="/public/assets/styles/admin.css">
<link rel="stylesheet" href="/public/assets/styles/admin-layout.css"><link rel="stylesheet" href="/public/assets/styles/admin-dashboard.css">
<link rel="stylesheet" href="/public/assets/styles/admin-reordering.css"><link rel="stylesheet" href="/public/assets/styles/admin-gallery-list.css">
<link rel="stylesheet" href="/public/assets/styles/side-panel.css"><link rel="stylesheet" href="/public/assets/styles/admin-cinematic.css">
</head><body class="admin-page"><main id="workspace" data-dashboard-read="galleries"><!-- PRODUCTION_GALLERY_MARKUP --></main><pre id="results"></pre>
<script type="module">
import {setupAdminGalleryFeatures} from '/public/assets/gallery-modules/admin-gallery-features.js';
const owner = document.getElementById('workspace');
const original = owner.innerHTML;
const requests = [];
const saved = new Map([['1:maps', 'inherit']]);
let writes = 0, assertions = 0, badPreview = false, lostReply = false;
let refreshes = 0;
const initialUrl = location.href;
/** Bound asynchronous fixture observations.
 * Type: number. Units: milliseconds. Scope: this fixture. Consumers: until.
 * Rationale: Five seconds allows hosted browsers to process small synthetic requests.
 */
const WAIT_LIMIT_MS = 5000;
/** Poll interval for owned fixture observations.
 * Type: number. Units: milliseconds. Scope: this fixture. Consumers: until.
 * Rationale: Ten milliseconds yields to browser work without busy-waiting.
 */
const WAIT_INTERVAL_MS = 10;

/** Assert observable fixture behavior.
 * @param {boolean} condition Required invariant.
 * @param {string} message Failure context.
 * @return {void} Counts an assertion or throws.
 */
function check(condition, message) { assertions++; if (!condition) throw new Error(message); }

/** Wait for an observable asynchronous completion.
 * @param {function():boolean} predicate Expected state.
 * @return {Promise<void>} Resolves on observation or rejects on deadline.
 */
async function until(predicate) {
    const deadline = Date.now() + WAIT_LIMIT_MS;
    while (!predicate()) {
        if (Date.now() > deadline) throw new Error('Feature control progress timeout');
        await new Promise(/** Yield to browser tasks. @param {function():void} resolve Continuation. @return {number} Timer handle. */ resolve => setTimeout(resolve, WAIT_INTERVAL_MS));
    }
}

/** Find a current production-rendered control.
 * @param {number} id Gallery identifier.
 * @param {string} key Feature identifier.
 * @return {HTMLButtonElement} Current icon.
 */
function chip(id, key) {
    return owner.querySelector(`[data-gallery-feature-root-id="${id}"][data-gallery-feature-key="${key}"]`);
}

/** Replace a simulated authoritative fragment with the remembered server state.
 * @return {void} Reinstalls the same production control markup.
 */
function refresh() {
    owner.innerHTML = original;
    for (const [identity, state] of saved) {
        const [id, key] = identity.split(':');
        const button = chip(Number(id), key);
        if (button) {
            button.dataset.galleryFeatureOwnState = state;
            button.dataset.galleryFeatureState = state;
        }
    }
    setupAdminGalleryFeatures();
    refreshes++;
}

/** Emulate distinct plan and apply endpoints without touching installation data.
 * @param {RequestInfo|URL} input Requested endpoint.
 * @param {RequestInit} options Transport and form payload.
 * @return {Promise<Response>} Synthetic JSON result, or a lost reply after commit.
 */
window.fetch = async (input, options = {}) => {
    check(options.method === 'POST' && options.body.get('csrf_token') === 'tree-fixture', 'POST and CSRF are retained');
    const intents = JSON.parse(options.body.get('intents'));
    requests.push({url: String(input), intents, fingerprint: options.body.get('fingerprint')});
    const intent = intents[0];
    check(intents.length === 1 && intent.scope === 'gallery', 'each click targets exactly one gallery');
    if (String(input) === '/fixture-feature-plan') {
        if (badPreview) return new Response('private diagnostic', {status: 500});
        return new Response(JSON.stringify({ok: true, plan: {
            fingerprint: 'a'.repeat(64), gallery_count: 1,
            scope: [{id: intent.root_id}], rows: [], change_count: 1,
        }}), {headers: {'Content-Type': 'application/json'}});
    }
    check(String(input) === '/fixture-feature-apply' && options.body.get('fingerprint') === 'a'.repeat(64), 'apply carries exact revalidated fingerprint');
    writes++;
    saved.set(`${intent.root_id}:${intent.feature}`, intent.enabled === null ? 'inherit' : intent.enabled ? 'on' : 'off');
    if (lostReply) throw new TypeError('synthetic lost reply');
    return new Response(JSON.stringify({ok: true, message: 'Saved.', mutation: {
        type: 'gallery.features.update', entity: 'gallery', action: 'update', entity_ids: [intent.root_id],
    }, panel: null, contexts: [], fallback: {redirect_url: '/index.php?page=admin'}}), {headers: {'Content-Type': 'application/json'}});
};
document.addEventListener('adminGalleryWorkspaceMutation', /** Emulate authoritative workspace refresh. @return {void} Replaces current fragment. */ () => refresh());

try {
    setupAdminGalleryFeatures(); setupAdminGalleryFeatures();
    check(!owner.querySelector('[data-gallery-feature-key="background"]'), 'background is read-only');
    check(chip(1, 'maps').dataset.galleryFeatureOwnState === 'inherit', 'production map control exposes inherited state');
    check(chip(2, 'maps').classList.contains('is-overriding-on')
        && chip(4, 'maps').classList.contains('is-inherit')
        && chip(4, 'maps').classList.contains('is-effective-off'),
        'overridden-on and inherited-off map states remain distinguishable');
    for (const expected of [true, false, null]) {
        const before = writes;
        chip(1, 'maps').click();
        await until(() => writes === before + 1 && refreshes >= before + 1);
        const applied = requests.filter(/** Select apply calls. @param {{url:string}} request Captured call. @return {boolean} Whether this is application. */ request => request.url === '/fixture-feature-apply').at(-1);
        check(applied.intents[0].enabled === expected && applied.intents[0].root_id === 1, 'map cycle sends inherited, on and off transitions to the selected row');
    }
    check(owner.querySelector('[data-gallery-feature-status]').textContent === 'Saved.', 'acknowledged feedback survives fragment replacement');
    const beforeFailure = writes;
    badPreview = true;
    chip(2, 'voting').click();
    await until(() => owner.querySelector('[data-gallery-feature-status]').textContent.includes('could not be saved'));
    check(writes === beforeFailure && !chip(2, 'voting').disabled && !owner.textContent.includes('private diagnostic'), 'failed preview does not write or expose raw diagnostics');
    badPreview = false;
    lostReply = true;
    const previousRefreshes = refreshes;
    chip(2, 'voting').click();
    await until(() => refreshes > previousRefreshes);
    check(writes === beforeFailure + 1 && saved.has('2:voting')
        && owner.querySelector('[data-gallery-feature-status]').textContent.includes('could not be confirmed'),
        'lost reply reconciles committed state without replay and preserves its warning');
    check(location.href === initialUrl && !owner.querySelector('dialog[open]'), 'immediate actions never navigate or open confirmation');
    document.getElementById('results').textContent = `BROWSER PASS ${assertions} assertions`;
} catch (error) {
    document.getElementById('results').textContent = `BROWSER FAIL ${error.message}`;
}
</script></body></html>
