<html lang="en">

<body class="public-page">

<div id="cards"></div>
<!-- Type: integer. Units: milliseconds. Scope: this fixture's slideshow.
Consumers: the production slideshow timing reader.
Rationale: 500 stable / 600 fade keeps an observable multi-frame fade in CI. -->
<div class="lightbox" data-lightbox data-lightbox-slideshow-visible-ms="500" data-lightbox-slideshow-transition-ms="600" hidden>
    <button class="lightbox-close lightbox-hud" data-lightbox-action="close">Close</button>
    <button class="lightbox-nav lightbox-previous lightbox-hud" data-lightbox-action="previous">&lt;</button>

                    <button data-lightbox-action="zoom-in">+</button>

        </figcaption>

</div>
<script type="module">
    import {setupGalleryLightbox, teardownGalleryLightbox}
        from '../../public/assets/gallery-modules/lightbox.js?v=20261030-smart-paint-v5';

    // Bound asynchronous fixture checkpoints, independently of slideshow speed.
    // Type: number. Units: milliseconds. Scope: one fixture checkpoint.
    // Consumers: waitFor. Rationale: 12000 allows decode/layout on hosted Chromium.
    const checkpointMs = 12000;
    // Geometry comparisons admit sampled JPEG boundary interpolation, not wrong fits.
    // Type: number. Units: relative fraction. Scope: fixture aspect comparisons.
    // Consumers: checkFit. Rationale: 0.025 admits at most 2.5% sample rounding.
    const aspectTolerance = 0.025;
    const viewer = document.querySelector('[data-lightbox]');
    const result = document.querySelector('#results');
    const errors = [];
    const canvasReads = [];
    const nativeRead = CanvasRenderingContext2D.prototype.getImageData;
    let refusePixels = false;
    let transitionObservations = 0;
    let outgoingFadeObservations = 0;
    const preview = new URL(location.href).searchParams.has('preview');
    const pixels = new URL(location.href).searchParams.has('pixels');
    const nativeFullscreen = new URL(location.href).searchParams.has('native');
    const smart = new URL(location.href).searchParams.has('smart');
    if (new URL(location.href).searchParams.has('touch')) {
        Object.defineProperty(navigator, 'maxTouchPoints', {value: 2, configurable: true});
        Object.defineProperty(navigator, 'userAgent', {value: 'Fixture Mobile', configurable: true});
    }
    const background = document.querySelector('#cards');
    let backgroundWrites = 0;
    let backgroundMutations = 0;
    let shellFrames = 0;
    let shellViolation = '';
    let shellFrameRequest = 0;
    let inertObserver = null;
    let restoreInertProbe = null;
    window.addEventListener('error', event => errors.push(event.message));
    window.addEventListener('unhandledrejection', event => errors.push(String(event.reason)));

    CanvasRenderingContext2D.prototype.getImageData = function (...args) {
        canvasReads.push({width: this.canvas.width, height: this.canvas.height});
        if (refusePixels) throw new DOMException('Controlled pixel refusal', 'SecurityError');
        return nativeRead.apply(this, args);
    };
    // Use the permanent CSS fullscreen fallback without depending on activation.
    if (!nativeFullscreen) {
        viewer.requestFullscreen = () => Promise.reject(new Error('Controlled refusal'));
    }

    /**
     * Observe shell DOM and computed styles on fullscreen animation-frame callbacks.
     * @returns {void} Records violations without modifying production viewer state.
     */
    function observeShellFrame() {
        if (!viewer.hidden && (viewer.classList.contains('is-fullscreen')
            || viewer.classList.contains('is-mobile-fullscreen'))) {
            const rect = viewer.getBoundingClientRect();
            const style = getComputedStyle(viewer);
            if (!viewer.isConnected || document.querySelector('[data-lightbox]') !== viewer
                || !background.inert || backgroundWrites || backgroundMutations
                || getComputedStyle(background).visibility !== 'hidden'
                || style.opacity !== '1' || style.display === 'none'
                || style.backgroundColor !== 'rgb(5, 5, 5)'
                || rect.left !== 0 || rect.top !== 0
                || rect.width !== innerWidth || rect.height !== innerHeight) {
                if (!shellViolation) {
                    shellViolation = `unstable shell: ${backgroundWrites} inert writes, `
                        + `${backgroundMutations} mutations, ${style.backgroundColor}, `
                        + `${rect.left}/${rect.top}/${rect.width}/${rect.height}`;
                    errors.push(shellViolation);
                }
            }
            shellFrames += 1;
        }
        shellFrameRequest = requestAnimationFrame(observeShellFrame);
    }

    /**
     * Count background writes separately from its final inert value.
     * @returns {void} Starts a per-frame shell probe after initial modal isolation.
     */
    function startShellObservation() {
        const nativeInert = Object.getOwnPropertyDescriptor(HTMLElement.prototype, 'inert');
        check(background.inert && typeof nativeInert?.set === 'function',
            'initial gallery must be isolated by native inert');
        Object.defineProperty(background, 'inert', {
            configurable: true,
            get: () => nativeInert.get.call(background),
            set: (value) => {
                backgroundWrites += 1;
                nativeInert.set.call(background, value);
            },
        });
        restoreInertProbe = () => { delete background.inert; };
        inertObserver = new MutationObserver(records => {
            backgroundMutations += records.length;
        });
        inertObserver.observe(background, {attributes: true, attributeFilter: ['inert']});
        shellFrameRequest = requestAnimationFrame(observeShellFrame);
    }

    /**
     * Generate a compressed scene with optional black or ambiguous mattes.
     * @param {number} id Stable fixture card identity.
     * @param {{x:number,y:number,width:number,height:number}} rect Pixel content rectangle inside the generated raster.
     * @param {string} color Content color, flat dark case, concert, dim-pair,
     * dim-left, sparse-left, flat-right, starfield-right, near-black-left,
     * blend-local or blend-public regression pattern.
     * @param {number} rasterHeight Structural source height; 720 models ordinary screenshots and 360 leaves native fullscreen letterboxing on the tested displays.
     * @returns {HTMLAnchorElement} Mounted card using an in-memory JPEG only.
     */
    function makeCard(id, rect, color = '#4aa6ce', rasterHeight = 720) {
        // Structural corpus dimensions model 16:9 or native-lane 32:9 sources;
        // no source file exists. The latter keeps a real backdrop probe visible.
        const canvas = document.createElement('canvas');
        canvas.width = 1280;
        canvas.height = rasterHeight;
        const context = canvas.getContext('2d');
        context.fillStyle = 'black';
        context.fillRect(0, 0, canvas.width, canvas.height);
        const blendPattern = color === 'blend-local' || color === 'blend-public';
        const dimPattern = blendPattern || ['dim-pair', 'dim-left', 'sparse-left',
            'flat-right', 'starfield-right', 'near-black-left'].includes(color);
        context.fillStyle = color === 'concert' ? '#050505'
            : dimPattern ? '#161616' : color;
        context.fillRect(rect.x, rect.y, rect.width, rect.height);
        if (dimPattern) {
            // Model dark game edges at levels 22--38: no strict level-40
            // transition, but genuine variation beside equal black pillars.
            const gradient = context.createLinearGradient(0, rect.y,
                0, rect.y + rect.height);
            gradient.addColorStop(0, '#161616');
            gradient.addColorStop(1, '#262626');
            context.fillStyle = gradient;
            context.fillRect(rect.x, rect.y, rect.width, rect.height);
            if (color === 'dim-left') {
                context.fillStyle = '#b0b0b0';
                context.fillRect(rect.x + rect.width * 0.75, rect.y,
                    rect.width * 0.25, rect.height);
            }
            if (color === 'sparse-left') {
                // Fewer than 15% lit pixels: the mean step must corroborate
                // the textured opposite edge, including real JPEG resampling.
                context.fillStyle = '#121212';
                context.fillRect(rect.x, rect.y, rect.width / 2, rect.height);
                context.fillStyle = '#232323';
                context.fillRect(rect.x, rect.y + rect.height * 0.4,
                    rect.width / 2, rect.height * 0.1);
            } else if (color === 'starfield-right') {
                // Texture stays below level 24 beside a genuine black pillar.
                const stars = context.createLinearGradient(0, rect.y,
                    0, rect.y + rect.height);
                stars.addColorStop(0, '#030303');
                stars.addColorStop(1, '#111111');
                context.fillStyle = stars;
                context.fillRect(rect.x + rect.width / 2, rect.y,
                    rect.width / 2, rect.height);
            } else if (color === 'near-black-left') {
                // The left scene passes the ordinary matte ceiling for more
                // than its paired-band tolerance. Neither edge passes the old
                // bright share, but the right scene has sustained variation.
                const dim = context.createLinearGradient(0, rect.y,
                    0, rect.y + rect.height);
                dim.addColorStop(0, '#060606');
                dim.addColorStop(1, '#0e0e0e');
                context.fillStyle = dim;
                context.fillRect(rect.x, rect.y, rect.width / 2, rect.height);
                context.fillStyle = '#101010';
                context.fillRect(rect.x + rect.width / 2, rect.y,
                    rect.width / 2, rect.height);
                context.fillStyle = '#404040';
                context.fillRect(rect.x + rect.width / 2,
                    rect.y + rect.height * 0.4,
                    rect.width / 2, rect.height * 0.1);
            } else if (blendPattern) {
                // Reproduce a dim edge opposite a bright scene and a single
                // sampled exterior line whose compressed mean crosses 4.
                const dim = context.createLinearGradient(0, rect.y,
                    0, rect.y + rect.height);
                dim.addColorStop(0, '#040404');
                dim.addColorStop(1, '#111111');
                context.fillStyle = dim;
                context.fillRect(rect.x, rect.y, rect.width / 2, rect.height);
                const bright = context.createLinearGradient(0, rect.y,
                    0, rect.y + rect.height);
                bright.addColorStop(0, '#5a5a5a');
                bright.addColorStop(1, '#6e6e6e');
                context.fillStyle = bright;
                context.fillRect(rect.x + rect.width / 2, rect.y,
                    rect.width / 2, rect.height);
                // Five source pixels map to one line in the 256-pixel sample.
                const stripWidth = canvas.width / 256;
                context.fillStyle = color === 'blend-public' ? '#050505' : '#020202';
                context.fillRect(rect.x + rect.width, rect.y,
                    stripWidth, rect.height);
                if (color === 'blend-public') {
                    // 49% level 6 and 51% level 5 approximate the observed 5.49.
                    context.fillStyle = '#060606';
                    context.fillRect(rect.x + rect.width, rect.y,
                        stripWidth, rect.height * 0.49);
                }
            } else if (color === 'flat-right') {
                // A dim wall supplies a mean jump but no per-line contrast.
                context.fillStyle = '#1b1b1b';
                context.fillRect(rect.x + rect.width / 2, rect.y,
                    rect.width / 2, rect.height);
            }
        } else if (color === 'concert') {
            // Model the reported screenshot's 50% bright upper edge and 20%
            // bright lower edge, retaining natural dim gradients at the sides.
            context.fillStyle = '#72a7d4';
            context.fillRect(rect.width * 0.3, rect.y,
                rect.width * 0.5, rect.height / 2);
            context.fillRect(rect.width * 0.7, rect.y + rect.height / 2,
                rect.width * 0.2, rect.height / 2);
            const gradient = context.createLinearGradient(0, 0, rect.width, 0);
            gradient.addColorStop(0, '#050505');
            gradient.addColorStop(0.1, '#191919');
            gradient.addColorStop(0.9, '#191919');
            gradient.addColorStop(1, '#050505');
            context.fillStyle = gradient;
            context.fillRect(0, rect.y, rect.width * 0.2, rect.height);
            context.fillRect(rect.width * 0.9, rect.y, rect.width * 0.1, rect.height);
        } else if (color !== '#191919') {
            context.fillStyle = '#dce9a0';
            context.fillRect(rect.x + rect.width / 4, rect.y + rect.height / 4,
                rect.width / 2, rect.height / 2);
            context.fillStyle = '#182e48';
            context.font = '36px sans-serif';
            context.fillText('VISIBLE CONTENT', rect.x + rect.width / 4,
                rect.y + rect.height / 2);
        }
        const card = document.createElement('a');
        // Quality 0.9 covers actual JPEG boundaries plus two lossy WebP
        // variants of the same synthetic scene, without shipped photographs.
        card.href = canvas.toDataURL(blendPattern ? 'image/webp' : 'image/jpeg', 0.9);
        Object.assign(card.dataset, {lightboxImage: '', imageId: String(id),
            fullSrc: card.href, previewSrc: card.href, imageWidth: '1280',
            imageHeight: String(rasterHeight), title: `Content-fit sample ${id}`});
        if (smart) {
            Object.assign(card.dataset, {
                sourceGalleryTitle: 'Source one',
                sourceGalleryBreadcrumb: 'Games › Source one',
                sourceGalleryUrl: '/gallery/source-one',
            });
        }
        card.textContent = `Sample ${id} `;
        document.querySelector('#cards').append(card);
        return card;
    }

    /**
     * Fail with the owning geometry or lifecycle assertion.
     * @param {boolean} condition Observed production behavior.
     * @param {string} message Failure evidence.
     * @returns {void} Throws for a failed expectation.
     */
    function check(condition, message) {
        if (!condition) throw new Error(message);
    }

    /**
     * Wait for a production-owned asynchronous checkpoint within one deadline.
     * @param {function():boolean} ready Predicate observing live viewer state.
     * @returns {Promise<void>} Resolves when ready, or rejects at the deadline.
     */
    async function waitFor(ready) {
        const deadline = performance.now() + checkpointMs;
        while (!ready()) {
            if (performance.now() > deadline) throw new Error('Content-fit checkpoint timeout');
            await new Promise(resolve => requestAnimationFrame(resolve));
        }
        // Let the decoded-node installation finish its guarded paint boundaries.
        await new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));
    }

    /**
     * Open the real viewer and observe the newly installed decoded image node.
     * @param {HTMLAnchorElement} card Target fixture source card.
     * @returns {Promise<void>} Resolves after current identity and decode commit.
     */
    async function openCard(card) {
        const outgoing = viewer.querySelector('[data-lightbox-img]');
        const outgoingStyle = outgoing?.getAttribute('style');
        const outgoingFrame = viewer.querySelector('[data-lightbox-zoom-surface]');
        const frameStyle = outgoingFrame.getAttribute('style');
        const wasDisplayed = !viewer.hidden && Boolean(outgoing?.getAttribute('src'));
        card.click();
        if (wasDisplayed) {
            check(outgoing.getAttribute('style') === outgoingStyle
                && outgoingFrame.getAttribute('style') === frameStyle,
                'navigation must retain outgoing crop/zoom pixels before replacement');
        }
        await waitFor(() => {
            checkTransitionFrame();
            return viewer.querySelector('[data-lightbox-img]')
                ?.dataset.lightboxImageId === card.dataset.imageId
                && !viewer.querySelector('.lightbox-transition-image');
        });
    }

    /**
     * Inspect the real incoming fade before it becomes the live zoom surface.
     * @returns {void} Throws for distorted geometry or background-contaminated blending.
     */
    function checkTransitionFrame() {
        const cover = viewer.querySelector('.lightbox-transition-image');
        if (!cover || !cover.complete || !cover.naturalWidth) return;
        const rect = cover.getBoundingClientRect();
        const style = getComputedStyle(cover);
        check(Math.abs(rect.width / rect.height
            / (cover.naturalWidth / cover.naturalHeight) - 1) < aspectTolerance,
            'incoming fade must retain full-source proportions before cropping');
        check(style.mixBlendMode === 'plus-lighter',
            'complementary fades must add light without a midpoint brightness dip');
        const figure = viewer.querySelector('[data-lightbox-stage]').closest('figure');
        check(cover.parentElement === figure
            && getComputedStyle(figure).isolation === 'isolate'
            && getComputedStyle(figure).backgroundColor === 'rgba(0, 0, 0, 0)',
            'photographs must blend against transparency without adding the overlay background');
        check(style.maxWidth === 'none' && style.maxHeight === 'none',
            'fullscreen image maxima must not shrink the incoming crop box');
        if (cover.classList.contains('is-visible')) {
            const outgoing = viewer.querySelector('[data-lightbox-zoom-surface]');
            check(outgoing.style.opacity === '0',
                'exposed outgoing pixels must fade instead of disappearing at commit');
            const opacity = Number(getComputedStyle(outgoing).opacity);
            if (opacity > 0 && opacity < 1) outgoingFadeObservations += 1;
        }
        transitionObservations += 1;
    }

    /**
     * Compare the canonical visible frame against an expected content aspect.
     * @param {number} aspect Expected content width divided by height.
     * @returns {void} Throws if fitting distorts or fits the saved full frame.
     */
    function checkFit(aspect) {
        const frame = viewer.querySelector('[data-lightbox-zoom-surface]').getBoundingClientRect();
        check(frame.width > 0 && frame.height > 0, 'visible stage must be nonzero');
        check(Math.abs(frame.width / frame.height / aspect - 1) < aspectTolerance,
            `wrong content aspect ${frame.width}/${frame.height}; expected ${aspect}`);
    }

    /**
     * Hold a screenshot checkpoint until the browser driver or a person advances it.
     * @param {HTMLButtonElement} advance Visible fixture-only continuation control.
     * @param {string} phase Unique covered/stable checkpoint identity.
     * @returns {Promise<void>} Resolves after the checkpoint's own click.
     */
    function capturePixelPhase(advance, phase) {
        advance.dataset.pixelPhase = phase;
        advance.textContent = `Continue ${phase}`;
        return new Promise(resolve => {
            advance.addEventListener('click', () => resolve(), {once: true});
        });
    }

    /**
     * Hold actual slideshow handoffs for pixel comparisons in both crop directions.
     * @param {HTMLAnchorElement[]} targets Uncropped then cropped source cards.
     * @returns {Promise<void>} Resolves after paused-fade, covered and live captures of each target.
     */
    async function checkSlideshowPixels(targets) {
        const sourceLink = viewer.querySelector('[data-lightbox-source-gallery] a');
        if (smart) check(sourceLink instanceof HTMLAnchorElement,
            'Smart playback must include its real source-gallery glass control');
        let sourceMutations = 0;
        const sourceObserver = smart ? new MutationObserver(records => {
            sourceMutations += records.length;
        }) : null;
        sourceObserver?.observe(sourceLink.parentElement, {
            childList: true, subtree: true, attributes: true, characterData: true,
        });
        const advance = document.createElement('button');
        advance.type = 'button';
        advance.dataset.pixelAdvance = '';
        // Keep the fixture control clear of both sampled photograph patches.
        advance.style.cssText = 'position:fixed;right:1rem;bottom:1rem;z-index:10';
        viewer.append(advance);
        const nativeDecode = HTMLImageElement.prototype.decode;
        let targetId = '';
        let releaseCommit = null;
        // Stall only the final live-node decode acknowledgement. The real CSS
        // fade finishes naturally; the incoming cover stays fully opaque while
        // the driver captures it, without replacing the production transition.
        HTMLImageElement.prototype.decode = function (...args) {
            const decoded = nativeDecode.apply(this, args);
            if (this.hasAttribute('data-lightbox-img')
                && this.dataset.lightboxImageId === targetId) {
                return decoded.then(() => new Promise(resolve => {
                    releaseCommit = resolve;
                }));
            }
            return decoded;
        };
        try {
            for (const [index, target] of targets.entries()) {
                targetId = target.dataset.imageId;
                releaseCommit = null;
                if (nativeFullscreen && index === 0) {
                    await capturePixelPhase(advance, 'manual-s');
                    await waitFor(() => viewer.matches(':fullscreen'));
                    check(document.fullscreenElement === viewer,
                        'trusted manual S must give the lightbox native fullscreen ownership');
                    check(getComputedStyle(viewer, '::backdrop').backgroundColor
                        === 'rgb(5, 5, 5)', 'native backing must match the opaque shell');
                } else {
                    viewer.querySelector('[data-lightbox-action="slideshow"]').click();
                }
                await waitFor(() => {
                    const incoming = viewer.querySelector('.lightbox-transition-image');
                    const opacity = incoming ? Number(getComputedStyle(incoming).opacity) : 0;
                    return incoming?.dataset.lightboxImageId === targetId
                        && opacity > 0 && opacity < 1;
                });
                const cover = viewer.querySelector('.lightbox-transition-image');
                const rect = cover.getBoundingClientRect();
                const outgoingRect = viewer.querySelector(
                    '[data-lightbox-zoom-surface]').getBoundingClientRect();
                // The cover retains the full source box; only its clipped
                // content can cover a probe. CSSOM serializes equal insets as
                // one/two/three values, using the ordinary four-side shorthand.
                const insets = cover.style.clipPath
                    ? cover.style.clipPath.slice('inset('.length, -1)
                        .split(' ').map(value => Number.parseFloat(value) / 100)
                    : [0, 0, 0, 0];
                check(insets.length >= 1 && insets.length <= 4
                    && insets.every(Number.isFinite),
                    `unexpected incoming clipping: ${cover.style.clipPath}`);
                const incomingVisible = {
                    left: rect.left + rect.width
                        * (insets[3] ?? insets[1] ?? insets[0]),
                    top: rect.top + rect.height * insets[0],
                };
                // The 5x5 raster patch centered at 24/24 must lie outside BOTH
                // visible image boxes, accounting for presentation clipping.
                // Its outer edge is 26/26: the inset avoids the shell's rounded
                // keyboard focus outline after trusted native fullscreen entry.
                // Fail on unsuitable geometry instead of calling photo pixels
                // a backdrop failure when native fullscreen resizes the viewport.
                check([incomingVisible, outgoingRect].every(
                    box => box.left > 26 || box.top > 26),
                    `backdrop probe overlaps a photo: ${JSON.stringify({
                        viewport: [innerWidth, innerHeight], incoming: incomingVisible,
                        outgoing: outgoingRect,
                    })}`);
                // These structural source fractions lie inside flat green/blue
                // patches, away from JPEG boundaries, matte edges and text.
                advance.dataset.pixelSamples = JSON.stringify([
                    {x: rect.left + rect.width / 2, y: rect.top + rect.height * 0.35},
                    {x: rect.left + rect.width / 2, y: rect.top + rect.height * 0.82},
                    // Both fits leave this inset corner outside photo/HUD/focus chrome.
                    {x: 24, y: 24},
                ]);
                const fadingLayers = [cover,
                    viewer.querySelector('[data-lightbox-zoom-surface]')];
                check(fadingLayers.every(layer => layer.getAnimations().some(
                    animation => animation.transitionProperty === 'opacity')),
                'each photograph layer must have its own real opacity transition');
                const animations = fadingLayers.flatMap(layer => layer.getAnimations());
                animations.forEach(animation => animation.pause());
                await capturePixelPhase(advance, `fading-${index}`);
                animations.forEach(animation => animation.play());
                await waitFor(() => releaseCommit !== null
                    && getComputedStyle(cover).opacity === '1');
                check(cover.dataset.lightboxImageId === targetId,
                    'pixel capture must retain the fully opaque target before handoff');
                await capturePixelPhase(advance, `covered-${index}`);
                releaseCommit();
                await waitFor(() => viewer.querySelector('[data-lightbox-img]')
                    ?.dataset.lightboxImageId === targetId
                    && !viewer.querySelector('.lightbox-transition-image'));
                viewer.querySelector('[data-lightbox-action="slideshow"]').click();
                if (smart) check(viewer.querySelector(
                    '[data-lightbox-source-gallery] a') === sourceLink,
                'unchanged Smart source links must retain their DOM and glass layer');
                check(viewer.dataset.lightboxContentFit
                    === (index === 0 ? 'original' : 'cropped'),
                    'pixel journey must switch from cropped to original and back');
                await capturePixelPhase(advance, `stable-${index}`);
            }
            check(shellFrames > 0 && backgroundWrites === 0 && backgroundMutations === 0,
                `automatic slides must retain uninterrupted modal isolation and backing: `
                    + `${shellFrames} frames, ${backgroundWrites} writes, ${backgroundMutations} mutations`);
            if (smart) {
                check(sourceMutations === 0,
                    `unchanged Smart source metadata must not mutate: ${sourceMutations}`);
                sourceObserver.disconnect();
                // The handoff gate has finished; ordinary metadata navigation
                // must use native decode rather than waiting for another capture.
                HTMLImageElement.prototype.decode = nativeDecode;
                Object.assign(targets[0].dataset, {
                    sourceGalleryTitle: 'Source two',
                    sourceGalleryBreadcrumb: 'Other games › Source two',
                    sourceGalleryUrl: '/gallery/source-two',
                });
                await openCard(targets[0]);
                check(viewer.querySelector('[data-lightbox-source-gallery] a') === sourceLink
                    && sourceLink.getAttribute('href') === '/gallery/source-two'
                    && sourceLink.title === 'Other games › Source two'
                    && sourceLink.getAttribute('aria-label') === 'Source gallery: Other games › Source two'
                    && sourceLink.querySelector('.lightbox-source-gallery-path').textContent
                        === 'Other games › Source two',
                'a new Smart source must update the existing accessible link');
                delete targets[1].dataset.sourceGalleryTitle;
                delete targets[1].dataset.sourceGalleryUrl;
                await openCard(targets[1]);
                const source = viewer.querySelector('[data-lightbox-source-gallery]');
                check(source.hidden && !source.hasChildNodes(),
                    'missing Smart source metadata must clear and hide the previous link');
            }
        } finally {
            sourceObserver?.disconnect();
            HTMLImageElement.prototype.decode = nativeDecode;
            advance.remove();
        }
    }

    const cards = [
        makeCard(1, {x: 256, y: 72, width: 768, height: 576}),
        makeCard(2, {x: 0, y: 90, width: 1280, height: 540}),
        makeCard(3, {x: 160, y: 0, width: 960, height: 720}),
        makeCard(4, {x: 0, y: 90, width: 1280, height: 540}, '#191919'),
        makeCard(5, {x: 0, y: 90, width: 1280, height: 540}),
        makeCard(6, {x: 0, y: 90, width: 1280, height: 540}, 'concert'),
        makeCard(7, {x: 160, y: 0, width: 960, height: 720}, 'dim-left'),
        makeCard(8, {x: 160, y: 0, width: 960, height: 720}, 'dim-pair'),
        makeCard(9, {x: 160, y: 0, width: 960, height: 720}, 'sparse-left'),
        makeCard(10, {x: 160, y: 0, width: 960, height: 720}, 'flat-right'),
        makeCard(11, {x: 160, y: 0, width: 960, height: 720}, 'starfield-right'),
        makeCard(12, {x: 160, y: 0, width: 960, height: 720}, 'near-black-left'),
        makeCard(13, {x: 160, y: 0, width: 960, height: 720}, 'blend-local'),
        makeCard(14, {x: 160, y: 0, width: 960,
            height: pixels && nativeFullscreen ? 320 : 720}, 'blend-public',
        pixels && nativeFullscreen ? 360 : 720),
    ];
    // Native fullscreen can choose a different screen aspect from emulation.
    // Wide sources keep the probe outside both crop/original fits. The ordinary
    // desktop/narrow/touch lanes retain their original 16:9 and 4:3 corpus.
    const pixelTargets = !pixels ? [] : nativeFullscreen ? [
        makeCard(15, {x: 0, y: 0, width: 1280, height: 360}, '#4aa6ce', 360),
        makeCard(16, {x: 256, y: 36, width: 768, height: 288}, '#4aa6ce', 360),
    ] : [
        makeCard(15, {x: 0, y: 0, width: 1280, height: 720}),
        makeCard(16, {x: 256, y: 72, width: 768, height: 576}),
    ];
    try {
        setupGalleryLightbox();
        await openCard(pixels ? cards[cards.length - 1] : cards[0]);
        startShellObservation();
        if (pixels) {
            await checkSlideshowPixels(pixelTargets);
            check(errors.length === 0, `browser errors: ${errors.join('; ')}`);
            result.textContent = 'BROWSER PASS: cropped/original slideshow pixel checkpoints.';
        } else if (preview) {
            result.textContent = 'MANUAL PREVIEW: content fitted; use ▣ for original frame.';
        } else {
            check(viewer.dataset.lightboxContentFit === 'cropped', 'four-sided JPEG matte must be detected');
            checkFit(4 / 3);
            const analysisMs = viewer.dataset.lightboxContentAnalysisMs;
            const readsBefore = canvasReads.length;
            viewer.querySelector('[data-lightbox-action="content-fit"]').click();
            checkFit(16 / 9);
            check(viewer.dataset.lightboxContentFit === 'original', 'original-frame override must be exposed');
            viewer.querySelector('[data-lightbox-action="content-fit"]').click();
            viewer.querySelector('[data-lightbox-action="zoom-in"]').click();
            checkFit(4 / 3);
            check(viewer.classList.contains('is-zoomed'), 'crop must retain normal zoom controls');
            viewer.querySelector('[data-lightbox-action="fullscreen"]').click();
            await waitFor(() => viewer.classList.contains('is-css-fullscreen'));
            checkFit(4 / 3);
            check(canvasReads.length === readsBefore, 'toggle/zoom/fullscreen must not resample');
            await openCard(cards[1]);
            checkFit(1280 / 540);
            await openCard(cards[2]);
            checkFit(4 / 3);
            await openCard(cards[5]);
            checkFit(1280 / 540);
            check(viewer.querySelector('[data-lightbox-img]').style.width === '100%',
                'natural dark side gradients must remain inside the fitted concert frame');
            for (const card of cards.slice(6)) {
                await openCard(card);
                checkFit(4 / 3);
                const image = viewer.querySelector('[data-lightbox-img]');
                check(parseFloat(image.style.left) < 0
                    && parseFloat(image.style.width) > 125,
                    'dim game content must remove both matching pillars');
            }
            await openCard(cards[3]);
            check(viewer.dataset.lightboxContentFit === 'original', 'ambiguous dark scene must be unchanged');
            refusePixels = true;
            await openCard(cards[4]);
            check(viewer.dataset.lightboxContentFit === 'original', 'pixel refusal must retain the original frame');
            refusePixels = false;
            const cachedReads = canvasReads.length;
            await openCard(cards[0]);
            checkFit(4 / 3);
            check(canvasReads.length === cachedReads, 'revisiting a photo must reuse its rectangle');
            check(canvasReads.every(read => read.width <= 256 && read.height <= 256),
                'every pixel read must remain within the documented sample budget');
            viewer.querySelector('[data-lightbox-action="slideshow"]').click();
            await waitFor(() => {
                checkTransitionFrame();
                return viewer.querySelector('[data-lightbox-img]')
                    ?.dataset.lightboxImageId === cards[1].dataset.imageId
                    && !viewer.querySelector('.lightbox-transition-image');
            });
            checkFit(1280 / 540);
            viewer.querySelector('[data-lightbox-action="slideshow"]').click();
            check(transitionObservations > 0,
                'manual and slideshow journeys must observe real incoming fade frames');
            check(outgoingFadeObservations > 0,
                'slideshow must observe a gradual outgoing fade for differing geometries');
            check(errors.length === 0, `browser errors: ${errors.join('; ')}`);
            result.textContent = `BROWSER PASS: content fit, JPEG, original override, zoom, fullscreen, cache and denied pixels. First analysis: ${analysisMs} ms.`;
        }
    } catch (error) {
        result.textContent = `BROWSER FAIL: ${error.stack}`;
    } finally {
        cancelAnimationFrame(shellFrameRequest);
        inertObserver?.disconnect();
        restoreInertProbe?.();
        CanvasRenderingContext2D.prototype.getImageData = nativeRead;
        if (!preview) teardownGalleryLightbox();
    }
</script>
</body>
</html>
