        check(typeTargets.every((element,index)=>Math.abs(parseFloat(getComputedStyle(element).fontSize)-defaultTypeSizes[index]*1.2)<0.1),width+' public type scale preserves the existing body, hero and card heading/copy hierarchy');
        const override=doc.createElement('style'); override.textContent='.public-page .site-main .gallery-card .gallery-card-body{padding:3px}'; doc.head.append(override); await settle();
        check(getComputedStyle(doc.querySelector('.gallery-card-body')).paddingTop==='3px',width+' final ordinary override wins against normal Theme rule'); override.remove();
        css.textContent=originalCss; await settle();
        check(getComputedStyle(header).backgroundColor===opaqueHeader && getComputedStyle(hero).backgroundColor===heroBackdrop,width+' resetting generated switch restores the previous header and hero');
    }
    document.getElementById('results').textContent='BROWSER PASS '+assertions+' Appearance assertions';
} catch(error) { document.getElementById('results').textContent='BROWSER FAIL '+error.message+'\n'+error.stack; }
</script></body></html>
