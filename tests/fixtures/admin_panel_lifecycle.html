/**

    revisions[3]++;
    document.getElementById('open-c').click(); await wait();

        result: {...success('3'), mutation: {type: 'api.update', entity: 'api_key', action: 'update', entity_ids: [91]}}, refreshPanel: true,

    await wait();
    check(field('form') === dirtyForm && field('[name="description"]').value === draftText, 'Unrelated successful mutation cannot clear the gallery text draft');
    const beforeFailure = posts; failPost = true; save(); await wait(); failPost = false;
    check(posts === beforeFailure + 1 && field('[name="description"]').value === draftText, 'Authentication/validation refusal retains the only text copy');

    holdPost = true; save(); await wait();
    type(field('[name="description"]'), 'Edited again while POST is pending');

    document.getElementById('open-c').click(); await wait();

    holdRefresh = true; type(field(), 'Saved C'); save(); await wait();
    check(pending.some(/** Confirm a successful save reached the existing coordinator refresh path. @param {FixtureGate} item Queued fixture request. @return {boolean} Whether it is a mutation refresh. */ item => item.kind === 'refresh'), 'Successful save reaches canonical refresh callback');

    release('refresh', '3'); await wait();
    check(field('[name="description"]').value === 'Typed during refresh', 'Delayed matching refresh cannot erase new typing');
    close(); draftAction('discard-continue'); await wait(310); holdRefresh = false;

    document.getElementById('open-a').click(); await wait(); holdRefresh = true;
    type(field(), 'Saved A'); save(); await wait();
    field('[data-gallery-side-panel-link]').click(); await wait();
    release('refresh', '1'); await wait(); holdRefresh = false;
    check(field().value === 'Server B' && field('[data-admin-side-panel-title]').textContent === 'Gallery B', 'Late mutation GET cannot replace another open workflow');

    const detachedRevisionField = field('[name="expected_edit_revision"]'); const detachedRevision = detachedRevisionField.value;

    close(); draftAction('keep-continue'); document.getElementById('open-c').click(); await wait();
    const cBody = field('form'); const cStatus = field('[data-admin-side-panel-status]').textContent;
    release('post', '2'); await wait(); holdPost = false;
    check(field('form') === cBody && field('[data-admin-side-panel-status]').textContent === cStatus, 'Detached POST completion preserves new panel body and status');
    check(detachedRevisionField.value === detachedRevision, 'Late response cannot advance a detached submitting form revision');
    close(); await wait(310);
    document.getElementById('open-b').click(); await wait();
    check(!field('[data-admin-panel-draft-action="restore"]'), 'Matching late success clears only B submitted draft');
    const firstBForm = field('form'); type(field(), 'Second B save'); save(); await wait();

    const secondBForm = field('form'); type(field(), 'Third B save'); save(); await wait();
    check(field('form') !== secondBForm && !field('[data-admin-panel-draft-action="restore"]'), 'Dynamically replaced save control stays intercepted and matching draft clears');

    const sequentialForm = field('form'); const conflictsBeforeSequential = revisionConflicts;

    const firstSavedRevision = String(revisions[2]);
    check(field('form') === sequentialForm && field('[name="expected_edit_revision"]').value === firstSavedRevision,

    check(revisionAtRefreshStart.get('2') === firstSavedRevision, 'Just-saved revision is acknowledged synchronously before refresh starts');
    check(!field('button[name="action"]').disabled, 'Original complete form is usable while its refresh is pending');
    holdRefresh = false; type(field(), 'Second sequential save'); save(); await wait();

    revisions[2]++;
    type(field(), 'Local edit after external writer'); field('[name="visibility"]').checked = true; save(); await wait();
    check(revisionConflicts === conflictsBeforeSequential + 1 && field('form') === secondSequentialForm

    close(); draftAction('discard-continue'); document.getElementById('open-b').click(); await wait();

    const supersededRevisionField = field('[name="expected_edit_revision"]'); const supersededRevision = supersededRevisionField.value;
    holdPost = true; type(field(), 'Older in-flight form submission'); save(); await wait();
    type(field(), 'Newer form submission'); save(); await wait();
    release('post', '2'); await wait(); holdPost = false;
    check(field('[name="expected_edit_revision"]') === supersededRevisionField && supersededRevisionField.value === supersededRevision
        && field().value === 'Newer form submission', 'Superseded same-form POST cannot acknowledge revision or overwrite the latest submitted text');
    close(); draftAction('discard-continue'); document.getElementById('open-b').click(); await wait();

    type(field('[name="description"]'), 'x'.repeat(ADMIN_PANEL_DRAFT_TEXT_LIMIT + 1));
    close();
    check(field('[data-admin-panel-draft-action="keep-continue"]') === null && field('[name="description"]').value.length > ADMIN_PANEL_DRAFT_TEXT_LIMIT, 'Memory cap blocks loss without truncating text');
    draftAction('discard-continue'); await wait(310);
    failGet = true; document.getElementById('open-a').click(); await wait(); failGet = false;
    check(field('[data-admin-side-panel-body] a') === document.activeElement, 'Load failure focuses the direct recovery link');
    key(document.activeElement, 'Escape'); await wait(310);
    check(panel().hidden, 'Escape closes an error panel');

    document.getElementById('open-a').click(); await wait(); holdOrder = true;
    field('[data-admin-image-name-sort]').click(); await wait();
    field('[data-gallery-side-panel-link]').click(); await wait();
    const orderReplacement = field('form'); const orderStatus = field('[data-admin-side-panel-status]').textContent;
    release('order', '1'); await wait(); holdOrder = false;
    check(lastOrderDetail?.panelOwner?.isCurrent() === false, 'Reordering event retains its pre-request owner');
    check(field('form') === orderReplacement && field('[data-admin-side-panel-status]').textContent === orderStatus, 'Late reordering completion cannot redraw the replacement editor');
    field('[data-admin-image-name-sort]').click(); await wait();
    check(lastOrderDetail?.panelOwner?.isCurrent() === true && field('form') !== orderReplacement, 'Current reorder event still refreshes its own editor');

    holdOrganizer = true; submitTool('[data-admin-metadata-organizer-apply-form]'); await wait(100);
    document.getElementById('open-c').click(); await wait();
    const organizerReplacement = field('form'); const organizerStatus = field('[data-admin-side-panel-status]').textContent;
    release('organizer', '2'); await wait(100); holdOrganizer = false;
    check(lastOrganizerDetail?.panelOwner?.isCurrent() === false, 'Organizer completion retains the owner captured before its batch loop');
    check(field('form') === organizerReplacement && field('[data-admin-side-panel-status]').textContent === organizerStatus, 'Late organizer completion cannot redraw the replacement editor');
    submitTool('[data-admin-metadata-organizer-apply-form]'); await wait(150);
    check(lastOrganizerDetail?.panelOwner?.isCurrent() === true && field('form') !== organizerReplacement, 'Current organizer completion reaches the canonical panel refresh');

    submitTool('[data-admin-panel-bulk-form]'); await wait();
    check(lastBulkParent === '42', 'Bulk move submits the enabled hidden parent and ignores disabled fallback');
    field('input[type="hidden"][name="new_gallery_parent_id"]:enabled').value = '0';
    submitTool('[data-admin-panel-bulk-form]'); await wait();
    check(lastBulkParent === '0', 'Bulk move preserves explicit root through the hidden picker field');
    const legacyParent = document.createElement('select'); legacyParent.name = 'new_gallery_parent_id'; legacyParent.innerHTML = '<option value="73">Legacy parent</option>';
    field('input[type="hidden"][name="new_gallery_parent_id"]:enabled').replaceWith(legacyParent);
    submitTool('[data-admin-panel-bulk-form]'); await wait();
    check(lastBulkParent === '73', 'Bulk move retains its legacy select compatibility');
    close(); await wait(310);

    revisionFieldNames[1] = 'edit_revision'; revisions[1] = 'a'.repeat(64);
    document.getElementById('open-a').click(); await wait(); type(field(), 'Opaque revision draft'); close(); draftAction('keep-continue');
    document.getElementById('open-a').click(); await wait();
    check(!field('[data-admin-panel-draft]').textContent.includes('revision'), 'Unchanged hexadecimal revision is recognized as a verified matching revision');
    close(); revisions[1] = 'b'.repeat(64); document.getElementById('open-a').click(); await wait();
    check(field('[data-admin-panel-draft]').textContent.includes('revision'), 'Changed hexadecimal revision requires review');
    draftAction('restore');
    check(field('[name="edit_revision"]').value === 'b'.repeat(64), 'Opaque draft restore preserves the new server precondition');
    save(); await wait();
    check(!field('[data-admin-panel-draft-action="restore"]'), 'Matching opaque-revision save clears only its submitted draft');
    close(); await wait(310);
    revisions[1] = 'a'.repeat(129);
    document.getElementById('open-a').click(); await wait(); type(field(), 'Oversized revision draft'); close(); draftAction('keep-continue');
    document.getElementById('open-a').click(); await wait();
    check(field('[data-admin-panel-draft]').textContent.includes('cannot be verified'), 'Oversized revision is unavailable even when the server repeats it');
    draftAction('discard'); close(); await wait(310);

    document.getElementById('open-create').click(); await wait();
    type(field(), 'We'); await wait(250);
    key(field(), 'Escape'); await wait();
    check(!panel().classList.contains('is-closing') && !field('[data-admin-panel-draft-action="keep-editing"]'), 'Title completion consumes Escape before drawer guard');
    type(field(), 'We'); await wait(250);
    check(key(field(), 'Tab') && field().value === 'West walk', 'Title completion keeps its intended Tab key');
    await wait(250);
    key(field(), 'Escape'); await wait();
    check(Boolean(field('[data-admin-panel-draft-action="keep-editing"]')), 'Next unclaimed Escape invokes inline dirty guard');
    draftAction('discard-continue'); await wait(310);

    document.getElementById('open-create').click(); await wait();
    type(field(), 'Created through drawer');
    field('[data-gallery-panel-create-form]').requestSubmit();
    await wait(120);
    const createdBody = field('[data-admin-side-panel-body]');
    const createdUrl = location.href;
    check(panel().dataset.adminSidePanelWorkflow === 'gallery-edit' && createdBody.querySelector('[name="title"]').value === 'Created through drawer', `Create lifecycle state: workflow=${panel().dataset.adminSidePanelWorkflow || ''}; title=${createdBody.querySelector('[name="title"]')?.value || ''}; status=${field('[data-admin-side-panel-status]')?.textContent || ''}; posts=${posts}; refreshes=${refreshes}`);
    check(createdBody.querySelector('[data-admin-tabs]').dataset.adminTabsBound === '1' && getComputedStyle(createdBody.querySelector('[data-admin-gallery-savebar]')).display !== 'none', 'Created gallery editor binds real anchor tabs and exposes the settings save bar');
    createdBody.querySelector('[data-admin-tab-target="admin-edit-api"]').click();
    check(createdBody.querySelector('[data-admin-tab-target="admin-edit-api"]').getAttribute('aria-selected') === 'true' && !createdBody.querySelector('#admin-edit-api').hidden && getComputedStyle(createdBody.querySelector('[data-admin-gallery-savebar]')).display !== 'none', 'Created gallery API tab activates in place and keeps gallery settings save available');
    createdBody.querySelector('[data-admin-tab-target="admin-edit-access"]').click();
    check(!createdBody.querySelector('#admin-edit-access').hidden && getComputedStyle(createdBody.querySelector('[data-admin-gallery-savebar]')).display !== 'none' && location.href === createdUrl, 'Created gallery Access tab and save bar work without changing the public URL');
    close(); await wait(310);

    for (let slot = 0; slot <= ADMIN_PANEL_DRAFT_LIMIT; slot++) {
        const id = String(100 + slot); titles[id] = 'Fixture ' + id; revisions[id] = 1;
        const opener = document.createElement('a');
        opener.id = 'capacity-' + id;
        opener.href = '/fixture-editor?id=' + id;
        opener.dataset.gallerySidePanelLink = '';
        opener.dataset.adminSidePanelWorkflow = 'gallery-edit';
        opener.textContent = 'Capacity fixture ' + id;
        document.getElementById('background').append(opener);
        opener.click(); await wait();
        type(field('[name="description"]'), 'Retained fixture ' + id); close();
        if (slot < ADMIN_PANEL_DRAFT_LIMIT) {
            check(Boolean(field('[data-admin-panel-draft-action="keep-continue"]')), 'Each available draft slot retains a full edit');
            draftAction('keep-continue');
        } else {
            check(!field('[data-admin-panel-draft-action="keep-continue"]'), 'Entity-count cap refuses implicit eviction');
            draftAction('discard-continue');
        }
    }
    document.getElementById('capacity-100').click(); await wait();
    check(Boolean(field('[data-admin-panel-draft-action="restore"]')), 'First retained draft survives capacity refusal');
    draftAction('discard'); close(); await wait(310);

    document.getElementById('open-c').click(); await wait();
    const replacementOpener = document.getElementById('open-c'); replacementOpener.remove();
    close(); await wait(310);
    check(document.activeElement.isConnected && !panel().contains(document.activeElement) && document.activeElement !== document.body, 'Removed opener restores a connected logical fallback');

    // The production renderer places settings panels inside one shared form and API after it.
    // A public/admin background can simultaneously retain older elements with the same panel IDs.
    const backgroundTabs = document.createElement('div');
    backgroundTabs.innerHTML = '<section id="admin-edit-identity" data-admin-tab-panel>Background identity</section><section id="admin-edit-api" data-admin-tab-panel>Background API</section><section id="admin-edit-access" data-admin-tab-panel>Background Access</section>';
    document.getElementById('background').append(backgroundTabs);
    document.getElementById('open-a').click(); await wait();
    const tabBody = field('[data-admin-side-panel-body]');
    const tabRoot = tabBody.querySelector('[data-admin-tabs]');
    const savebar = tabBody.querySelector('[data-admin-gallery-savebar]');
    const longHeading = field('[data-admin-side-panel-title]');

    field('.admin-side-panel-dialog').scrollTop = 400;
    await wait();
    const dialogRect = field('.admin-side-panel-dialog').getBoundingClientRect();

    field('.admin-side-panel-dialog').scrollTop = 0;
    check(tabRoot.dataset.adminTabsBound === '1' && getComputedStyle(savebar).display !== 'none', 'Production-shaped editor binds its anchor tabs and shows the shared save bar on Identity');
    tabBody.querySelector('[data-admin-tab-target="admin-edit-api"]').click();
    check(tabBody.querySelector('[data-admin-tab-target="admin-edit-api"]').getAttribute('aria-selected') === 'true' && !tabBody.querySelector('#admin-edit-api').hidden && tabBody.querySelector('#admin-edit-identity').hidden, 'API anchor switches the injected drawer content despite split form ownership and duplicate page IDs');
    check(getComputedStyle(savebar).display !== 'none', 'API keeps the gallery settings save bar available across tabs');
    tabBody.querySelector('[data-admin-copy-button]').click(); await wait();
    check(clipboardValue === 'https://fixture.invalid/upload/1' && location.href === originalUrl && !panel().hidden, 'Copy endpoint stays in the open drawer without navigation');
    tabBody.querySelector('[data-admin-tab-target="admin-edit-access"]').click();
    check(tabBody.querySelector('[data-admin-tab-target="admin-edit-access"]').getAttribute('aria-selected') === 'true' && !tabBody.querySelector('#admin-edit-access').hidden && tabBody.querySelector('#admin-edit-api').hidden, 'Access anchor switches back into the shared settings form');
    check(getComputedStyle(savebar).display !== 'none', 'Access shows the shared settings save bar');
    check(backgroundTabs.querySelector('#admin-edit-identity').hidden === false && location.href === originalUrl && !panel().hidden, 'Panel tab clicks preserve background editor, URL and open drawer');
    const beforeRerender = tabRoot;
    document.getElementById('open-b').click(); await wait();
    const rerenderedBody = field('[data-admin-side-panel-body]');
    check(rerenderedBody.querySelector('[data-admin-tabs]') !== beforeRerender && rerenderedBody.querySelector('[data-admin-tabs]').dataset.adminTabsBound === '1', 'Server-rendered replacement editor receives a fresh tab binding');
    rerenderedBody.querySelector('[data-admin-tab-target="admin-edit-api"]').click();
    check(!rerenderedBody.querySelector('#admin-edit-api').hidden && rerenderedBody.querySelector('#admin-edit-identity').hidden, 'Re-rendered production-shaped anchor tabs remain interactive');
    rerenderedBody.querySelector('[data-admin-copy-button]').click(); await wait();
    check(clipboardValue === 'https://fixture.invalid/upload/2' && location.href === originalUrl && !panel().hidden, 'Re-rendered copy control keeps working in place');
    close(); await wait(310);
    check(location.href === originalUrl && document === originalDocument, 'All mutations and guards preserve URL and document');
    check(localStorage.length === 0 && sessionStorage.length === 0, 'Drafts do not use persistent browser storage');
    document.getElementById('results').textContent = `BROWSER PASS: ${assertions} lifecycle, draft, race and modal focus assertions including native Tab/Shift-Tab/Escape; ${posts} explicit fixture POSTs, ${refreshes} coordinator refreshes.`;
} catch (error) {
    document.getElementById('results').textContent = 'BROWSER FAIL: ' + error.message;
}
