Responsibilities:

  - Keep preview documents scriptless, sandboxed, unsaved, and navigation-inert under native safe-link activation.

<html lang="en"><meta charset="utf-8"><title>Widget protected public preview contract</title>
<link rel="stylesheet" href="/widget-admin.css">
<body class="admin-page">
<main>
    <form action="/preview" method="post" data-public-widget-editor
        data-widget-i18n='{"desktop":"Desktop","tablet":"Tablet","mobile":"Mobile","close":"Close","reset_position":"Reset floating position","floating_hint":"Set floating location"}'
        data-widget-published-peers="[]">
        <input type="hidden" name="widget_id" value="cccccccccccccccccccccccccccccccc">
        <input type="hidden" name="sort_order" value="30">
        <input type="hidden" name="source_language" value="de">
        <label>Scope <select name="page_scope"><option value="home">Home</option><option value="gallery">Gallery</option><option value="all" selected>All</option></select></label>
        <label>Placement <select name="placement_mode"><option value="flow">Flow</option><option value="floating" selected>Floating</option></select></label>
        <fieldset data-widget-flow-controls>
            <label>Flow zone <select name="flow_slot"><option value="content_bottom">Below content</option><option value="home_before_grid">Before homepage grid</option><option value="right_rail">Right rail</option></select></label>
        </fieldset>
        <fieldset data-widget-floating-controls>
            <label>Anchor <select name="floating_anchor"><option value="bottom-right" selected>Bottom right</option><option value="custom">Custom</option></select></label>
            <label>X <input name="x_permille" type="number" value="900" min="0" max="1000"></label>
            <label>Y <input name="y_permille" type="number" value="900" min="0" max="1000"></label>
        </fieldset>
        <label>Width <input name="width_px" type="number" value="320" min="180" max="480"></label>
        <label>Appearance <select name="appearance"><option value="card" selected>Card</option><option value="minimal">Minimal</option></select></label>
        <input type="hidden" name="status" value="draft">
        <textarea data-widget-source name="content_md">Unsaved draft with a safe link.</textarea>
        <button type="submit" name="widget_action" value="save">Save</button>
    </form>
    <section data-widget-preview>
        <article class="public-content-widget public-content-widget--card">
            <h4 class="public-content-widget-title">Unsaved partner links</h4>
            <div data-widget-preview-body><p>Draft links: <a href="https://example.test/partner">Open the partner gallery</a></p></div>
        </article>
    </section>
    <section data-widget-theme-preview
        data-widget-preview-home-url="/index.php?page=home&amp;preview=visual&amp;view_as=anonymous"
        data-widget-preview-gallery-url="/index.php?page=gallery&amp;public_path=preview-gallery&amp;preview=visual&amp;view_as=anonymous">
        <h3>Protected public Theme preview</h3>
        <p role="status" data-widget-theme-status></p>
        <div class="public-widgets-theme-frame-wrap" data-widget-theme-frame-wrap hidden></div>
    </section>
    <pre id="results">BROWSER PENDING</pre>
</main>
<script type="module">
import {setupAdminPublicWidgets} from '/widget-admin.js';
import {readPublicWidgetFloatingGeometry, resolvePublicWidgetFloatingRect} from '/public-content-widgets.js';

const check = (condition, message) => { if (!condition) throw new Error(message); };
const pause = () => new Promise(resolve => setTimeout(resolve, 25));
const waitFor = async (condition, message) => {
    for (let attempt = 0; attempt < 240; attempt += 1) {
        if (condition()) return;
        await pause();
    }
    throw new Error(message);
};
const form = document.querySelector('[data-public-widget-editor]');
const host = document.querySelector('[data-widget-theme-preview]');
const startUrl = location.href;
let submissions = 0;
form.addEventListener('submit', event => { event.preventDefault(); submissions += 1; });
window.__widgetAdminSubmissionCount = () => submissions;

try {
    setupAdminPublicWidgets();
    const pageSelect = document.querySelector('[data-widget-preview-page-selector]');
    const frame = document.querySelector('.public-widgets-theme-frame');
    check(pageSelect?.closest('.public-widgets-placement-tools'),
        'The Admin placement tools own the protected Home/Gallery selector.');
    check(frame && frame.getAttribute('sandbox') === 'allow-same-origin',
        'Protected preview keeps same-origin access without scripts or forms.');
    check(!frame.hasAttribute('allow') && !frame.hasAttribute('allowfullscreen'),
        'Protected preview does not grant extra browser capabilities.');
    const devices = Array.from(document.querySelectorAll('.public-widgets-device-toggle button'));
    check(devices.length === 3, 'Admin positioning map retains desktop/tablet/mobile choices.');
    const chooseDevice = name => {
        const button = devices.find(candidate => candidate.textContent.trim().toLowerCase() === name);
        check(button, 'Missing Admin device option: ' + name);
        button.click();
    };
    const waitForPage = async page => {
        await waitFor(() => {
            const doc = frame.contentDocument;
            return pageSelect.value === page
                && frame.contentWindow?.location.search.includes('page=' + page)
                && doc?.body?.dataset.previewFixturePage === page
                && doc.querySelector('[data-widget-theme-draft]');
        }, 'Protected ' + page + ' preview did not render its unsaved draft.');
    };
    const measureFloatingHeight = widget => Math.ceil(widget.getBoundingClientRect().height);
    const checkDesktopGeometry = page => {
        const doc = frame.contentDocument;
        const win = frame.contentWindow;
        const draft = doc.querySelector('[data-widget-theme-draft]');
        check(doc.body.classList.contains('public-page'), page + ' preview uses the public document shell.');
        check(doc.querySelector('.site-header') && doc.querySelector('main.site-main') && doc.querySelector('.site-footer'),
            page + ' preview retains the real public header, content container and footer.');
        check(page === 'home'
            ? Boolean(doc.querySelector('.gallery-list-frame [data-public-gallery-index-grid]'))
                && !doc.querySelector('.public-gallery-detail')
            : Boolean(doc.querySelector('.hero[data-public-gallery-id] .public-gallery-detail'))
                && !doc.querySelector('.gallery-list-frame'),
            page + ' preview retains the expected Home grid or Gallery detail page container.');
        check(doc.querySelectorAll('[data-widget-theme-draft]').length === 1,
            page + ' preview contains exactly one unsaved draft article.');
        check(draft.lang === 'de', page + ' draft preserves the authored content language metadata.');
        const editedRecords = Array.from(doc.querySelectorAll(
            '[data-public-widget-id="cccccccccccccccccccccccccccccccc"]'));
        check(editedRecords.length <= 1 && editedRecords.every(node => node === draft),
            page + ' preview replaces the saved version with at most one projected draft.');
        check(draft.dataset.publicWidgetFloating === '1'
            && draft.dataset.publicWidgetWidth === '320'
            && draft.dataset.publicWidgetDismissLabel === 'Close'
            && draft.dataset.publicWidgetAnchor === 'bottom-right'
            && draft.dataset.publicWidgetX === '900'
            && draft.dataset.publicWidgetY === '900',
            page + ' draft exposes the same bounded placement attributes as a public widget.');
        check(doc.querySelectorAll('script').length === 0,
            page + ' document remains scriptless while Admin projects the draft.');
        const geometry = readPublicWidgetFloatingGeometry(doc, win);
        check(geometry.supported, page + ' desktop preview satisfies public floating viewport policy.');
        const map = document.querySelector('.public-widgets-placement-stage');
        const mapBounds = map.getBoundingClientRect();
        const mapLeft = mapBounds.left + map.clientLeft;
        const mapTop = mapBounds.top + map.clientTop;
        const project = rect => ({
            left: mapLeft + rect.left / geometry.viewportWidth * map.clientWidth,
            top: mapTop + rect.top / geometry.viewportHeight * map.clientHeight,
            width: rect.width / geometry.viewportWidth * map.clientWidth,
            height: rect.height / geometry.viewportHeight * map.clientHeight,
        });
        const matchesProjection = (element, rect) => {
            const rendered = element.getBoundingClientRect();
            const expected = project(rect);
            return Math.abs(rendered.left - expected.left) <= 1
                && Math.abs(rendered.top - expected.top) <= 1
                && Math.abs(rendered.width - expected.width) <= 1
                && Math.abs(rendered.height - expected.height) <= 1;
        };
        check(map.dataset.geometry === 'measured'
            && document.querySelectorAll('.public-widgets-exclusion-layer .public-widgets-restricted-guide').length
                === geometry.exclusions.length,
            page + ' Admin map uses measured public geometry and renders its exclusion rectangles.');
        const galleryActions = page === 'gallery'
            ? doc.querySelector('[data-widget-fixture-gallery-actions]') : null;
        if (galleryActions) {
            const actionBounds = galleryActions.getBoundingClientRect();
            const actionExclusion = geometry.exclusions.find(box =>
                Math.abs(box.left - actionBounds.left) <= 1
                && Math.abs(box.top - actionBounds.top) <= 1
                && Math.abs(box.width - actionBounds.width) <= 1
                && Math.abs(box.height - actionBounds.height) <= 1);
            check(actionExclusion,
                'Gallery preview geometry contains the actual rendered hero action cluster.');
            const candidateWidth = Math.min(480, Math.floor(geometry.viewportWidth * 0.45));
            const candidate = {
                anchor: 'top-right', x: 900, y: 100, width: candidateWidth,
                height: Math.ceil(geometry.viewportHeight * 0.4), viewportWidth: geometry.viewportWidth,
                viewportHeight: geometry.viewportHeight, topInset: geometry.topInset,
            };
            check(candidate.width >= 180 && candidate.width <= 480
                && candidate.width <= geometry.viewportWidth * 0.45,
            'Gallery action-collision candidate uses a supported panel width.');
            const unprotected = resolvePublicWidgetFloatingRect({...candidate, exclusions: geometry.exclusions
                .filter(box => box !== actionExclusion)});
            const protectedCandidate = resolvePublicWidgetFloatingRect({...candidate, exclusions: geometry.exclusions});
            const overlapsActions = unprotected && unprotected.left < actionBounds.right
                && unprotected.left + unprotected.width > actionBounds.left
                && unprotected.top < actionBounds.bottom && unprotected.top + unprotected.height > actionBounds.top;
            check(overlapsActions,
                'A valid tall top-right Gallery panel would overlap actions without protection (panel '
                + JSON.stringify(unprotected) + ', actions ' + JSON.stringify({
                    left: actionBounds.left, top: actionBounds.top, right: actionBounds.right, bottom: actionBounds.bottom,
                }) + ', top inset ' + geometry.topInset + ').');
            check(protectedCandidate && (protectedCandidate.left + protectedCandidate.width <= actionBounds.left
                || protectedCandidate.left >= actionBounds.right || protectedCandidate.top + protectedCandidate.height <= actionBounds.top
                || protectedCandidate.top >= actionBounds.bottom),
            'The shared Gallery solver keeps a top-right panel clear of rendered actions.');
        }
        const peers = Array.from(doc.querySelectorAll('[data-public-widget-floating="1"]'))
            .filter(widget => widget !== draft);
        check(peers.length === 1
            && (peers[0].compareDocumentPosition(draft) & win.Node.DOCUMENT_POSITION_FOLLOWING),
            page + ' published floating peer remains ahead of the draft in public document order.');
        const peer = peers[0];
        const peerBounds = peer.getBoundingClientRect();
        const expectedPeer = resolvePublicWidgetFloatingRect({
            anchor: peer.dataset.publicWidgetAnchor,
            x: Number(peer.dataset.publicWidgetX),
            y: Number(peer.dataset.publicWidgetY),
            width: Number(peer.dataset.publicWidgetWidth),
            height: measureFloatingHeight(peer),
            viewportWidth: geometry.viewportWidth,
            viewportHeight: geometry.viewportHeight,
            topInset: geometry.topInset,
            exclusions: geometry.exclusions,
        });
        check(peer.classList.contains('is-public-widget-floating')
            && expectedPeer
            && win.getComputedStyle(peer).position === 'fixed'
            && Math.abs(peerBounds.left - expectedPeer.left) <= 1
            && Math.abs(peerBounds.top - expectedPeer.top) <= 1
            && Math.abs(peerBounds.width - expectedPeer.width) <= 1
            && peerBounds.left >= 0 && peerBounds.top >= 0
            && peerBounds.right <= geometry.viewportWidth + 1
            && peerBounds.bottom <= geometry.viewportHeight + 1,
            page + ' published floating peer matches the shared solver before draft placement (actual '
                + JSON.stringify({left: peerBounds.left, top: peerBounds.top, width: peerBounds.width, height: peerBounds.height})
                + ', expected ' + JSON.stringify(expectedPeer) + ').');
        const expected = resolvePublicWidgetFloatingRect({
            anchor: draft.dataset.publicWidgetAnchor,
            x: Number(draft.dataset.publicWidgetX),
            y: Number(draft.dataset.publicWidgetY),
            width: Number(draft.dataset.publicWidgetWidth),
            height: measureFloatingHeight(draft),
            viewportWidth: geometry.viewportWidth,
            viewportHeight: geometry.viewportHeight,
            topInset: geometry.topInset,
            exclusions: [...geometry.exclusions, expectedPeer],
        });
        const actual = draft.getBoundingClientRect();
        check(expected && draft.classList.contains('is-public-widget-floating')
            && win.getComputedStyle(draft).position === 'fixed',
            page + ' preview applies the production public floating solver.');
        check(Math.abs(actual.left - expected.left) <= 1 && Math.abs(actual.top - expected.top) <= 1
            && Math.abs(actual.width - expected.width) <= 1,
            page + ' preview coordinates match the shared production geometry result.');
        const mapDraft = document.querySelector('.public-widgets-position-marker');
        const mapPeer = document.querySelector('.public-widgets-peer-marker');
        check(matchesProjection(mapDraft, actual) && matchesProjection(mapPeer, peerBounds),
            page + ' Admin draft and peer rectangles match their solved public rectangles.');
        const edgePadding = (geometry.viewportWidth - geometry.availableWidth
            - geometry.safeAreaInsets.left - geometry.safeAreaInsets.right) / 2;
        const safeRect = {
            left: edgePadding + geometry.safeAreaInsets.left,
            top: geometry.topInset,
            width: geometry.viewportWidth - edgePadding - geometry.safeAreaInsets.right
                - (edgePadding + geometry.safeAreaInsets.left),
            height: geometry.viewportHeight - edgePadding - geometry.safeAreaInsets.bottom - geometry.topInset,
        };
        check(matchesProjection(document.querySelector('.public-widgets-safe-area'), safeRect),
            page + ' Admin safe-area rectangle matches the public solver bounds.');
        const firstExclusion = geometry.exclusions[0];
        if (firstExclusion) check(matchesProjection(
            document.querySelector('.public-widgets-exclusion-layer .public-widgets-restricted-guide'), firstExclusion),
        page + ' Admin exclusion position matches its measured public control.');
        const header = doc.querySelector('.site-header').getBoundingClientRect();
        check(actual.left >= 0 && actual.top >= 0 && actual.right <= geometry.viewportWidth + 1
            && actual.bottom <= geometry.viewportHeight + 1
            && (actual.right <= header.left || actual.left >= header.right
                || actual.bottom <= header.top || actual.top >= header.bottom),
            page + ' floating draft stays within the viewport and clear of navigation.');
        const link = draft.querySelector('a');
        check(link?.textContent === 'Open the partner gallery', page + ' unsaved Markdown link remains visible.');
        const previewHref = win.location.href;
        link.dispatchEvent(new win.MouseEvent('click', {bubbles: true, cancelable: true}));
        check(win.location.href === previewHref, page + ' public links cannot navigate the protected preview.');
    };
    const checkMobileFallback = page => {
        const doc = frame.contentDocument;
        const win = frame.contentWindow;
        const draft = doc.querySelector('[data-widget-theme-draft]');
        const geometry = readPublicWidgetFloatingGeometry(doc, win);
        const bounds = draft.getBoundingClientRect();
        check(doc.documentElement.clientWidth === 390 && !geometry.supported,
            page + ' mobile preview uses the unsupported narrow public viewport.');
        check(document.querySelector('.public-widgets-placement-stage').dataset.geometry === 'unsupported'
            && document.querySelector('.public-widgets-safe-area').hidden,
            page + ' Admin map hides measured overlays when the public viewport uses flow fallback.');
        const map = document.querySelector('.public-widgets-placement-stage');
        const x = form.querySelector('[name="x_permille"]');
        const y = form.querySelector('[name="y_permille"]');
        const before = [x.value, y.value];
        check(map.getAttribute('aria-disabled') === 'true' && map.tabIndex === -1,
            page + ' unsupported public geometry disables the floating map for keyboard users.');
        const keyEvent = new KeyboardEvent('keydown', {key: 'ArrowRight', bubbles: true, cancelable: true});
        map.dispatchEvent(keyEvent);
        let captured = false;
        map.setPointerCapture = () => { captured = true; };
        const pointerEvent = new PointerEvent('pointerdown', {
            bubbles: true, cancelable: true, pointerId: 9, pointerType: 'pen', isPrimary: true,
            button: 0, clientX: 100, clientY: 100,
        });
        map.dispatchEvent(pointerEvent);
        check(!keyEvent.defaultPrevented && !pointerEvent.defaultPrevented && !captured
            && x.value === before[0] && y.value === before[1],
            page + ' unsupported floating geometry cannot capture input or mutate saved coordinates.');
        check(!draft.classList.contains('is-public-widget-floating')
            && win.getComputedStyle(draft).position !== 'fixed' && !draft.hidden,
            page + ' floating draft falls back to visible in-flow content on mobile.');
        check(bounds.width <= geometry.viewportWidth + 1
            && bounds.bottom > 0 && bounds.top < geometry.viewportHeight,
            page + ' mobile fallback remains within the page layout.');
        check(Array.from(doc.querySelectorAll('[data-public-widget-floating="1"]'))
            .every(widget => !widget.classList.contains('is-public-widget-floating')
                && win.getComputedStyle(widget).position !== 'fixed' && !widget.hidden),
            page + ' saved floating peers and the draft all remain visible in normal page flow on mobile.');
        check(draft.querySelector('a')?.textContent === 'Open the partner gallery',
            page + ' mobile fallback keeps authored links accessible.');
    };
    const checkFlowInsertion = async page => {
        const mode = form.querySelector('[name="placement_mode"]');
        const zone = form.querySelector('[name="flow_slot"]');
        mode.value = 'flow';
        zone.value = 'right_rail';
        mode.dispatchEvent(new Event('change', {bubbles: true}));
        await waitFor(() => {
            const draft = frame.contentDocument?.querySelector('[data-widget-theme-draft]');
            return draft?.closest('[data-public-widget-zone="right_rail"]');
        }, page + ' flow draft was not inserted in the selected public right rail.');
        const doc = frame.contentDocument;
        const win = frame.contentWindow;
        const draft = doc.querySelector('[data-widget-theme-draft]');
        const region = draft.closest('[data-public-widget-zone="right_rail"]');
        check(region.classList.contains('public-widget-region--right_rail')
            && !draft.hasAttribute('data-public-widget-floating')
            && !draft.classList.contains('is-public-widget-floating')
            && win.getComputedStyle(draft).position !== 'fixed',
            page + ' flow placement stays in its selected in-page public zone.');
        check(document.querySelector('.public-widgets-safe-area').hidden
            && document.querySelector('.public-widgets-position-marker').hidden,
            page + ' flow placement hides the floating geometry map.');
        check(draft.querySelector('a')?.textContent === 'Open the partner gallery',
            page + ' flow insertion keeps the unsaved draft content available.');
        const sameSlot = Array.from(region.children).filter(node => node.hasAttribute('data-public-widget-id'));
        check(sameSlot.at(-1) === draft && draft.dataset.publicWidgetSortOrder === '30',
            page + ' flow draft follows lower-order published widgets in its selected zone.');
        mode.value = 'floating';
        mode.dispatchEvent(new Event('change', {bubbles: true}));
        await waitForPage(page);
    };

    const checkHomeBeforeGridInsertion = async () => {
        const mode = form.querySelector('[name="placement_mode"]');
        const zone = form.querySelector('[name="flow_slot"]');
        mode.value = 'flow';
        zone.value = 'home_before_grid';
        zone.dispatchEvent(new Event('change', {bubbles: true}));
        await waitFor(() => {
            const draft = frame.contentDocument?.querySelector('[data-widget-theme-draft]');
            return draft?.closest('[data-public-widget-zone="home_before_grid"]');
        }, 'Homepage grid draft was not inserted into its public flow zone.');
        const doc = frame.contentDocument;
        const region = doc.querySelector('[data-public-widget-zone="home_before_grid"]');
        check(region.nextElementSibling === doc.querySelector('[data-preview-top-pagination]')
            && (region.compareDocumentPosition(doc.querySelector('[data-public-gallery-index-grid]'))
                & frame.contentWindow.Node.DOCUMENT_POSITION_FOLLOWING) !== 0,
            'Homepage before-grid preview appears before top pagination and the gallery grid.');
        mode.value = 'floating';
        mode.dispatchEvent(new Event('change', {bubbles: true}));
        await waitForPage('home');
    };
    const waitForNativePreviewDrag = async page => {
        const doc = frame.contentDocument;
        const win = frame.contentWindow;
        const draft = doc.querySelector('[data-widget-theme-draft]');
        const bounds = draft.getBoundingClientRect();
        const observation = {
            page,
            before: {
                anchor: form.querySelector('[name="floating_anchor"]').value,
                x: form.querySelector('[name="x_permille"]').value,
                y: form.querySelector('[name="y_permille"]').value,
                left: bounds.left,
                top: bounds.top,
            },
            adminUrl: location.href,
            previewUrl: win.location.href,
            document: doc,
            content: form.querySelector('[name="content_md"]').value,
            submissions,
            eventTrace: [],
        };
        window.__widgetAdminDirectDragObservation = observation;
        for (const type of ['pointerdown', 'pointermove', 'pointerup']) {
            doc.addEventListener(type, event => observation.eventTrace.push({
                type,
                trusted: event.isTrusted,
                pointerType: event.pointerType,
            }), true);
        }
        window.__widgetAdminDirectDragPage = page;
        const result = await new Promise(resolve => {
            window.__widgetAdminDirectDragResume = resolve;
        });
        check(result?.page === page && result.anchor === 'custom'
            && result.x !== observation.before.x && result.y !== observation.before.y,
        page + ' native drag in the actual Theme preview updates both unsaved custom coordinates.');
        check(Math.abs(result.left - observation.before.left) > 1 || Math.abs(result.top - observation.before.top) > 1,
            page + ' projected draft follows the direct preview drag.');
        check(result.adminUrl === observation.adminUrl && result.previewUrl === observation.previewUrl
            && result.sameDocument && result.submissions === observation.submissions
            && result.content === observation.content,
        page + ' direct preview dragging neither navigates nor saves or edits widget content.');
        check(observation.eventTrace.some(event => event.type === 'pointerdown' && event.trusted && event.pointerType === 'mouse')
            && observation.eventTrace.some(event => event.type === 'pointermove' && event.trusted && event.pointerType === 'mouse')
            && observation.eventTrace.some(event => event.type === 'pointerup' && event.trusted && event.pointerType === 'mouse'),
        page + ' drag is delivered as trusted native mouse PointerEvents inside the protected iframe.');
        window.__widgetAdminDirectDragPage = null;
        window.__widgetAdminDirectDragResume = null;
        window.__widgetAdminDirectDragObservation = null;
    };

    for (const page of ['home', 'gallery']) {
        pageSelect.value = page;
        pageSelect.dispatchEvent(new Event('change', {bubbles: true}));
        await waitForPage(page);
        checkDesktopGeometry(page);
        chooseDevice('mobile');
        await waitFor(() => frame.contentDocument?.documentElement.clientWidth === 390,
            page + ' mobile Theme viewport did not resize.');
        checkMobileFallback(page);
        chooseDevice('desktop');
        await waitFor(() => frame.contentDocument?.documentElement.clientWidth >= 960,
            page + ' desktop Theme viewport did not restore.');
        await waitForPage(page);
        await checkFlowInsertion(page);
        checkDesktopGeometry(page);
        if (page === 'home') await checkHomeBeforeGridInsertion();
    }
    pageSelect.value = 'home';
    pageSelect.dispatchEvent(new Event('change', {bubbles: true}));
    await waitForPage('home');
    await waitForNativePreviewDrag('home');
    const homePeer = frame.contentDocument.querySelector('[data-public-widget-id="bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb"]');
    homePeer.querySelector('.public-widget-dismiss').click();
    check(homePeer.hidden, 'A Home visitor can dismiss the published floating peer in the Home preview.');
    pageSelect.value = 'gallery';
    pageSelect.dispatchEvent(new Event('change', {bubbles: true}));
    await waitForPage('gallery');
    await waitForNativePreviewDrag('gallery');
    const galleryPeer = frame.contentDocument.querySelector('[data-public-widget-id="bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb"]');
    check(galleryPeer && !galleryPeer.hidden,
        'A Home dismissal does not carry into a fresh Gallery page preview for the same all-scope widget.');
    const language = form.querySelector('[name="source_language"]');
    language.value = 'xx';
    language.dispatchEvent(new Event('input', {bubbles: true}));
    await waitFor(() => frame.contentDocument?.querySelector('[data-widget-theme-draft]')?.lang === 'en',
        'An unsupported draft language falls back to the public renderer default.');
    language.value = 'de';
    language.dispatchEvent(new Event('input', {bubbles: true}));
    await waitFor(() => frame.contentDocument?.querySelector('[data-widget-theme-draft]')?.lang === 'de',
        'Restoring a supported draft language updates the projected article metadata.');
    const dismissibleDraft = frame.contentDocument.querySelector('[data-widget-theme-draft]');
    const close = dismissibleDraft.querySelector('.public-widget-dismiss');
    close.click();
    check(dismissibleDraft.hidden && location.href === startUrl,
        'The projected public close control hides only its panel without leaving Admin.');
    const x = form.querySelector('[name="x_permille"]');
    x.value = '910';
    x.dispatchEvent(new Event('input', {bubbles: true}));
    await waitFor(() => frame.contentDocument?.querySelector('[data-widget-theme-draft]')?.hidden,
        'A form refresh restored the dismissed public draft instead of preserving its preview state.');
    check(host.dataset.widgetPreviewHomeUrl.includes('page=home')
        && host.dataset.widgetPreviewGalleryUrl.includes('page=gallery'),
        'Home and Gallery use distinct controller-provided protected preview routes.');
    check(submissions === 0 && location.href === startUrl
        && form.querySelector('[name="content_md"]').value === 'Unsaved draft with a safe link.',
        'Preview geometry does not submit, navigate the Admin page, or change authored input.');
    document.getElementById('results').textContent =
        'BROWSER PASS: widget protected Home/Gallery floating geometry, flow insertion and mobile flow fallback';
} catch (error) {
    document.getElementById('results').textContent = 'BROWSER FAIL: ' + error.message;
}
</script>
</body></html>
