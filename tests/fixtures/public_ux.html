Module Type: Browser Regression Fixture
Purpose: Protect responsive public geometry, focus, route context and gestures.
Responsibilities: Run real public CSS and viewer code in bounded frame sizes.
Author: Rudolf Klusal

<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Public UX regression</title>
<link rel="stylesheet" href="/public/assets/styles/public.css">
<link rel="stylesheet" href="/public/assets/styles/public-shared.css">
<link rel="stylesheet" href="/public/assets/styles/lightbox.css">
<link rel="stylesheet" href="/public/assets/styles/mobile-gallery.css">
<style>
    :root { --ink:#f4f7fa; --panel:#243343; --paper:#132030;
        --field:#243343; --muted:#b7c3d0; --line:#526275;
        --accent:#9a7044; --accent-dark:#9a7044; --radius:12px; }
    body { margin:0; background:var(--paper); color:var(--ink); }
    :root[data-skin="near-black"] { --panel:#151a22; --paper:#090c12; }
    #results { white-space:pre-wrap; }
    iframe { border:0; display:block; }
    .fixture-photo { display:inline-block; padding:8px; }
</style>
<body class="public-page">
<pre id="results">RUNNING</pre>
<header class="site-header">
    <a class="public-language-button" hreflang="en" href="/?lang=en">English</a>
    <a data-public-login-return href="/index.php?page=admin_login">Login</a>
</header>
<section class="grid public-tag-gallery-grid grid-columns-3">
    <article class="gallery-card"><p>Long tag description remains readable.</p>
        <a class="tag" href="#tag">a-very-long-tag-with-a-readable-label</a>
    </article>
    <article class="gallery-card"><p>Second result.</p></article>
</section>
<div class="gallery-attachment-applets">
    <section class="gallery-pdf-documents"><h3>Documents</h3>
        <table class="gallery-pdf-table"><thead><tr><th>File</th></tr></thead>
            <tbody><tr><td><a href="#pdf">Document</a></td></tr></tbody></table>
    </section>
</div>
<section class="map-dialog"><h2>Map</h2><p class="muted map-attribution-note">Attribution</p></section>
<div id="cards"></div>
<div class="lightbox" data-lightbox hidden aria-label="Photo viewer"
    data-lightbox-maps-enabled="0" data-lightbox-transition-ms="0">
    <button class="lightbox-close lightbox-hud" data-lightbox-action="close">Close</button>
    <span class="lightbox-mobile-counter lightbox-hud" data-lightbox-counter></span>
    <button class="lightbox-nav lightbox-previous lightbox-hud" data-lightbox-action="previous">Previous</button>
    <figure>
        <button class="lightbox-stage-link" data-lightbox-stage data-lightbox-zoom-viewport>
            <span class="lightbox-zoom-surface" data-lightbox-zoom-surface><img data-lightbox-img alt="Photo"></span>
        </button>
        <figcaption class="lightbox-meta"><div class="lightbox-toolbar">
            <span data-lightbox-counter></span>
            <span data-lightbox-zoom-controls class="lightbox-zoom-controls">
                <button data-lightbox-action="zoom-out">−</button>
                <button data-lightbox-action="zoom-reset"><span data-lightbox-zoom-status>100%</span></button>
                <button data-lightbox-action="zoom-in">+</button>
            </span>
            <button class="lightbox-fullscreen-link" data-lightbox-action="fullscreen">F fullscreen</button>
            <button class="lightbox-map-button" data-lightbox-map hidden>Map</button>
        </div><h2 data-lightbox-title></h2><p data-lightbox-description></p></figcaption>
    </figure>
    <button class="lightbox-nav lightbox-next lightbox-hud" data-lightbox-action="next">Next</button>
    <button class="lightbox-fullscreen-button lightbox-hud" data-lightbox-action="fullscreen">F</button>
    <button class="lightbox-map-hud-button lightbox-hud" data-lightbox-map hidden>M</button>
</div>
<script type="module">
import {setupGalleryLightbox, teardownGalleryLightbox}
    from '/public/assets/gallery-modules/lightbox.js';

const params = new URLSearchParams(location.search);
const result = document.querySelector('#results');
window.addEventListener('error', (event) => {
    const error = event.error?.stack || event.message;
    if (params.has('case')) {
        parent.postMessage({type:'public-ux-case',ok:false,error}, location.origin);
    } else result.textContent = `BROWSER FAIL: ${error}`;
});
if (!params.has('case')) {
    // These are regression boundary vectors: report widths and rotated landscape.
    const cases = [[320,740,false], [390,844,false], [320,740,true],
        [390,844,true], [740,320,true]];
    let index = 0;
    const frame = document.createElement('iframe');
    document.body.replaceChildren(result, frame);
    const launch = () => {
        const [width,height,touch] = cases[index];
        frame.width = width; frame.height = height;
        frame.src = `/?case=1&touch=${Number(touch)}&view_as=anonymous&lang=en`;
    };
    window.addEventListener('message', (event) => {
        if (event.origin !== location.origin || event.source !== frame.contentWindow) return;
        if (event.data?.type !== 'public-ux-case') return;
        if (!event.data.ok) {
            result.textContent = `BROWSER FAIL: ${cases[index]}: ${event.data.error}`;
            return;
        }
        index += 1;
        if (index === cases.length) {
            result.textContent = 'BROWSER PASS: 320/390 geometry, landscape, tags, '
                + 'modal focus/wrap/restore, map availability, route/language context, '
                + 'mobile swipe, zoom, pinch and handoff.';
        } else launch();
    });
    launch();
} else {
    const touchPointers = new Set();
    /**
     * Fail an isolated case when a visible behavioral contract differs.
     * @param {boolean} value Whether the expected contract holds.
     * @param {string} message Regression description.
     * @returns {void} Continues on success or throws on failure.
     */
    function check(value, message) { if (!value) throw new Error(message); }

    /**
     * Await a viewer postcondition across its decode and gesture tasks.
     * @param {function():boolean} condition Observable ready-state predicate.
     * @param {string} label Failure context.
     * @returns {Promise<void>} Resolves at the postcondition or rejects at deadline.
     */
    async function until(condition, label) {
        /* Type: number. Units: ms. Scope: one fixture postcondition.
           Consumers: decode/gesture waits. Rationale: 5000 allows cold modules
           and image decoding while exposing a stalled viewer promptly. */
        const deadlineMs = 5000;
        const start = performance.now();
        while (!condition()) {
            if (performance.now() - start > deadlineMs) throw new Error(label);
            await new Promise(resolve => requestAnimationFrame(resolve));
        }
    }

    const mobile = params.get('touch') === '1';
    if (mobile) {
        Object.defineProperty(navigator, 'maxTouchPoints', {value:2,configurable:true});
        Object.defineProperty(navigator, 'userAgent', {value:'Fixture Mobile',configurable:true});
    }
    const overlay = document.querySelector('[data-lightbox]');
    const stage = overlay.querySelector('[data-lightbox-stage]');
    const cards = [];
    const media = 'data:image/svg+xml,' + encodeURIComponent(
        '<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1200"><rect width="1800" height="1200" fill="steelblue"/></svg>');
    // Three images exercise a successful swipe and navigation reset without wrap.
    for (let id=1; id<=3; id+=1) {
        const card = document.createElement('a');
        card.className = 'fixture-photo';
        card.href = `/?photo=${id}`;
        Object.assign(card.dataset, {lightboxImage:'',imageId:String(id),galleryId:'7',
            pageUrl:card.href,galleryUrl:'/?case=1&touch=' + Number(mobile),
            title:`Photo ${id}`,imageWidth:'1800',imageHeight:'1200',
            previewSrc:media,fullSrc:media});
        card.textContent = `Photo ${id}`;
        cards.push(card); document.querySelector('#cards').append(card);
    }

    /**
     * Dispatch deterministic touchscreen input through the production listeners.
     * @param {string} type Native touch event name.
     * @param {Array<[number,number,number]>} points Identifier and viewport X/Y.
     * @param {Array<[number,number,number]>} ended Released touches for touchend.
     * @returns {void} Delivers one cancelable touch task to the real stage.
     */
    function touch(type, points, ended = []) {
        // Chromium emits both PointerEvents (pinch/pan) and TouchEvents (swipe).
        // Preserve that production event order instead of testing only one API.
        const changes = type === 'touchend' ? ended : points;
        changes.forEach(([pointerId,clientX,clientY]) => {
            if (type === 'touchstart' && touchPointers.has(pointerId)) return;
            const pointerType = type === 'touchstart' ? 'pointerdown'
                : (type === 'touchend' ? 'pointerup' : 'pointermove');
            stage.dispatchEvent(new PointerEvent(pointerType, {
                pointerId,clientX,clientY,pointerType:'touch',
                isPrimary:pointerId === 1,button:0,bubbles:true,cancelable:true,
            }));
            if (type === 'touchend') touchPointers.delete(pointerId);
            else touchPointers.add(pointerId);
        });
        const convert = ([identifier,clientX,clientY]) => new Touch({
            identifier,target:stage,clientX,clientY,screenX:clientX,screenY:clientY,
        });
        const touches = points.map(convert);
        stage.dispatchEvent(new TouchEvent(type, {bubbles:true,cancelable:true,
            touches,targetTouches:touches,changedTouches:(ended.length ? ended : points).map(convert)}));
    }

    /**
     * Measure foreground contrast against composed solid fixture surfaces.
     * @param {HTMLElement} element Text target on the representative dark Theme.
     * @returns {number} WCAG relative-luminance contrast ratio.
     */
    function textContrast(element) {
        const canvas = document.createElement('canvas');
        // One pixel is sufficient to compose the actual CSS color/alpha stack.
        canvas.width = canvas.height = 1;
        const context = canvas.getContext('2d');
        const ancestors = [];
        for (let node=element; node; node=node.parentElement) ancestors.unshift(node);
        context.fillStyle = '#ffffff'; context.fillRect(0,0,1,1);
        ancestors.forEach((node) => {
            context.fillStyle = getComputedStyle(node).backgroundColor;
            context.fillRect(0,0,1,1);
        });
        const background = [...context.getImageData(0,0,1,1).data].slice(0,3);
        context.fillStyle = getComputedStyle(element).color;
        context.fillRect(0,0,1,1);
        const foreground = [...context.getImageData(0,0,1,1).data].slice(0,3);
        // Fixed sRGB transfer and luminance coefficients define the WCAG metric.
        const luminance = rgb => rgb.map(value => {
            const channel = value / 255;
            return channel <= .04045 ? channel / 12.92 : ((channel + .055) / 1.055) ** 2.4;
        }).reduce((sum,value,index) => sum + value * [.2126,.7152,.0722][index],0);
        const first = luminance(foreground), second = luminance(background);
        return (Math.max(first,second) + .05) / (Math.min(first,second) + .05);
    }

    try {
        /* Type: number. Units: contrast ratio. Scope: normal fixture text.
           Consumers: representative public tag/media/map assertions.
           Rationale: 4.5 is the normal-text AA acceptance boundary. */
        const minimumTextContrast = 4.5;
        for (const skin of ['slate','near-black']) {
            document.documentElement.dataset.skin = skin;
            for (const selector of ['.tag','.gallery-pdf-documents h3',
                '.gallery-pdf-table th','.gallery-pdf-table a','.map-attribution-note']) {
                check(textContrast(document.querySelector(selector)) >= minimumTextContrast,
                    `${skin} contrast must remain readable for ${selector}`);
            }
        }
        const grid = document.querySelector('.public-tag-gallery-grid');
        const cardBounds = grid.firstElementChild.getBoundingClientRect();
        check(cardBounds.width > innerWidth / 2, 'tag results must use one readable column');
        const nestedDialog = document.createElement('section');
        nestedDialog.setAttribute('role', 'dialog');
        nestedDialog.hidden = true;
        const nestedInput = document.createElement('input');
        nestedDialog.append(nestedInput);
        document.body.append(nestedDialog);
        setupGalleryLightbox(); cards[0].focus(); cards[0].click();
        await until(() => overlay.dataset.currentImageId === '1'
            && stage.clientWidth > 0 && overlay.querySelector('img').naturalWidth > 0,
            'first image must decode');
        const bounds = stage.getBoundingClientRect();
        check(bounds.left >= 0 && bounds.right <= innerWidth + 1,
            'photo stage must fit the narrow overlay');
        check(overlay.getAttribute('role') === 'dialog'
            && overlay.getAttribute('aria-modal') === 'true', 'viewer must be modal');
        check(document.querySelector('#cards').inert, 'background must be inert');
        check(overlay.contains(document.activeElement), 'opening must place focus inside');
        document.dispatchEvent(new KeyboardEvent('keydown', {key:'Tab',shiftKey:true,bubbles:true,cancelable:true}));
        check(overlay.contains(document.activeElement), 'Shift+Tab must stay inside');
        document.dispatchEvent(new KeyboardEvent('keydown', {key:'Tab',bubbles:true,cancelable:true}));
        check(overlay.contains(document.activeElement), 'Tab must stay inside');
        check(nestedDialog.inert, 'a body-level editor must be covered initially');
        overlay.append(nestedDialog);
        nestedDialog.hidden = false;
        nestedInput.focus();
        await until(() => !nestedDialog.inert && document.activeElement === nestedInput,
            'a reparented editor must regain its original state and input focus');
        nestedDialog.hidden = true;
        overlay.querySelector('[data-lightbox-action="close"]').focus();
        document.body.append(nestedDialog);
        await until(() => nestedDialog.inert,
            'a returned editor must become covered background again');
        check([...overlay.querySelectorAll('[data-lightbox-map]')]
            .every(button => button.hidden && button.disabled
                && getComputedStyle(button).display === 'none'), 'unavailable maps must be hidden and disabled');
        if (mobile) {
            const y = innerHeight / 2;
            touch('touchstart', [[1,innerWidth * .8,y]]);
            touch('touchmove', [[1,innerWidth * .2,y]]);
            touch('touchend', [], [[1,innerWidth * .2,y]]);
            await until(() => overlay.dataset.currentImageId === '2', 'one-finger swipe must navigate');
            touch('touchstart', [[1,100,y]]);
            touch('touchstart', [[1,100,y],[2,200,y]]);
            touch('touchmove', [[1,60,y],[2,240,y]]);
            check(overlay.classList.contains('is-zoomed'), 'pinch must zoom');
            touch('touchend', [[1,60,y]], [[2,240,y]]);
            touch('touchmove', [[1,100,y+20]]);
            touch('touchend', [], [[1,100,y+20]]);
            check(overlay.dataset.currentImageId === '2', 'pinch-to-pan must not navigate');
        }
        overlay.querySelector('[data-lightbox-action="zoom-reset"]').click();
        overlay.querySelector('[data-lightbox-action="close"]').click();
        check(document.activeElement === cards[0], 'close must return to the original opener');
        check(!document.querySelector('#cards').inert, 'close must restore background');
        check(!nestedDialog.inert, 'close must restore the editor original inert state');
        const language = new URL(document.querySelector('[hreflang]').href);
        check(!language.searchParams.has('photo') && language.searchParams.get('lang') === 'en'
            && language.searchParams.get('view_as') === 'anonymous', 'language links must retain album context');
        parent.postMessage({type:'public-ux-case',ok:true}, location.origin);
    } catch (error) {
        parent.postMessage({type:'public-ux-case',ok:false,error:error.stack}, location.origin);
    } finally { teardownGalleryLightbox(); }
}
</script>
</body></html>
