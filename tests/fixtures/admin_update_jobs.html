        await new Promise(/** Yield to browser tasks. @param {function(): void} resolve Timer consumer. @return {number} Timer. */ resolve => setTimeout(resolve, 10));

    });

    check(saves === 1 && routeChecks === 1 && location.href === originalUrl, 'Save completes before the active navdata request resolves');
    releaseRoute(); releaseRoute = null;
    await until(() => routeChecks === 2 && typeof releaseRoute === 'function');
    check(panel.getAttribute('aria-hidden') === 'false' && route.value === 'LKPR DCT EDDF', 'Post-save pass keeps the drawer and unsaved route contents intact');

    await until(() => routeChecks === 5);
