<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gallery tag rendering regression</title></head>
<body class="public-page"><main><!-- PRODUCTION_GALLERY_TAGS_MARKUP --></main><pre id="results"></pre>
<script type="module">
let assertions = 0;

/**
 * Require one browser-visible tag-layout invariant.
 * @param {boolean} condition Expected invariant.
 * @param {string} message Assertion context.
 * @return {void} Counts passing checks or throws with the relevant state.
 */
function check(condition, message) {
    if (!condition) throw new Error(message);
    assertions++;
}

/**
 * Resolve a promise after one animation frame.
 * @param {function(): void} resolve Promise resolver.
 * @return {void} Schedules resolution on the browser animation clock.
 */
function resolveAnimationFrame(resolve) {
    requestAnimationFrame(resolve);
}

/**
 * Let responsive layout and native disclosure events settle.
 * @return {Promise<void>} Resolves after two animation frames.
 */
async function settle() {
    await new Promise(resolveAnimationFrame);
    await new Promise(resolveAnimationFrame);
}

/**
 * Wait for the animated public-info disclosure to finish closing.
 * @param {HTMLDetailsElement} details Disclosure controlled by the fixture.
 * @return {Promise<boolean>} Whether the disclosure closed before the animation bound.
 */
async function waitForDisclosureClose(details) {
    const deadline = performance.now() + 1500;
    while (details.open && performance.now() < deadline) {
        await new Promise(resolveAnimationFrame);
    }
    return !details.open;
}

/**
 * Wait for the fixture's image and font resources before taking geometry baselines.
 * @return {Promise<void>} Resolves after images, fonts, and responsive layout settle.
 */
async function waitForLayoutResources() {
    for (const image of document.images) {
        try {
            await image.decode();
        } catch {
            // A failed inert data image should not hold the layout test open.
        }
    }
    await document.fonts.ready;
    await settle();
}

/**
 * Round a browser geometry value to hundredths of a CSS pixel.
 * @param {number} value Unrounded layout measurement.
 * @return {number} Stable comparison value.
 */
function roundGeometry(value) {
    return Math.round(value * 100) / 100;
}

/**
 * Read an element rectangle relative to an owning layout element.
 * @param {HTMLElement} element Measured element.
 * @param {DOMRect} ownerRect Origin rectangle.
 * @return {number[]} Rounded x, y, width, and height values.
 */
function relativeRect(element, ownerRect) {
    const box = element.getBoundingClientRect();
    return [box.x - ownerRect.x, box.y - ownerRect.y, box.width, box.height].map(roundGeometry);
}

/**
 * Read absolute x, y, width, and height for one browser element.
 * @param {HTMLElement} element Measured element.
 * @return {number[]} Rounded absolute rectangle.
 */
function absoluteRect(element) {
    const box = element.getBoundingClientRect();
    return [box.x, box.y, box.width, box.height].map(roundGeometry);
}

/**
 * Select visible anchor tags from an element collection.
 * @param {HTMLElement[]} elements Candidate tag elements.
 * @return {HTMLAnchorElement[]} Visible anchor tags only.
 */
function visibleTagAnchors(elements) {
    const result = [];
    for (const element of elements) {
        if (element instanceof HTMLAnchorElement) result.push(element);
    }
    return result;
}

/**
 * Return the smallest top coordinate in a rectangle list.
 * @param {DOMRect[]} rectangles Measured child rectangles.
 * @return {number} Minimum top coordinate.
 */
function minimumTop(rectangles) {
    let result = Number.POSITIVE_INFINITY;
    for (const rectangle of rectangles) result = Math.min(result, rectangle.top);
    return result;
}

/**
 * Return only tag elements that occupy layout space.
 * @param {HTMLElement} list Tag-list container.
 * @return {HTMLElement[]} Currently rendered tag elements.
 */
function visibleTags(list) {
    const result = [];
    for (const element of list.querySelectorAll('.tag')) {
        if (element instanceof HTMLElement && element.getClientRects().length > 0) result.push(element);
    }
    return result;
}

/**
 * Measure the visible tag labels and positions relative to an owner.
 * @param {HTMLElement} list Tag-list container.
 * @param {DOMRect} ownerRect Origin rectangle.
 * @return {Array<[string, number, number, number, number]>} Visible label geometry.
 */
function tagGeometry(list, ownerRect) {
    const result = [];
    for (const element of visibleTags(list)) {
        const position = relativeRect(element, ownerRect);
        result.push([element.textContent.trim(), ...position]);
    }
    return result;
}

/**
 * Capture stable outer geometry and visible tag order for one rendered gallery card.
 * @param {string} selector Card selector.
 * @return {{card: number[], tags: number[], list: number[], pills: Array<[string, number, number, number, number]>}} Rounded layout snapshot used to detect first-paint shifts.
 */
function snapshot(selector) {
    const card = document.querySelector(selector);
    const tags = card?.querySelector('.gallery-card-tags');
    const list = tags?.querySelector('.tag-list');
    if (!(card instanceof HTMLElement) || !(tags instanceof HTMLElement) || !(list instanceof HTMLElement)) throw new Error('Missing rendered gallery card or tag list: ' + selector);
    const cardRect = card.getBoundingClientRect();
    return {
        card: [roundGeometry(cardRect.width), roundGeometry(cardRect.height)],
        tags: relativeRect(tags, cardRect),
        list: relativeRect(list, cardRect),
        pills: tagGeometry(list, cardRect),
    };
}

/**
 * Snapshot the public gallery hero relative to its owning section.
 * @return {{section: number[], root: number[], content: number[], list: number[], pills: Array<[string, number, number, number, number]>}} Hero geometry before or after module startup.
 */
function heroSnapshot() {
    const section = document.querySelector('[data-fixture-case="hero-rows-one"]');
    const root = section?.querySelector('.hero-tags');
    const content = root?.querySelector('.hero-tags-content');
    const list = content?.querySelector('.tag-list');
    if (!(section instanceof HTMLElement) || !(root instanceof HTMLElement) || !(content instanceof HTMLElement) || !(list instanceof HTMLElement)) throw new Error('Missing server-rendered hero tag fixture');
    const sectionRect = section.getBoundingClientRect();
    return {
        section: [roundGeometry(sectionRect.width), roundGeometry(sectionRect.height)],
        root: relativeRect(root, sectionRect),
        content: relativeRect(content, sectionRect),
        list: relativeRect(list, sectionRect),
        pills: tagGeometry(list, sectionRect),
    };
}

/**
 * Check whether every supplied tag is hidden from layout.
 * @param {NodeListOf<HTMLAnchorElement>} tags Tag anchors to inspect.
 * @return {boolean} True when none occupies layout space.
 */
function allTagsHidden(tags) {
    for (const tag of tags) if (tag.getClientRects().length > 0) return false;
    return true;
}

/**
 * Check whether every supplied tag is visible in layout.
 * @param {NodeListOf<HTMLAnchorElement>} tags Tag anchors to inspect.
 * @return {boolean} True when all occupy layout space.
 */
function allTagsVisible(tags) {
    for (const tag of tags) if (tag.getClientRects().length === 0) return false;
    return true;
}

/**
 * Return visible direct children of a tag-list flex container.
 * @param {HTMLElement} list Tag-list container.
 * @return {HTMLElement[]} Children with rendered layout boxes.
 */
function visibleChildren(list) {
    const result = [];
    for (const element of list.children) {
        if (element instanceof HTMLElement && element.getClientRects().length > 0) result.push(element);
    }
    return result;
}

/**
 * Collect rectangles for a set of visible flex children.
 * @param {HTMLElement[]} elements Rendered flex children.
 * @return {DOMRect[]} Their current rectangles.
 */
function childRects(elements) {
    const result = [];
    for (const element of elements) result.push(element.getBoundingClientRect());
    return result;
}

/**
 * Return whether visible tags retain single-line full-name text.
 * @param {HTMLElement[]} tags Rendered tag pills.
 * @return {boolean} True when each tag has a nowrap style and full title.
 */
function tagsKeepFullNames(tags) {
    for (const tag of tags) {
        if (getComputedStyle(tag).whiteSpace !== 'nowrap' || tag.title !== tag.textContent.trim()) return false;
    }
    return true;
}

/**
 * Return tag names in their source order.
 * @param {HTMLElement} list Tag-list container.
 * @return {string[]} Text labels in DOM order.
 */
function tagNames(list) {
    const result = [];
    for (const tag of list.querySelectorAll('a.tag')) result.push(tag.textContent.trim());
    return result;
}

/**
 * Check a label's text, title, and collapsed-state visibility.
 * @param {HTMLElement} list Tag-list container.
 * @param {string} expected Full label expected in the markup.
 * @return {boolean} True when the group label is visible and intact.
 */
function hasVisibleGroupLabel(list, expected) {
    for (const label of list.querySelectorAll('.tag-list-label')) {
        if (label instanceof HTMLElement && label.textContent.trim() === expected && label.title === expected && label.getClientRects().length > 0) return true;
    }
    return false;
}

/**
 * Compare actual anchor order with an expected ordered label list.
 * @param {HTMLElement} list Tag-list container.
 * @param {string[]} expected Expected tag order.
 * @return {boolean} True when every link appears in the expected position.
 */
function hasTagOrder(list, expected) {
    const actual = tagNames(list);
    if (actual.length !== expected.length) return false;
    for (let index = 0; index < expected.length; index++) if (actual[index] !== expected[index]) return false;
    return true;
}

/**
 * Run the browser regression assertions against server-rendered markup.
 * @return {Promise<void>} Resolves after publishing the bounded result summary.
 */
async function runFixture() {
  try {
    const viewport = await fetch('/__viewport?width=390');
    check(viewport.ok, '390px viewport override succeeds');
    await waitForLayoutResources();
    const countCard = document.querySelector('[data-fixture-case="rows-one"]');
    const countStack = countCard?.querySelector('.gallery-card-media-count-stack');
    const countBadges = countStack instanceof HTMLElement
        ? Array.from(countStack.children).filter(element => element instanceof HTMLElement)
        : [];
    check(countBadges.length === 3, 'Physical card stacks its photo, PDF and music counts');
    const [photoBadge, pdfBadge, musicBadge] = countBadges;
    if (photoBadge && pdfBadge && musicBadge && countStack instanceof HTMLElement) {
        const photoRect = photoBadge.getBoundingClientRect();
        const pdfRect = pdfBadge.getBoundingClientRect();
        const musicRect = musicBadge.getBoundingClientRect();
        const stackStyle = getComputedStyle(countStack);
        const photoStyle = getComputedStyle(photoBadge);
        const pdfStyle = getComputedStyle(pdfBadge);
        const musicStyle = getComputedStyle(musicBadge);
        const pdfIcon = pdfBadge.querySelector('svg');
        const musicIcon = musicBadge.querySelector('svg');
        check(stackStyle.position === 'absolute'
            && stackStyle.flexDirection === 'column'
            && stackStyle.pointerEvents === 'none', 'Count stack stays in the media corner and cannot intercept links');
        check(Math.abs(photoRect.right - pdfRect.right) <= 0.5
            && Math.abs(pdfRect.right - musicRect.right) <= 0.5
            && photoRect.top < pdfRect.top
            && pdfRect.top < musicRect.top, 'Photo, PDF and music badges form one right-aligned vertical stack');
        check(photoStyle.backgroundColor === pdfStyle.backgroundColor
            && pdfStyle.backgroundColor === musicStyle.backgroundColor
            && photoStyle.backdropFilter === pdfStyle.backdropFilter
            && pdfStyle.backdropFilter === musicStyle.backdropFilter, 'All stacked badges reuse the same glass surface');
        check(pdfIcon instanceof SVGElement
            && musicIcon instanceof SVGElement
            && Number.parseFloat(getComputedStyle(pdfIcon).width) > 0
            && Number.parseFloat(getComputedStyle(musicIcon).width) > 0
            && photoBadge.textContent.includes('12')
            && pdfBadge.textContent.includes('3')
            && musicBadge.textContent.includes('2'), 'Both media glyphs and all prepared counts are visible');
        check(Number.parseFloat(stackStyle.rowGap) < Number.parseFloat(photoStyle.rowGap)
            && Number.parseFloat(getComputedStyle(pdfBadge).gap) < Number.parseFloat(photoStyle.gap)
            && Number.parseFloat(getComputedStyle(musicBadge).gap) < Number.parseFloat(photoStyle.gap), 'Media badges use tighter vertical and icon-to-count spacing than the original photo badge');
    }
    const mediaHero = document.querySelector('[data-fixture-case="hero-media-counts"]');
    const mediaHeroActions = mediaHero?.querySelector('.hero-actions');
    const mediaHeroGroup = mediaHeroActions?.querySelector('.gallery-hero-media-counts');
    const mediaHeroBadges = mediaHeroGroup instanceof HTMLElement
        ? Array.from(mediaHeroGroup.querySelectorAll('.gallery-media-count-badge'))
        : [];
    const heroPhotoBadge = mediaHeroActions?.querySelector('.gallery-hero-count-badge:not(.gallery-media-count-badge)');
    const heroAdminTrash = mediaHeroActions?.querySelector('.public-admin-delete-form-hero');
    const heroAdminEdit = mediaHeroActions?.querySelector('.public-admin-edit-button-hero');
    const heroAdminAdd = mediaHeroActions?.querySelector('.public-admin-add-gallery-button-hero');
    const heroDownload = mediaHeroActions?.querySelector('form.public-download-legacy-form');
    const heroMap = mediaHeroActions?.querySelector('button.map-button');
    check(mediaHero instanceof HTMLElement
        && mediaHeroActions instanceof HTMLElement
        && mediaHeroGroup instanceof HTMLElement
        && mediaHeroBadges.length === 2
        && heroPhotoBadge instanceof HTMLElement
        && heroAdminTrash instanceof HTMLElement
        && heroAdminEdit instanceof HTMLElement
        && heroAdminAdd instanceof HTMLElement
        && heroDownload instanceof HTMLElement
        && heroMap instanceof HTMLElement, 'Opened-gallery hero contains prepared PDF, music, photo, trash, edit, add, download and map actions');
    if (mediaHeroGroup instanceof HTMLElement
        && mediaHeroBadges.length === 2
        && heroPhotoBadge instanceof HTMLElement
        && heroAdminTrash instanceof HTMLElement
        && heroAdminEdit instanceof HTMLElement
        && heroAdminAdd instanceof HTMLElement
        && heroDownload instanceof HTMLElement
        && heroMap instanceof HTMLElement) {
        const [heroPdfBadge, heroMusicBadge] = mediaHeroBadges;
        // Desktop fits every action; the production wrap rule stays unchanged.
        const desktopViewport = await fetch('/__viewport?width=1280');
        check(desktopViewport.ok, '1280px action-row viewport succeeds');
        await settle();
        const actionSequence = [
            heroPdfBadge,
            heroMusicBadge,
            heroPhotoBadge,
            heroAdminTrash,
            heroAdminEdit,
            heroAdminAdd,
            heroDownload,
            heroMap,
        ];
        const actionRects = actionSequence.map(action => action.getBoundingClientRect());
        const adjacentGaps = actionRects.slice(1).map((rect, index) =>
            rect.left - actionRects[index].right,
        );
        const actionCenter = actionRects[0].top + actionRects[0].height / 2;
        check(actionRects.every(rect =>
            Math.abs(rect.top + rect.height / 2 - actionCenter) <= 0.5)
            && adjacentGaps.every(gap => gap > 0
                && Math.abs(gap - adjacentGaps[0]) <= 0.5), 'PDF, music, photo, trash, edit, add, download and map actions share one horizontal row with equal gaps');
        check(heroPdfBadge.textContent.includes('3')
            && heroMusicBadge.textContent.includes('2')
            && heroPdfBadge.getAttribute('aria-label')?.includes('3 unique PDF files')
            && heroMusicBadge.getAttribute('aria-label')?.includes('2 unique music files'), 'Hero media counts retain their accessible labels and prepared values');
        check(Number.parseFloat(getComputedStyle(heroPdfBadge).gap) < Number.parseFloat(getComputedStyle(heroPhotoBadge).gap)
            && Number.parseFloat(getComputedStyle(heroMusicBadge).gap) < Number.parseFloat(getComputedStyle(heroPhotoBadge).gap), 'Hero media badges keep compact icon-to-count spacing');
        const narrowViewport = await fetch('/__viewport?width=390');
        check(narrowViewport.ok, '390px viewport is restored for mobile geometry');
        await settle();
        const narrowCounts = actionSequence.slice(0, 3).map(action =>
            action.getBoundingClientRect(),
        );
        check(narrowCounts.every(rect =>
            Math.abs(rect.top - narrowCounts[0].top) <= 0.5)
            && Math.abs((narrowCounts[1].left - narrowCounts[0].right)
                - (narrowCounts[2].left - narrowCounts[1].right)) <= 0.5,
            'Mobile keeps PDF, music and photo counts on one row with equal gaps');
    }
    const displayAll = document.querySelector('[data-fixture-case="display-all"]');
    check(displayAll instanceof HTMLElement, 'display-all card exists before first-paint measurements');
    displayAll.scrollIntoView({block: 'center'});
    await settle();
    const displayAllInitialStyle = getComputedStyle(displayAll);
    const displayAllInitialContext = 'content-visibility=' + displayAllInitialStyle.contentVisibility + ' intrinsic-size=' + displayAllInitialStyle.containIntrinsicSize + ' scrollY=' + Math.round(window.scrollY);

    const capped = document.querySelector('[data-fixture-case="rows-one"]');
    const details = capped?.querySelector('details[data-hero-tags-disclosure]');
    const summary = details?.querySelector('summary');
    const cappedList = capped?.querySelector('.tag-list');
    check(capped instanceof HTMLElement && details instanceof HTMLDetailsElement && summary instanceof HTMLElement && cappedList instanceof HTMLElement, 'row-one card uses native details disclosure');
    check(!details.open && summary.querySelector('[aria-hidden="true"]')?.textContent.trim() === '…', 'native disclosure begins collapsed with a three-dot information control');
    check(allTagsHidden(details.querySelectorAll('a.tag')), 'all public-info tag links stay hidden while the panel is closed');
    const visibleBefore = visibleTagAnchors(visibleTags(cappedList));
    check(visibleBefore.length === 4, 'configured visible tag count is already applied in first HTML paint');
    const beforeInit = snapshot('[data-fixture-case="rows-one"]');
    const responsiveBefore = snapshot('[data-fixture-case="rows-one-responsive"]');
    const cappedContent = capped.querySelector('.gallery-card-tags-content');
    const computedBefore = getComputedStyle(cappedContent);
    check(computedBefore.overflowY === 'auto' && Number.parseFloat(computedBefore.maxHeight) > 0, 'one-row scrollbar cap is present in CSS before JavaScript');
    check(cappedContent.scrollHeight > cappedContent.clientHeight + 1, 'one-row cap is exercised by wrapped first-paint content');
    const contentRect = cappedContent.getBoundingClientRect();
    const flexRects = childRects(visibleChildren(cappedList));
    const firstRowTop = minimumTop(flexRects);
    let firstRowBottom = firstRowTop;
    let nextRowTop = Number.POSITIVE_INFINITY;
    for (const rect of flexRects) {
        if (Math.abs(rect.top - firstRowTop) <= 2) firstRowBottom = Math.max(firstRowBottom, rect.bottom);
        else if (rect.top > firstRowTop + 2) nextRowTop = Math.min(nextRowTop, rect.top);
    }
    check(firstRowBottom <= contentRect.top + cappedContent.clientHeight + 1, 'all first-row pills and the information control fit the one-row cap');
    check(Number.isFinite(nextRowTop) && nextRowTop >= contentRect.top + cappedContent.clientHeight - 1, 'second visual row begins beyond the one-row cap');
    check(tagsKeepFullNames(visibleBefore), 'long tag labels stay single-line while retaining their full title text');
    check(document.querySelector('[data-fixture-case="rows-five"] details[data-hero-tags-disclosure]') instanceof HTMLDetailsElement, 'five-row card also has server-rendered disclosure');
    const fiveBefore = snapshot('[data-fixture-case="rows-five"]');
    const fiveContent = document.querySelector('[data-fixture-case="rows-five"] .gallery-card-tags-content');
    check(getComputedStyle(fiveContent).overflowY === 'auto' && Number.parseFloat(getComputedStyle(fiveContent).maxHeight) > Number.parseFloat(computedBefore.maxHeight) && fiveContent.scrollHeight > fiveContent.clientHeight + 1, 'five-row CSS cap is larger and exercised by wrapped content before JavaScript');
    const exactLimit = document.querySelector('[data-fixture-case="exact-limit"]');
    const exactBefore = snapshot('[data-fixture-case="exact-limit"]');
    check(exactLimit?.querySelector('[data-hero-tags-native="1"]') instanceof HTMLElement && exactLimit.querySelector('details[data-hero-tags-disclosure]') === null && exactLimit.querySelectorAll('a.tag').length === 4, 'exact-limit card has native ownership without an unnecessary disclosure');
    const allBefore = snapshot('[data-fixture-case="display-all"]');
    check(displayAll?.querySelector('details[data-hero-tags-disclosure]') === null && displayAll?.querySelectorAll('a.tag').length === 8, 'display-all setting emits every tag without a disclosure wrapper');
    check(displayAll.querySelector('[data-hero-tags-native="1"]') instanceof HTMLElement, 'display-all card opts out of legacy JavaScript layout work');
    const heroRoot = document.querySelector('[data-fixture-case="hero-rows-one"] .hero-tags');
    const heroDetails = heroRoot?.querySelector('details[data-hero-tags-disclosure]');
    const heroSummary = heroDetails?.querySelector('summary');
    const heroContent = heroRoot?.querySelector('.hero-tags-content');
    const heroList = heroContent?.querySelector('.tag-list');
    check(heroRoot instanceof HTMLElement && heroRoot.dataset.heroTagsNative === '1' && heroDetails instanceof HTMLDetailsElement && heroSummary instanceof HTMLElement && heroContent instanceof HTMLElement && heroList instanceof HTMLElement, 'actual gallery hero uses the native server-rendered tag policy');
    const heroPills = visibleTagAnchors(visibleTags(heroList));
    check(heroPills.length === 4 && allTagsHidden(heroDetails.querySelectorAll('a.tag')), 'gallery hero applies its visible limit before module startup');
    check(hasVisibleGroupLabel(heroList, 'Containing tags'), 'contained-tag group label remains visible with its full title before expansion');
    const heroExpectedOrder = ['Urban wildlife', 'Long coast observation point tag', 'Blue hour photographs', 'Northern marsh habitat survey', 'Migrating birds near the eastern shoreline', 'Field notes from the old railway bridge', 'Aerial view of the wetlands after rainfall', 'Long exposure lights beside the river crossing', 'Distant mountain range beyond the forest', 'Seasonal color changes across the protected valley', 'Historic stone structures on the coastal trail', 'Wide landscape with changing afternoon clouds'];
    const heroPanel = heroDetails.querySelector('.gallery-card-public-info-panel');
    check(heroDetails.hasAttribute('data-gallery-card-info-disclosure') && heroPanel instanceof HTMLElement, 'hero uses the same information panel as gallery cards');
    check(hasTagOrder(heroPanel, heroExpectedOrder), 'hero panel preserves every direct and contained tag in server order');
    check(heroPanel.querySelector('h4')?.textContent === 'Containing tags', 'hero panel retains the containing-tags heading');
    const heroBoundary = document.querySelector('[data-fixture-case="hero-group-boundary"]');
    check(heroBoundary.querySelectorAll('.hero-tags-content > .tag-list > a.tag').length === 2 && heroBoundary.querySelectorAll('.hero-tags-content > .tag-list > .tag-list-label').length === 0, 'group-boundary limit hides a group label when none of its tags are previewed');
    check(hasTagOrder(heroBoundary.querySelector('.gallery-card-public-info-panel'), heroExpectedOrder) && heroBoundary.querySelector('.gallery-card-public-info-panel h4')?.textContent === 'Containing tags', 'group-boundary panel retains all groups and their complete tag order');
    const heroExact = document.querySelector('[data-fixture-case="hero-exact-limit"]');
    const heroAll = document.querySelector('[data-fixture-case="hero-display-all"]');
    check(heroExact.querySelector('details') === null && heroExact.querySelectorAll('a.tag').length === 4, 'exact-limit hero omits an unnecessary information control');
    check(heroAll.querySelector('details') === null && heroAll.querySelectorAll('a.tag').length === 8, 'display-all hero keeps the saved preference and every tag in initial HTML');
    const heroContentRect = heroContent.getBoundingClientRect();
    const heroComputed = getComputedStyle(heroContent);
    check(heroComputed.overflowY === 'auto' && Number.parseFloat(heroComputed.maxHeight) > 0 && heroContent.scrollHeight > heroContent.clientHeight + 1, 'gallery hero row-one cap is present and exercised at first paint');
    const heroRects = childRects(visibleChildren(heroList));
    const heroFirstTop = minimumTop(heroRects);
    let heroFirstBottom = heroFirstTop;
    let heroNextTop = Number.POSITIVE_INFINITY;
    for (const rect of heroRects) {
        if (Math.abs(rect.top - heroFirstTop) <= 2) heroFirstBottom = Math.max(heroFirstBottom, rect.bottom);
        else if (rect.top > heroFirstTop + 2) heroNextTop = Math.min(heroNextTop, rect.top);
    }
    check(heroFirstBottom <= heroContentRect.top + heroContent.clientHeight + 1, 'all first-row hero pills and disclosure fit inside its one-row cap');
    check(Number.isFinite(heroNextTop) && heroNextTop >= heroContentRect.top + heroContent.clientHeight - 1, 'second hero row starts beyond the one-row cap');
    check(heroDetails.closest('.gallery-card-tag-tail') === null, 'hero panel does not inherit the old single-row overflow wrapper');
    const heroBefore = heroSnapshot();

    heroSummary.focus({preventScroll: true});
    const nativeHeroExpand = await fetch('/__key?key=Enter');
    await settle();
    check(nativeHeroExpand.ok && heroDetails.open && allTagsVisible(heroPanel.querySelectorAll('a.tag')), 'hero exposes every tag through the native no-JavaScript disclosure');
    check(heroPanel.getBoundingClientRect().top >= heroRoot.getBoundingClientRect().bottom, 'native hero fallback opens below its root so long lists remain reachable by scrolling');
    const nativeHeroExpanded = heroSnapshot();
    check(JSON.stringify(nativeHeroExpanded.section) === JSON.stringify(heroBefore.section) && JSON.stringify(nativeHeroExpanded.root) === JSON.stringify(heroBefore.root), 'native hero panel keeps header geometry stable');
    const nativeHeroCollapse = await fetch('/__key?key=Enter');
    await settle();
    check(nativeHeroCollapse.ok && !heroDetails.open, 'native hero summary also closes without the module');

    summary.focus({preventScroll: true});
    const beforeModuleExpand = await fetch('/__key?key=Enter');
    check(beforeModuleExpand.ok, 'trusted Enter key reaches the server-rendered native summary before disclosure module startup');
    await settle();
    check(details.open && allTagsVisible(details.querySelectorAll('a.tag')), 'native summary opens every public-info tag before module startup');
