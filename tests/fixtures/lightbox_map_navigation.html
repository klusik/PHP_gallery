<!doctype html>
<!--
Project: PHP Gallery
Repository: https://github.com/klusik/PHP_gallery
File: tests/fixtures/lightbox_map_navigation.html
Module Type: Browser Test Fixture
Purpose: Exercise production lightbox map navigation against synthetic media.
Responsibilities:
  - Provide viewer controls, map containers and observable browser results.
Author: Rudolf Klusal
-->
<html lang="en"><meta charset="utf-8"><title>Lightbox map navigation fixture</title>
<style>
    [hidden] { display: none !important; }
    [data-lightbox] { position: fixed; inset: 0; background: white; }
    .lightbox-stage-link { display: block; width: 800px; height: 600px; }
    [data-lightbox-img] { max-width: 100%; max-height: 100%; }
    .map-canvas { width: 800px; height: 500px; }
</style>
<body>
<pre id="results">RUNNING</pre>
<div data-lightbox-config data-lightbox-endpoint="/metadata?page=gallery_lightbox_data&amp;id=7" data-lightbox-total="200" data-lightbox-window-size="12" data-lightbox-maps-enabled="1"></div>
<a id="card" href="/photo/1" data-lightbox-image data-image-id="1" data-gallery-id="7" data-lightbox-index="0" data-page-url="/photo/1" data-title="Photo 1" data-image-width="800" data-image-height="600">Photo 1</a>
<div data-lightbox hidden data-lightbox-maps-enabled="1">
    <button data-lightbox-action="close">Close</button>
    <button data-lightbox-action="next">Next</button>
    <figure><a class="lightbox-stage-link" data-lightbox-stage><div class="lightbox-zoom-surface" data-lightbox-zoom-surface><img data-lightbox-img alt="Photo"></div></a></figure>
    <div class="lightbox-meta"><h2 data-lightbox-title></h2><p data-lightbox-description></p><span data-lightbox-counter></span></div>
    <div data-lightbox-map-split hidden><button data-lightbox-map-split-close>Close map</button><div data-lightbox-map-split-canvas></div></div>
</div>
<div data-map-overlay hidden></div>
<script type="module">
    import {setupGalleryLightbox, teardownGalleryLightbox} from '/public/assets/gallery-modules/lightbox.js';
    const result = document.querySelector('#results');
    const errors = [];
    window.addEventListener('error', event => errors.push(event.message));
    window.addEventListener('unhandledrejection', event => errors.push(String(event.reason)));
    const overlay = document.querySelector('[data-lightbox]');
    const split = document.querySelector('[data-lightbox-map-split]');
    const card = document.querySelector('#card');
    const media = 'data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600"><rect width="800" height="600" fill="steelblue"/></svg>');
    card.dataset.previewSrc = media; card.dataset.fullSrc = media;
    const pending = [];
    const requests = [];
    let galleryMapPayload = null;
    let galleryMapRequests = 0;
    const originalFetch = window.fetch;
    window.fetch = async (url, options = {}) => {
        const parsed = new URL(url, location.href);
        if (parsed.pathname === '/route-map') {
            galleryMapRequests += 1;
            return new Response(JSON.stringify(galleryMapPayload), {headers: {'Content-Type': 'application/json'}});
        }
        if (parsed.pathname !== '/metadata') return originalFetch(url, options);
        requests.push(parsed);
        if (parsed.searchParams.has('target_image_id')) {
            return new Promise((resolve, reject) => {
                const request = {id: Number(parsed.searchParams.get('target_image_id')), signal: options.signal, resolve, reject};
                pending.push(request);
                options.signal.addEventListener('abort', () => reject(new DOMException('Cancelled', 'AbortError')), {once: true});
            });
        }
        // Do not prefill target photos via neighbor preloads; each target lookup is observable.
        return new Response(JSON.stringify({items: []}), {headers: {'Content-Type': 'application/json'}});
    };
    /** Advance task and promise callbacks, including production deferred popup handling. */
    const tick = () => new Promise(resolve => setTimeout(resolve, 30));
    /** Fail visibly in the dumped DOM on any broken contract. */
    function check(value, message) { if (!value) throw new Error(message); }
    /** Create a popup-shaped link and dispatch through the production document capture handler. */
    function select(id) {
        const link = document.createElement('a');
        link.href = `/photo/${id}`;
        link.dataset.mapOpenPhoto = String(id); link.dataset.mapPhotoGalleryId = '7'; link.dataset.mapPhotoPageUrl = `/photo/${id}`;
        link.textContent = 'Open photo';
        (split.hidden ? document.querySelector('[data-map-overlay]') : split).append(link);
        link.click();
    }
    /** Deliver a controlled successful metadata window to the real browser code. */
    function respond(request, id, index) {
        request.resolve(new Response(JSON.stringify({target_index: index, items: [{id, index, gallery_id: 7, title: `Photo ${id}`, page_url: `/photo/${id}`, full_src: media, preview_src: media, width: 800, height: 600}]}), {headers: {'Content-Type': 'application/json'}}));
    }
    try {
        setupGalleryLightbox(); card.click(); await tick();
        check(!overlay.hidden, 'card click must open actual viewer');
        select(101); await tick(); check(pending.length === 1, 'cross-page marker must fetch');
        respond(pending[0], 101, 100); await tick();
        check(document.querySelector('[data-lightbox-title]').textContent === 'Photo 101', 'target metadata must render selected photo');
        select(151); await tick(); check(pending.length === 2, 'detached current card must retain gallery identity');
        respond(pending[1], 151, 150); await tick();
        select(101); await tick(); check(pending.length === 2, 'previously loaded photo must use sparse cache');
        check(document.querySelector('[data-lightbox-title]').textContent === 'Photo 101', 'cached photo must render');

        select(170); await tick(); const older = pending.at(-1);
        select(180); await tick(); const newer = pending.at(-1);
        check(older.signal.aborted, 'newer click must abort old target request');
        respond(newer, 180, 179); await tick();
        check(document.querySelector('[data-lightbox-title]').textContent === 'Photo 180', 'newest selection must render');

        // Exercise the CSS split-map path; native fullscreen/user activation and Leaflet are not simulated as verified.
        overlay.classList.add('is-fullscreen'); split.hidden = false;
        select(101); await tick(); check(!split.hidden, 'split map must remain mounted');
        select(190); await tick(); const splitRequest = pending.at(-1);
        document.querySelector('[data-lightbox-map-split-close]').click(); await tick();
        check(splitRequest.signal.aborted, 'split close control must abort selection');
        overlay.classList.remove('is-fullscreen');

        overlay.classList.add('is-fullscreen'); split.hidden = false;
        select(192); await tick(); const exitRequest = pending.at(-1);
        document.dispatchEvent(new Event('fullscreenchange')); await tick();
        check(exitRequest.signal.aborted, 'fullscreen exit handler must abort selection');
        document.querySelector('[data-lightbox-map-split-close]').click();

        select(193); await tick(); const nextRequest = pending.at(-1);
        document.querySelector('[data-lightbox-action="next"]').click(); await tick();
        check(nextRequest.signal.aborted, 'ordinary photo navigation must supersede selection');
        document.querySelector('[data-lightbox-action="close"]').click(); card.click(); await tick();

        select(191); await tick(); const closeRequest = pending.at(-1);
        document.querySelector('[data-lightbox-action="close"]').click(); await tick();
        check(closeRequest.signal.aborted, 'viewer close control must abort selection');
        check(overlay.hidden, 'viewer must remain closed');
        check(location.pathname === '/', 'cancelled selection must not navigate away from restored gallery URL');
        card.click(); await tick(); const requestCount = pending.length;
        select(194); document.querySelector('[data-lightbox-action="close"]').click(); await tick();
        check(pending.length === requestCount, 'close before deferred dispatch must prevent target fetch');
        check(location.pathname === '/', 'close before dispatch must prevent page fallback');
        teardownGalleryLightbox(); await tick();

        // Record the Leaflet boundary without CDN/tile requests. Production setup, DOM events,
        // layer selection, controls, viewport fitting, close, and teardown still execute in Chromium.
        const maps = [];
        const leafletStylesheet = document.createElement('link');
        leafletStylesheet.dataset.galleryLeafletCss = 'true';
        document.head.append(leafletStylesheet);
        window.L = {
            map: (canvas) => {
                const map = {
                    _container: canvas, _mapPane: {}, lines: [], markers: [], tileLayers: 0,
                    bounds: null, center: null, zoom: 5,
                    on: () => {}, invalidateSize: () => {},
                    fitBounds: (bounds) => {
                        map.bounds = bounds;
                        map.center = {lat: bounds[0][0], lng: bounds[0][1]};
                    },
                    setView: (center, zoom) => { map.center = {lat: center[0], lng: center[1]}; map.zoom = zoom; },
                    getCenter: () => map.center, getZoom: () => map.zoom,
                    zoomIn: () => { map.zoom += 1; }, zoomOut: () => { map.zoom -= 1; },
                    addControl: (control) => canvas.append(control.onAdd()),
                    remove: () => { map._mapPane = null; },
                };
                maps.push(map);
                return map;
            },
            tileLayer: () => ({addTo: (map) => { map.tileLayers += 1; }}),
            polyline: (points) => ({addTo: (map) => map.lines.push(points)}),
            marker: (position, options) => {
                const marker = {position, options, bindPopup: () => {}};
                return {addTo: (map) => { map.markers.push(marker); return marker; }};
            },
            divIcon: (options) => options,
            Control: {extend: (definition) => function () { Object.assign(this, definition); }},
            DomUtil: {create: (tag, className) => { const node = document.createElement(tag); node.className = className; return node; }},
            DomEvent: {disableClickPropagation: () => {}, disableScrollPropagation: () => {}},
        };
        const routePoints = [
            {id: 'flight-7-0', lat: 50.1008, lng: 14.2632, point_type: 'route_start', source_type: 'flight_path'},
            {id: 'flight-7-1', lat: 49.95, lng: 12.85, point_type: 'route_via', source_type: 'flight_path'},
            {id: 'flight-7-2', lat: 50.0379, lng: 8.5622, point_type: 'route_end', source_type: 'flight_path'},
        ];
        const routeCoordinates = routePoints.map(point => [point.lat, point.lng]);
        const routePayload = {title: 'Empty flight gallery', source_type: 'flight_path', render_path: true,
            points: routePoints, geometry: {type: 'polyline', points: routePoints}};
        const mapButton = document.createElement('button');
        mapButton.dataset.galleryMapUrl = '/route-map'; mapButton.textContent = 'Gallery map';
        document.body.append(mapButton);
        document.querySelector('[data-map-overlay]').remove();
        const config = document.querySelector('[data-lightbox-config]');
        card.remove(); config.dataset.lightboxTotal = '0';
        const galleryUrl = location.href;
        const openRecordedMap = async () => {
            const countBefore = maps.length;
            mapButton.click();
            for (let attempt = 0; attempt < 30; attempt += 1) {
                await tick();
                if (maps.length > countBefore && maps.at(-1).center) return maps.at(-1);
                if (errors.length) break;
            }
            throw new Error(`Gallery map must render and initialize its viewport: ${errors.join('; ')}`);
        };

        // Both kinds of empty-page markup must initialize the independent route map.
        for (const hasViewer of [false, true]) {
            if (hasViewer) document.body.append(overlay); else overlay.remove();
            galleryMapPayload = routePayload;
            setupGalleryLightbox();
            const map = await openRecordedMap();
            const mapOverlay = document.querySelector('[data-map-overlay]');
            check(!mapOverlay.hidden && map.tileLayers === 1, 'empty gallery must open a normal tiled map');
            check(map.lines.length === 1 && JSON.stringify(map.lines[0]) === JSON.stringify(routeCoordinates), 'zero-photo gallery must render its complete route');
            check(JSON.stringify(map.bounds) === JSON.stringify(routeCoordinates), 'zero-photo map must fit all route coordinates');
            check(map.markers.length === 3 && map.markers.every(marker => !marker.options.icon.className.endsWith('--photo')), 'route points must not become synthetic photo markers');
            const reset = mapOverlay.querySelector('button[title="Reset map zoom"]');
            check(reset, 'route-only map must have working viewport controls'); reset.click();
            mapOverlay.querySelector('[data-map-close]').click();
            check(mapOverlay.hidden, 'route-only map close must work without a photo viewer');
            const reopenedMap = await openRecordedMap();
            check(map._mapPane === null, 'reopening must dispose the previous map');
            teardownGalleryLightbox();
            check(reopenedMap._mapPane === null && mapOverlay.hidden, 'empty-gallery teardown must dispose and hide its map');
        }

        // Reuse the same production gallery-map pipeline with real photo markers and without a route.
        document.body.append(card); config.dataset.lightboxTotal = '200';
        const photoPoint = {id: 1, gallery_id: 7, lat: 49.5, lng: 13, source_type: 'exif_point', point_type: 'photo_point'};
        for (const withRoute of [true, false]) {
            galleryMapPayload = withRoute ? {...routePayload, points: [...routePoints, photoPoint]}
                : {title: 'Photo gallery', source_type: 'exif_points', points: [photoPoint]};
            setupGalleryLightbox();
            const map = await openRecordedMap();
            check(map.lines.length === (withRoute ? 1 : 0), 'photo galleries must retain the optional route layer');
            check(map.markers.filter(marker => marker.options.icon.className.endsWith('--photo')).length === 1, 'usable photo GPS must render exactly one photo marker');
            check(withRoute ? map.bounds.length === 4 : map.zoom === 15, 'existing photo viewport fitting must remain available');
            teardownGalleryLightbox();
        }
        card.remove(); config.dataset.lightboxTotal = '0';
        galleryMapPayload = {title: 'Empty gallery', points: []};
        setupGalleryLightbox();
        const countBeforeEmpty = maps.length;
        const requestsBeforeEmpty = galleryMapRequests;
        mapButton.click(); await tick(); await tick();
        check(galleryMapRequests === requestsBeforeEmpty + 1 && maps.length === countBeforeEmpty, 'no route and no usable GPS must retain the empty state');
        check(document.querySelector('[data-map-overlay]').hidden, 'empty data must not open a misleading map');
        check(location.href === galleryUrl, 'gallery map actions must preserve the URL');
        check(errors.length === 0, `browser errors: ${errors.join('; ')}`);
        result.textContent = 'BROWSER PASS: real module setup, card open, cross-page fetch, detached cache reuse, superseding clicks, CSS split persistence, split close, fullscreen-exit handler, ordinary next navigation, viewer close/reopen, close before dispatch, teardown, URL preservation, zero-photo route with/without viewer markup, route bounds, no synthetic photos, map controls/close/reopen/teardown, photo and route layers, photo-only map, empty map data.';
    } catch (error) {
        result.textContent = `BROWSER FAIL: ${error.stack}\n${errors.join('\n')}`;
    } finally { teardownGalleryLightbox(); window.fetch = originalFetch; }
</script>
</body></html>
