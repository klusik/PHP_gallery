<html lang="en"><head><meta charset="utf-8"><title>Gallery tree regression</title>
<link rel="stylesheet" href="/public/assets/styles/base.css">
<link rel="stylesheet" href="/public/assets/styles/public.css">
<link rel="stylesheet" href="/public/assets/styles/admin.css">
<link rel="stylesheet" href="/public/assets/styles/admin-layout.css">
<link rel="stylesheet" href="/public/assets/styles/admin-dashboard.css">
<link rel="stylesheet" href="/public/assets/styles/admin-reordering.css">
<link rel="stylesheet" href="/public/assets/styles/admin-gallery-list.css">
<link rel="stylesheet" href="/public/assets/styles/side-panel.css">
<link rel="stylesheet" href="/public/assets/styles/admin-cinematic.css">
</head><body class="admin-page"><main id="workspace"><!-- PRODUCTION_GALLERY_MARKUP --></main><pre id="results"></pre>
<script type="module">
import {setupAdminGalleryFilters, setupAdminGalleryTree, setupAdminGalleryReordering} from '/public/assets/gallery-modules/admin-gallery-list.js';
import {isThumbnailSubmission, thumbnailEndpoint} from '/public/assets/gallery-modules/admin-core.js';
const host = document.getElementById('workspace');
const original = host.innerHTML;
const nativeFetch = window.fetch.bind(window);
const posts = [];
let failSave = false;
let failStatus = 400;
let failMessage = 'Synthetic save refused';
let assertions = 0;
let pointerId = null;
document.addEventListener('pointerdown', /** Remember the real Chromium pointer for cancellation coverage. @param {PointerEvent} event Trusted pointer activation. @return {void} Records only its identifier. */ event => { pointerId = event.pointerId; }, true);
/** Fail with useful bounded assertion context.
 * @param {boolean} condition Required predicate.
 * @param {string} message Behavior being verified.
 * @return {void} Records success or throws.
 */
function check(condition, message) { if (!condition) throw new Error(message); assertions++; }
/** Pause until trusted input and asynchronous response handlers settle.
 * @return {Promise<void>} Resolves after a short task boundary.
 */
function settle() { return new Promise(/** Continue after the browser task boundary. @param {function():void} resolve Completion callback. @return {number} Timer handle. */ resolve => setTimeout(resolve, 35)); }
/** Intercept every domain POST before it can leave the fixture.
 * @param {RequestInfo|URL} input Requested URL.
 * @param {RequestInit} options Browser request options.
 * @return {Promise<Response>} Synthetic service response or confined input-adapter response.
 */
window.fetch = async (input, options = {}) => {
    if (String(input).includes('/__')) return nativeFetch(input, options);
    check(options.method === 'POST', 'domain transport remains POST');
    check(options.body instanceof FormData && options.body.get('csrf_token') === 'tree-fixture', 'domain POST preserves CSRF');
    const raw = options.body.get('gallery_tree');
    if (raw) posts.push(JSON.parse(raw));
    return new Response(JSON.stringify(failSave ? {ok: false, message: failMessage} : {ok: true}), {status: failSave ? failStatus : 200, headers: {'Content-Type': 'application/json'}});
};
/** Return an actual rendered gallery row.
 * @param {number} id Disposable gallery identifier.
 * @return {HTMLTableRowElement} Corresponding live row.
 */
function row(id) { return host.querySelector(`[data-gallery-id="${id}"]`); }
/** Reset only the disposable DOM between independent interaction scenarios.
 * @return {void} Reinitializes production modules on a freshly rendered copy.
 */
function reset() { host.innerHTML = original; posts.length = 0; failSave = false; failStatus = 400; failMessage = 'Synthetic save refused'; setupAdminGalleryFilters(); setupAdminGalleryTree(); setupAdminGalleryReordering(); }
/** Send a trusted mouse event through the owned Chromium session.
 * @param {string} type Native protocol event type.
 * @param {number} x Horizontal viewport coordinate.
 * @param {number} y Vertical viewport coordinate.
 * @return {Promise<void>} Resolves after dispatch.
 */
async function mouse(type, x, y) { const response = await nativeFetch(`/__mouse?type=${type}&x=${x}&y=${y}`); check(response.ok, 'trusted mouse adapter available'); }
/** Begin a real primary-button drag from the preview rather than a native control.
 * @param {number} id Gallery being dragged.
 * @return {Promise<{x:number,y:number}>} Initial drag anchor.
 */
async function start(id) {
    const box = row(id).querySelector('.admin-gallery-preview').getBoundingClientRect();
    const x = box.left + box.width / 2, y = box.top + box.height / 2;
    await mouse('mouseMoved', x, y); await mouse('mousePressed', x, y); await mouse('mouseMoved', x, y + 16);
    check(!!document.querySelector('.admin-gallery-order-placeholder'), 'preview starts hierarchy drag');
    return {x, y};
}
/** Finish a drag at a stable position relative to a remaining visible row.
 * @param {number} id Moved gallery identifier.
 * @param {number|null} beforeId Insert before this visible row, or append.
 * @param {number} delta Horizontal nesting gesture in pixels.
 * @return {Promise<void>} Resolves after synthetic persistence completes.
 */
async function drag(id, beforeId, delta = 0) {
    const anchor = await start(id);
    const target = beforeId === null ? host.querySelector('tbody').getBoundingClientRect().bottom + 4 : row(beforeId).getBoundingClientRect().top + 2;
    await mouse('mouseMoved', anchor.x + delta, target); await mouse('mouseReleased', anchor.x + delta, target); await settle();
}
/** Assert the exact full preorder payload, including hidden descendants.
 * @param {Array<Array<number>>} expected Ordered identifier and parent pairs.
 * @return {void} Rejects omitted rows, incorrect parents or duplicate persistence.
 */
function payload(expected) {
    const want = expected.map(/** Convert fixture expectations to transport strings. @param {Array<number>} pair Identifier and parent. @return {{id:string,parent_id:string}} Expected wire entry. */ pair => ({id: String(pair[0]), parent_id: String(pair[1])}));
    check(posts.length === 1, 'one reorder POST per completed change');
    check(JSON.stringify(posts[0]) === JSON.stringify(want), `complete tree payload: ${JSON.stringify(posts[0])}`);
    check(JSON.stringify(Array.from(host.querySelectorAll('[data-gallery-row]'), /** Read canonical row metadata. @param {HTMLTableRowElement} item Live row. @return {{id:string,parent_id:string}} Current hierarchy. */ item => ({id:item.dataset.galleryId,parent_id:item.dataset.parentId}))) === JSON.stringify(want), 'DOM matches complete successful hierarchy');
}
try {
    reset();
    check(host.querySelectorAll('[data-gallery-row]').length === 6, 'actual PHP renderer supplies six galleries');
    check(!host.textContent.includes('Warning:') && row(1).querySelectorAll('.admin-gallery-feature').length === 5 && !!host.querySelector('option[value="maps_inherit"]'), 'complete feature and access-ready render has no warnings and preserves GPS inheritance');
    check(row(1).querySelector('.admin-gallery-title-link').textContent === 'Alpha <safe>' && !row(1).querySelector('safe'), 'prepared title remains escaped');
    check(getComputedStyle(row(1).querySelector('.gallery-row-actions')).display === 'table-cell', 'actions retain table-cell alignment');
    check(row(1).getBoundingClientRect().height < 80, `real full-feature gallery row remains compact (${row(1).getBoundingClientRect().height}px)`);
    const rootPreview = row(1).querySelector('.admin-gallery-preview').getBoundingClientRect();
    const childPreview = row(2).querySelector('.admin-gallery-preview').getBoundingClientRect();
    check(Math.abs(childPreview.left - rootPreview.left - 28) < 1, `one tree level retains 28px indentation (${childPreview.left - rootPreview.left}px)`);
    const form = host.querySelector('form');
    const thumbs = row(1).querySelector('[name="thumbnail_gallery_id"]');
    check(isThumbnailSubmission(form, thumbs) && thumbnailEndpoint(form, thumbs).includes('admin_create_thumbnails'), 'individual thumbnail submitter preserves primary pipeline');
    row(1).querySelector('[name="gallery_ids[]"]').checked = true;
    check(new FormData(form).getAll('gallery_ids[]').join() === '1', 'bulk selection preserves exact gallery ids');
    let clicked = false;
    row(1).querySelector('a').addEventListener('click', /** Observe native public navigation without leaving disposable page. @param {MouseEvent} event Anchor activation. @return {void} Cancels only navigation, after recording activation. */ event => { clicked = true; event.preventDefault(); });
    const link = row(1).querySelector('a').getBoundingClientRect();
    await mouse('mousePressed', link.left + 5, link.top + 5); await mouse('mouseReleased', link.left + 5, link.top + 5);
    check(clicked && posts.length === 0 && !document.querySelector('.admin-gallery-order-placeholder'), 'public title click keeps native activation without dragging');
    const buttonBox = thumbs.getBoundingClientRect();
    await mouse('mousePressed', buttonBox.left+5, buttonBox.top+5); await mouse('mouseMoved', buttonBox.left+35, buttonBox.top+25); await mouse('mouseReleased', buttonBox.left+35, buttonBox.top+25);
    check(posts.length === 0 && !document.querySelector('.admin-gallery-order-placeholder'), 'native thumbnail button does not arm hierarchy dragging');
    await drag(1, null); payload([[4,0],[5,4],[6,0],[1,0],[2,1],[3,2]]);
    reset(); await drag(4, 6, 28); payload([[1,0],[2,1],[3,2],[4,1],[5,4],[6,0]]);
    reset(); await drag(6, null, 28); payload([[1,0],[2,1],[3,2],[4,0],[5,4],[6,4]]);
    check(row(6).querySelector('.admin-gallery-path').textContent === 'beta/gamma' && row(6).querySelector('a').getAttribute('href').endsWith('/gallery/beta/gamma/'), 'right nesting refreshes path and public link');
    check(row(6).querySelector('.admin-gallery-path').title.startsWith('beta/gamma | ') && row(6).querySelector('.admin-gallery-path').title.includes('Gallery 4'), 'right nesting refreshes full path and parent tooltip');
    reset(); await drag(2, 4, -28); payload([[1,0],[2,0],[3,2],[4,0],[5,4],[6,0]]);
    check(row(2).querySelector('.admin-gallery-path').title === 'child', 'left unnesting removes stale parent from path tooltip');
    reset(); row(1).querySelector('[data-gallery-toggle]').click(); await settle();
    check(row(2).hidden && row(3).hidden && getComputedStyle(row(2)).display === 'none', 'collapsed descendants stay visually hidden');
    await drag(1, null); payload([[4,0],[5,4],[6,0],[1,0],[2,1],[3,2]]);
    check(row(2).hidden && row(3).hidden, 'collapsed moved subtree preserves hidden descendants');
    reset(); row(1).querySelector('[data-gallery-toggle]').click(); await settle();
    await drag(6, 4); payload([[1,0],[2,1],[3,2],[6,0],[4,0],[5,4]]);
    check(row(2).hidden && row(3).hidden && !row(6).hidden, 'insertion beside collapsed branch preserves atomic hidden descendants');
    reset(); row(1).querySelector('[data-gallery-toggle]').click(); await settle();
    await drag(6, 4, 28); payload([[1,0],[2,1],[3,2],[6,1],[4,0],[5,4]]);
    check(row(6).hidden, 'nesting uses visible collapsed parent rather than hidden grandchild geometry');
    reset(); const anchor = await start(1);
    await nativeFetch('/__key?key=Escape'); await mouse('mouseReleased', anchor.x, anchor.y + 16); await settle();
    check(posts.length === 0 && Array.from(host.querySelectorAll('[data-gallery-row]'), /** Read row order after cancellation. @param {HTMLTableRowElement} item Live row. @return {string} Stable gallery identifier. */ item => item.dataset.galleryId).join() === '1,2,3,4,5,6', 'Escape restores original tree without persistence');
    reset(); await start(1); document.dispatchEvent(new PointerEvent('pointercancel', {bubbles:true, pointerId})); await settle();
    check(posts.length === 0 && !document.querySelector('.admin-gallery-order-placeholder'), 'pointer cancellation never commits');
    await mouse('mouseReleased', 1, 1);
    reset(); const filter = host.querySelector('[data-gallery-visibility-filter]'); filter.value = 'public'; filter.dispatchEvent(new Event('change'));
    check(row(6).hidden, 'visibility filter hides private gallery');
    const preview = row(1).querySelector('.admin-gallery-preview').getBoundingClientRect();
    await mouse('mousePressed', preview.left+5, preview.top+5); await mouse('mouseMoved', preview.left+35, preview.top+25); await mouse('mouseReleased', preview.left+35, preview.top+25);
    check(posts.length === 0 && !document.querySelector('.admin-gallery-order-placeholder'), 'filtered tree refuses drag persistence');
    reset(); failSave = true; await drag(1, null);
    check(posts.length === 1 && host.querySelector('[data-admin-gallery-order-status]').textContent.includes('Synthetic save refused'), 'failed save reports visible error without success');
    reset(); failSave = true; failStatus = 200; await drag(1, null);
    check(posts.length === 1 && host.querySelector('[data-admin-gallery-order-status]').textContent.includes('Synthetic save refused'), 'HTTP success with refused mutation still reports an error');
    reset(); failSave = true;
    failMessage = 'Synthetic gallery order save refused. The requested parent placement could not be completed; review the gallery hierarchy and its current folder locations before trying this operation again. Existing photographs remain available for inspection.';
    await drag(1, null);
    const errorStatus = host.querySelector('[data-admin-gallery-order-status]');
    const workspaceBox = host.querySelector('.admin-gallery-workspace').getBoundingClientRect();
    check(failMessage.length > 160 && errorStatus.dataset.state === 'error' && errorStatus.textContent === failMessage, 'long rejected-save message remains complete in the error state');
    const statusBox = errorStatus.getBoundingClientRect();
    check(statusBox.left >= workspaceBox.left && statusBox.right <= workspaceBox.right + 1, 'long error status stays within workspace bounds');
    const textRange = document.createRange(); textRange.selectNodeContents(errorStatus);
    for (const line of textRange.getClientRects()) {
        check(line.left >= workspaceBox.left && line.right <= workspaceBox.right + 1, 'long error text wraps without horizontal clipping');
    }
    check(errorStatus.scrollWidth <= errorStatus.clientWidth + 1, 'long error status has no concealed horizontal overflow');
    document.getElementById('results').textContent = `BROWSER PASS ${assertions} assertions`;
} catch (error) { document.getElementById('results').textContent = `BROWSER FAIL ${error.message}`; }
</script></body></html>
