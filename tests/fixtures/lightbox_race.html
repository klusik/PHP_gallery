<script type="module">
    import {setupGalleryLightbox, teardownGalleryLightbox} from '/public/assets/gallery-modules/lightbox-deferred.js?v=20261030-smart-paint-v5';
    import {setupQuickPhotoTags} from '/public/assets/gallery-modules/quick-photo-tags.js?v=20261021-quick-tag-active-source-v5';

    const result = document.querySelector('#results');
    const errors = [];
    window.quickTagFixtureErrors = errors;
    const originalFetch = window.fetch.bind(window);
    const metadataPending = [];
    const trackedMediaFetchCounts = new Map();
    const metadataPath = '/metadata';
    const nativeImageDecode = HTMLImageElement.prototype.decode;
    const decodeGates = [];
    const decodeGateSources = new Set();
    const decodeGateCounts = new Map();
    const createdDetachedImages = [];
    const quickTagSubmissions = [];
    const quickTagInput = document.querySelector('[data-quick-photo-tag-input]');
    const quickTagPopover = document.querySelector('[data-quick-photo-tag-popover]');
    const quickTagViewer = document.querySelector('[data-lightbox]');
    const quickTagKeyboardLock = {
        supported: false,
        attempts: 0,
        acquired: 0,
        rejected: 0,
        releases: 0,
    };
    window.quickTagDeferNextKeyboardLock = false;
    window.quickTagDeferredKeyboardLockResolver = null;
    window.quickTagRejectNextKeyboardLock = false;
    window.quickTagDeferredKeyboardLockRejector = null;
    window.quickTagDeferredKeyboardLockSettled = false;
    const keyboard = navigator.keyboard;
    if (keyboard && typeof keyboard.lock === 'function') {
        const nativeKeyboardLock = keyboard.lock.bind(keyboard);
        const nativeKeyboardUnlock = typeof keyboard.unlock === 'function'
            ? keyboard.unlock.bind(keyboard) : null;
        try {
            Object.defineProperty(keyboard, 'lock', {
                configurable: true,
                /** Record the production lock call before delegating to the browser API.
                 * @param {Array<string>} keys Browser key codes requested by the viewer.
                 * @returns {Promise<void>} Resolves or rejects with the browser lock request.
                 */
                value(keys) {
                    quickTagKeyboardLock.attempts += 1;
                    if (window.quickTagRejectNextKeyboardLock) {
                        window.quickTagRejectNextKeyboardLock = false;
                        return new Promise((resolve, reject) => {
                            window.quickTagDeferredKeyboardLockRejector = () => {
                                window.quickTagDeferredKeyboardLockSettled = true;
                                reject(new Error('Controlled fixture rejection.'));
                            };
                        }).catch((error) => {
                            quickTagKeyboardLock.rejected += 1;
                            throw error;
                        });
                    }
                    const deferResolution = window.quickTagDeferNextKeyboardLock;
                    window.quickTagDeferNextKeyboardLock = false;
                    return nativeKeyboardLock(keys).then(() => {
                        quickTagKeyboardLock.acquired += 1;
                        if (!deferResolution) return;
                        return new Promise((resolve) => {
                            window.quickTagDeferredKeyboardLockResolver = () => {
                                window.quickTagDeferredKeyboardLockSettled = true;
                                resolve();
                            };
                        });
                    }).catch((error) => {
                        quickTagKeyboardLock.rejected += 1;
                        throw error;
                    });
                },
            });
            if (nativeKeyboardUnlock) {
                Object.defineProperty(keyboard, 'unlock', {
                    configurable: true,
                    /** Count production releases before delegating to the browser API.
                     * @returns {void} Releases the browser's current keyboard lock.
                     */
                    value() {
                        quickTagKeyboardLock.releases += 1;
                        return nativeKeyboardUnlock();
                    },
                });
            }
            quickTagKeyboardLock.supported = true;
        } catch {
            quickTagKeyboardLock.supported = false;
        }
    }
    const nativeRequestFullscreen = typeof quickTagViewer.requestFullscreen === 'function'
        ? quickTagViewer.requestFullscreen.bind(quickTagViewer) : null;
    if (nativeRequestFullscreen) {
        quickTagViewer.requestFullscreen = (options) => {
            window.quickTagFullscreenOptions = options || null;
            return nativeRequestFullscreen(options);
        };
    }
    const quickTagSessionKey = 'gallery.quickPhotoTag.lastAdded';
    // Wait beyond the desktop HUD auto-hide timer before asserting that an open editor keeps it visible.
    // Type: integer. Units: milliseconds. Scope: quick-tag fullscreen lifecycle fixture.
    // Consumers: the visible-HUD assertion below. Rationale: exceed the production 1,800ms desktop hide delay.
    const QUICK_TAG_HUD_AUTO_HIDE_WAIT_MS = 1900;
    // Fixture synchronization phases coordinate trusted keys from the owned browser runner.
    window.quickTagInputPhase = '';
    const NativeImage = window.Image;
    const mediaSvg = 'data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600"><rect width="800" height="600" fill="slateblue"/></svg>');
    const previewSources = new Map();
    const fullSources = new Map();

    window.addEventListener('error', event => errors.push(event.message));
    window.addEventListener('unhandledrejection', event => errors.push(String(event.reason)));

    /** Throw a browser-visible failure with a precise contract message.
     * @param {boolean} value Assertion result.
     * @param {string} message Failure explanation.
     * @return {void} Throws when the contract is absent.
     */
    function check(value, message) {
        if (!value) throw new Error(message);
    }

    /** Wait for one observable browser or loopback-server state before the fixture deadline.
     * @param {function(): boolean|Promise<boolean>} predicate State predicate to poll.
     * @param {string} message Failure explanation after the deadline.
     * @param {number} timeoutMs Maximum wait in milliseconds.
     * @return {Promise<void>} Resolves when the state is observable.
     */
    async function waitFor(predicate, message, timeoutMs = 5000) {
        const deadline = Date.now() + timeoutMs;
        while (Date.now() < deadline) {
            if (await predicate()) return;
            await new Promise(resolve => setTimeout(resolve, 10));
        }
        throw new Error(message);
    }

    /** Return the held response and cancellation state for all actual local image requests.
     * @return {Promise<Array<{path: string, released: boolean, aborted: boolean}>>} Server-observed image requests.
     */
    async function imageStats() {
        const response = await originalFetch('/__fixture/stats', {cache: 'no-store'});
        return (await response.json()).images;
    }

    /** Wait until the browser has started the requested actual image network request.
     * @param {string} source Path and query of the expected local image.
     * @param {number} occurrence Minimum request count for this source.
     * @return {Promise<void>} Resolves after the browser request reaches the server.
     */
    async function waitForImageRequest(source, occurrence = 1) {
        await waitFor(async () => (await imageStats()).filter(item => item.path === source).length >= occurrence,
            `Image request did not start: ${source}; requests=${JSON.stringify(await imageStats())}; overlayHidden=${overlay.hidden}; title=${activePresentation().title}; cardSource=${cardA.dataset.previewSrc}`);
    }

    /** Release a held local image response so Chromium performs its real image load and decode.
     * @param {string} source Path and query of the held image.
     * @return {Promise<void>} Resolves after the server releases the response.
     */
    async function releaseImage(source) {
        const response = await originalFetch(`/__fixture/release-image?path=${encodeURIComponent(source)}`, {cache: 'no-store'});
        const payload = await response.json();
        check(payload.ok, `No held image response could be released: ${source}`);
    }

    /** Finish held requests for one exact URL with bytes the browser cannot decode as an image.
     * @param {string} source Path and query of the held image.
     * @return {Promise<number>} Number of failed in-flight responses.
     */
    async function failImage(source) {
        const response = await originalFetch(`/__fixture/fail-image?path=${encodeURIComponent(source)}`, {cache: 'no-store'});
        const payload = await response.json();
        check(payload.ok, `No held image response could be failed: ${source}`);
        return payload.count;
    }

    /** Wait until actual native image decode has completed and the fixture's continuation is gated.
     * @param {string} source Path and query of the decoded image.
     * @param {number} decodeOrdinal Ordinal of the expected native decode gate.
     * @return {Promise<void>} Resolves when the continuation is held.
     */
    async function waitForDecodeGate(source, decodeOrdinal = 1) {
        await waitFor(() => decodeGates.some(gate => gate.source === source && gate.ordinal >= decodeOrdinal),
            `Native image decode did not reach gate ${decodeOrdinal}: ${source}`);
    }

    /** Release one held post-decode continuation for the exact media URL.
     * @param {string} source Path and query of the decoded image.
     * @param {number} decodeOrdinal Ordinal of the continuation to release.
     * @return {void} Releases the selected decode continuation.
     */
    function releaseDecode(source, decodeOrdinal = 1) {
        const index = decodeGates.findIndex(gate => gate.source === source && gate.ordinal === decodeOrdinal);
        check(index >= 0, `No held native decode continuation exists: ${source}`);
        const [gate] = decodeGates.splice(index, 1);
        gate.resolve();
    }

    /** Return one absolute synthetic image URL with a unique attempt key.
     * @param {string} photo Synthetic photo identifier.
     * @param {string} kind Preview or full source kind.
     * @param {number} attempt Unique request attempt.
     * @return {string} Absolute same-origin synthetic media URL.
     */
    function mediaSource(photo, kind, attempt = 1) {
        return new URL(`/media/${photo}/${kind}.svg?attempt=${attempt}`, location.href).href;
    }

    /** Return the same-origin path and query used by the local image response controller.
     * @param {string} source Absolute or relative image URL.
     * @return {string} Local request key.
     */
    function mediaKey(source) {
        const url = new URL(source, location.href);
        return url.pathname + url.search;
    }

    /** Build a complete bounded metadata item for one sparse result index.
     * @param {number} index Zero-based result index.
     * @param {number} id Stable image identifier.
     * @param {string} title Displayed image title.
     * @param {string} preview Authorized preview source.
     * @param {string} full Authorized original source.
     * @return {Record<string, unknown>} Sparse endpoint fixture item.
     */
    function metadataItem(index, id, title, preview, full) {
        return {
            id,
            index,
            gallery_id: 7,
            source_gallery_id: 70,
            quick_tag_enabled: true,
            quick_photo_tags: [{id: 44, name: 'danik', slug: 'danik'}],
            title,
            page_url: `/photo/${id}`,
            full_src: full,
            preview_src: preview,
            width: 800,
            height: 600,
        };
    }

    /** Resolve the held real production metadata fetch with one selected sparse card.
     * @param {number} offset Requested range offset.
     * @param {Record<string, unknown>} item Sparse card to return.
     * @return {void} Resolves the matching fetch promise.
     */
    function resolveMetadata(offset, item) {
        const pending = metadataPending.find(request => (request.offset === offset || request.imageId === offset) && !request.settled);
        check(pending, `Sparse metadata request for key ${offset} was not pending`);
        pending.settled = true;
        pending.resolve(new Response(JSON.stringify({target_index: item.index, items: [item]}), {headers: {'Content-Type': 'application/json'}}));
    }

    /** Return the current title and live image node produced by the actual lightbox module.
     * @return {{title: string, image: HTMLImageElement|null}} Current DOM presentation.
     */
    function activePresentation() {
        return {
            title: document.querySelector('[data-lightbox-title]')?.textContent || '',
            image: document.querySelector('[data-lightbox-img]'),
        };
    }

    window.fetch = (input, options = {}) => {
        const url = new URL(input instanceof Request ? input.url : String(input), location.href);
        if (url.pathname === '/__quick_tag') {
            const body = options.body;
            const imageId = Number(body.get('image_id'));
            const galleryId = Number(body.get('source_gallery_id'));
            const tag = {id: 44, name: 'danik', slug: 'danik'};
            quickTagSubmissions.push({action: body.get('action'), imageId, galleryId, tagId: body.get('tag_id')});
            return Promise.resolve(new Response(JSON.stringify({
                ok: true,
                direct_tags: [tag],
                changed_tag: tag,
                already_present: false,
                mutation: {type: 'image.tag', entity: 'image', action: 'add', entity_ids: [imageId]},
                contexts: [{
                    type: 'gallery',
                    gallery_id: galleryId,
                    render_url: `/gallery/${galleryId}`,
                    render_mode: 'preserve_view',
                    postcondition: {
                        type: 'image_tags',
                        image_id: imageId,
                        tag_ids: [tag.id],
                        tag_names: [tag.name],
                    },
                }],
            }), {headers: {'Content-Type': 'application/json'}}));
        }
        if (url.pathname === metadataPath) {
            return new Promise(resolve => metadataPending.push({
                offset: Number(url.searchParams.get('offset')),
                imageId: Number(url.searchParams.get('target_image_id')),
                signal: options.signal,
                resolve,
                settled: false,
            }));
        }
        if (url.pathname.startsWith('/media/') && url.pathname.includes('/full.svg')) {
            const requestKey = url.pathname + url.search;
            trackedMediaFetchCounts.set(requestKey, (trackedMediaFetchCounts.get(requestKey) || 0) + 1);
        }
        return originalFetch(input, options);
    };

    window.Image = function (width, height) {
        const image = new NativeImage(width, height);
        createdDetachedImages.push(image);
        return image;
    };
    window.Image.prototype = NativeImage.prototype;
    HTMLImageElement.prototype.decode = function (...args) {
        const source = this.currentSrc || this.src;
        const key = source ? mediaKey(source) : '';
        const count = decodeGateCounts.get(key) || 0;
        const shouldGate = createdDetachedImages.includes(this) && decodeGateSources.has(key) && count === 0;
        if (!shouldGate) return nativeImageDecode.apply(this, args);
        const ordinal = count + 1;
        decodeGateCounts.set(key, ordinal);
        return nativeImageDecode.apply(this, args).then(() => new Promise(resolve => decodeGates.push({source: key, ordinal, resolve})));
    };

    const overlay = document.querySelector('[data-lightbox]');
    const cardA = document.querySelector('#card-a');
    const cardB = document.querySelector('#card-b');
    const cardC = document.querySelector('#card-c');
    for (const [card, photo, id] of [[cardA, 'a', '1'], [cardB, 'b', '2'], [cardC, 'c', '3']]) {
        const preview = mediaSource(photo, 'preview');
        const full = mediaSource(photo, 'full');
        card.dataset.previewSrc = preview;
        card.dataset.fullSrc = full;
        card.dataset.imageWidth = '800';
        card.dataset.imageHeight = '600';
        card.dataset.galleryId = '7';
        card.dataset.imageId = id;
        previewSources.set(photo.toUpperCase(), preview);
        fullSources.set(photo.toUpperCase(), full);
    }

    try {
        for (const photo of ['A', 'B', 'C']) decodeGateSources.add(mediaKey(previewSources.get(photo)));
        setupGalleryLightbox();

        cardA.click();
        check(!overlay.hidden && overlay.classList.contains('is-initial-loading')
            && String(overlay.dataset.currentImageId || '') === '',
        'the deferred click exposes its loading shell without claiming an active photo before full setup');
        await waitForImageRequest(mediaKey(previewSources.get('A')));
        await releaseImage(mediaKey(previewSources.get('A')));
        await waitForDecodeGate(mediaKey(previewSources.get('A')));

        document.querySelector('[data-lightbox-action="next"]').click();
        await waitForImageRequest(mediaKey(previewSources.get('B')));
        await releaseImage(mediaKey(previewSources.get('B')));
        await waitForDecodeGate(mediaKey(previewSources.get('B')));

        document.querySelector('[data-lightbox-action="next"]').click();
        await waitForImageRequest(mediaKey(previewSources.get('C')));
        await releaseImage(mediaKey(previewSources.get('C')));
        await waitForDecodeGate(mediaKey(previewSources.get('C')));

        releaseDecode(mediaKey(previewSources.get('C')), 1);
        await waitFor(() => activePresentation().title === 'Photo C' && activePresentation().image?.dataset.lightboxImageId === '3', 'Newest photo C did not become active after its native decode.');
        releaseDecode(mediaKey(previewSources.get('B')), 1);
        releaseDecode(mediaKey(previewSources.get('A')), 1);
        await new Promise(resolve => setTimeout(resolve, 180));
        check(activePresentation().title === 'Photo C', 'late B/A decode completions must not replace current photo C');
        check(activePresentation().image?.dataset.lightboxImageId === '3', 'late image callbacks must not change the live image owner');

        const activeImageBeforeZoom = activePresentation().image;
        const expectedActiveOriginal = new URL(fullSources.get('C'), location.href).href;
        document.querySelector('[data-lightbox-action="zoom-in"]').click();
        const imageImmediatelyAfterZoomInput = activePresentation().image;
        const immediateZoomSourceMatches = imageImmediatelyAfterZoomInput?.getAttribute('src') === expectedActiveOriginal;
        const immediateZoomSourceFailure = immediateZoomSourceMatches
            ? ''
            : 'zoom above 100% must assign the active card original to the live image in the same click task';
        check(Boolean(activeImageBeforeZoom?.dataset.lightboxImageId === '3'), 'same-task original promotion must keep the active image identity');
        check(immediateZoomSourceMatches, immediateZoomSourceFailure);
        await waitForImageRequest(mediaKey(fullSources.get('C')));
        document.querySelector('[data-lightbox-action="zoom-in"]').click();
        document.querySelector('[data-lightbox-action="zoom-in"]').click();
        check(activePresentation().image?.getAttribute('src') === expectedActiveOriginal,
            'repeated zoom input must keep the same active original assigned to the live image');
        check(trackedMediaFetchCounts.get(mediaKey(fullSources.get('C'))) === 1,
            'repeated zoom input while the active original is pending must reuse its tracked Fetch');

        const sparseNavigationIndex = 18;
        const sparseNavigationId = 118;
        const sparseNavigationPreview = mediaSource('sparse-navigation-18', 'preview');
        const sparseNavigationFull = mediaSource('sparse-navigation-18', 'full');
        const oldRangeOffset = 0;
        const newRangeOffset = 12;
        for (let advance = 0; advance < sparseNavigationIndex - 2; advance += 1) {
            document.querySelector('[data-lightbox-action="next"]').click();
        }
        await waitFor(() => metadataPending.some(request => request.offset === oldRangeOffset && !request.settled),
            'Sparse navigation did not request the old metadata window through the next control.');
        await waitFor(() => metadataPending.some(request => request.offset === newRangeOffset && !request.settled),
            'Sparse navigation did not cross into a second metadata window through the next control.');
        const oldNavigationRange = metadataPending.find(request => request.offset === oldRangeOffset && !request.settled);
        const newerNavigationRange = metadataPending.find(request => request.offset === newRangeOffset && !request.settled);
        check(oldNavigationRange && newerNavigationRange, 'Both sparse navigation windows must remain pending.');
        check(!oldNavigationRange.signal?.aborted, 'Shared metadata window work must not inherit the superseded navigation signal.');
        resolveMetadata(newRangeOffset, metadataItem(sparseNavigationIndex, sparseNavigationId, 'Sparse Navigation 18', sparseNavigationPreview, sparseNavigationFull));
        await waitForImageRequest(mediaKey(sparseNavigationPreview));
        await releaseImage(mediaKey(sparseNavigationPreview));
        await waitFor(() => activePresentation().title === 'Sparse Navigation 18'
            && activePresentation().image?.dataset.lightboxImageId === String(sparseNavigationId),
        'Newest sparse navigation target did not resume after its own metadata window arrived.');
        resolveMetadata(oldRangeOffset, metadataItem(3, 4, 'Stale Sparse Navigation 4', mediaSvg, mediaSvg));
        await new Promise(resolve => setTimeout(resolve, 120));
        check(activePresentation().title === 'Sparse Navigation 18'
            && activePresentation().image?.dataset.lightboxImageId === String(sparseNavigationId),
        'Late completion from the older sparse navigation window must not resume its stale target.');

        const sparseTwelve = document.createElement('a');
        sparseTwelve.href = '/photo/13';
        sparseTwelve.dataset.mapOpenPhoto = '13';
        sparseTwelve.dataset.mapPhotoGalleryId = '7';
        sparseTwelve.dataset.mapPhotoPageUrl = '/photo/13';
        const sparseTwentyFour = document.createElement('a');
        sparseTwentyFour.href = '/photo/25';
        sparseTwentyFour.dataset.mapOpenPhoto = '25';
        sparseTwentyFour.dataset.mapPhotoGalleryId = '7';
        sparseTwentyFour.dataset.mapPhotoPageUrl = '/photo/25';
        document.body.append(sparseTwelve, sparseTwentyFour);

        sparseTwelve.click();
        await waitFor(() => metadataPending.some(request => request.imageId === 13 && !request.settled), 'Sparse map target 13 request did not start.');
        sparseTwentyFour.click();
        await waitFor(() => metadataPending.some(request => request.imageId === 25 && !request.settled), 'Sparse map target 25 request did not start.');
        resolveMetadata(25, metadataItem(24, 25, 'Sparse Photo 25', mediaSvg, mediaSvg));
        await waitFor(() => activePresentation().title === 'Sparse Photo 25', 'Newer sparse target did not render.');
        const sparseTagSource = document.querySelector('[data-lightbox-source][data-image-id="25"]');
        check(
            quickTagViewer.dataset.currentImageId === '25'
                && quickTagViewer.dataset.currentSourceGalleryId === '70'
                && quickTagViewer.dataset.currentQuickTagEnabled === '1'
                && JSON.parse(quickTagViewer.dataset.currentQuickPhotoTags || '[]')[0]?.id === 44
                && sparseTagSource === null,
            'lazy source metadata stays detached while its active overlay retains physical owner and direct quick-tag state',
        );
        resolveMetadata(13, metadataItem(12, 13, 'Sparse Photo 13', mediaSvg, mediaSvg));
        await new Promise(resolve => setTimeout(resolve, 60));
        check(activePresentation().title === 'Sparse Photo 25', 'late sparse metadata must not resume the stale target');

        const reopenSourceTwo = mediaSource('a', 'preview', 2);
        cardA.dataset.previewSrc = reopenSourceTwo;
        cardA.dataset.fullSrc = mediaSource('a', 'full', 2);
        const reopenKeyTwo = mediaKey(reopenSourceTwo);
        decodeGateSources.add(reopenKeyTwo);
        document.querySelector('[data-lightbox-action="close"]').click();
        cardA.click();
        await waitForImageRequest(reopenKeyTwo);
        await releaseImage(reopenKeyTwo);
        await waitForDecodeGate(reopenKeyTwo);
        const canceledDetached = createdDetachedImages.find(image => mediaKey(image.src || '') === reopenKeyTwo);
        document.querySelector('[data-lightbox-action="close"]').click();
        await waitFor(() => canceledDetached?.getAttribute('src') === null, 'Close must detach an unfinished detached image request source.');

        const reopenSourceThree = mediaSource('a', 'preview', 3);
        const reopenKeyThree = mediaKey(reopenSourceThree);
        cardA.dataset.previewSrc = reopenSourceThree;
        cardA.dataset.fullSrc = mediaSource('a', 'full', 3);
        decodeGateSources.add(reopenKeyThree);
        cardA.click();
        await waitForImageRequest(reopenKeyThree);
        await releaseImage(reopenKeyThree);
        await waitForDecodeGate(reopenKeyThree);
        releaseDecode(reopenKeyThree);
        await waitFor(() => activePresentation().title === 'Photo A' && activePresentation().image?.getAttribute('src') === reopenSourceThree,
            'Reopened viewer did not display the new photo A completion.');
        releaseDecode(reopenKeyTwo);
        await new Promise(resolve => setTimeout(resolve, 120));
        check(activePresentation().image?.getAttribute('src') === new URL(reopenSourceThree, location.href).href,
            'a completion from the closed viewer must not replace the reopened image');

        const reopenedOriginal = mediaSource('a', 'full', 3);
        const reopenedOriginalKey = mediaKey(reopenedOriginal);
        const reopenedPreviewKey = mediaKey(reopenSourceThree);
        document.querySelector('[data-lightbox-action="zoom-in"]').click();
        check(activePresentation().image?.getAttribute('src') === reopenedOriginal,
            'reopened photo zoom must synchronously select that photo original in the live image');
        await waitForImageRequest(reopenedOriginalKey);
        const failedOriginalResponses = await failImage(reopenedOriginalKey);
        check(failedOriginalResponses >= 1, 'the current photo original request must be held before inducing its decode failure');
        try {
            await waitFor(() => activePresentation().title === 'Photo A'
                && activePresentation().image?.dataset.lightboxImageId === '1'
            && activePresentation().image?.getAttribute('src') === new URL(reopenSourceThree, location.href).href
            && activePresentation().image.complete
            && activePresentation().image.naturalWidth > 0,
            'a failed original load/decode must restore the protected preview for the still-current photo', 2200);
        } catch (error) {
            const failedImage = activePresentation().image;
            const progress = overlay.querySelector('.lightbox-quality-progress');
            const requests = (await imageStats()).filter(item => item.path === reopenedOriginalKey || item.path === reopenedPreviewKey);
            throw new Error(`${error.message}; presentation=${JSON.stringify({title: activePresentation().title, imageId: failedImage?.dataset.lightboxImageId || '', src: failedImage?.getAttribute('src') || '', complete: failedImage?.complete || false, naturalWidth: failedImage?.naturalWidth || 0, explicitQualityOwner: failedImage?.dataset.lightboxExplicitZoomQuality || '', overlayClasses: Array.from(overlay.classList), progressHidden: progress?.hidden ?? null, progressText: progress?.textContent || '', failedOriginalResponses})}; ownedRequests=${JSON.stringify(requests)}`);
        }

        document.querySelector('[data-lightbox-action="close"]').click();

        cardA.click();
        await waitFor(() => activePresentation().title === 'Photo A'
            && activePresentation().image?.dataset.lightboxImageId === '1',
        'Quick-tag viewer did not reopen physical photo A after image race coverage.');

        // Load quick-tag behavior after the viewer has already published its active physical source.
        setupQuickPhotoTags();
        const quickTagViewerButtons = [...quickTagViewer.querySelectorAll(
            '[data-quick-photo-tag-viewer]',
        )];
        await waitFor(() => quickTagViewerButtons.length === 2
            && quickTagViewerButtons.every(button => !button.hidden
                && button.dataset.quickTagAvailable === '1'),
        'Late quick-tag module setup did not hydrate the already-active viewer controls.');
        sessionStorage.setItem(quickTagSessionKey, JSON.stringify({id: 44, name: 'danik', slug: 'danik'}));
        window.quickTagInputPhase = 'normal-t';
        await waitFor(() => !quickTagPopover.hidden, 'Trusted Shift+T did not open quick tags on the active normal photo.');
        check(quickTagViewer.dataset.currentImageId === '1'
            && quickTagViewer.dataset.currentSourceGalleryId === '70'
            && quickTagPopover.parentElement === quickTagViewer
            && document.activeElement === quickTagInput
            && quickTagInput.value === 'danik',
        'real lightbox active-photo event opens the normal quick-tag editor for its physical source and remembered tag');
        check(quickTagSubmissions.length === 0, 'opening the viewer quick-tag editor never applies its remembered tag');
        window.quickTagInputPhase = 'normal-enter';
        await waitFor(() => quickTagSubmissions.length === 1, 'Enter did not submit the remembered tag for the normal active photo.');
        check(quickTagSubmissions[0].action === 'quick_tag_add'
            && quickTagSubmissions[0].imageId === 1
            && quickTagSubmissions[0].galleryId === 70
            && quickTagSubmissions[0].tagId === '44',
        'normal viewer tag add targets the current physical image and source gallery');
        await waitFor(() => quickTagPopover.hidden,
            'Confirmed successful normal-viewer add did not close its current editor.');
        check(quickTagInput.value === '',
            'confirmed normal-viewer save clears the prepared input before closing');
        window.quickTagInputPhase = 'normal-reopen-t';
        await waitFor(() => !quickTagPopover.hidden,
            'T did not reopen the editor after a confirmed normal-viewer save.');
        window.quickTagInputPhase = 'normal-escape';
        await waitFor(() => quickTagPopover.hidden, 'Escape did not close the quick-tag editor first.');
        check(!quickTagViewer.hidden, 'first Escape leaves the normal lightbox open');
        window.quickTagInputPhase = 'normal-next';
        await waitFor(() => quickTagViewer.dataset.currentImageId === '2', 'Next did not advance the real active source photo.');
        window.quickTagInputPhase = 'normal-next-t';
        await waitFor(() => !quickTagPopover.hidden, 'Shift+T did not open quick tags for the next active source.');
        check(quickTagViewer.dataset.currentSourceGalleryId === '70'
            && quickTagInput.value === 'danik'
            && quickTagSubmissions.length === 1,
        'remembered tag is offered for the next viewer photo without applying it on open');
        window.quickTagInputPhase = 'normal-next-escape';
        await waitFor(() => quickTagPopover.hidden, 'Escape did not close the next-photo editor.');
        const fullscreenEntered = new Promise((resolve) => {
            document.addEventListener('fullscreenchange', resolve, {once: true});
        });
        window.quickTagInputPhase = 'fullscreen-f';
        await waitFor(() => document.fullscreenElement === quickTagViewer
            || quickTagViewer.classList.contains('is-css-fullscreen')
            || quickTagViewer.classList.contains('is-fullscreen'),
        'F did not enter native or application fullscreen mode.');
        if (document.fullscreenElement === quickTagViewer) {
            await fullscreenEntered;
        }
        // Native fullscreen can expose its owner before layout and viewport
        // events settle. Two paint boundaries commit that new geometry before
        // the next trusted key measures the HUD anchor; no assertion is relaxed.
        await new Promise((resolve) => requestAnimationFrame(() => {
            requestAnimationFrame(resolve);
        }));
        window.quickTagFullscreenMode = document.fullscreenElement === quickTagViewer
            ? 'native' : 'application';
        if (quickTagFullscreenMode === 'native' && nativeRequestFullscreen
            && quickTagViewer.dataset.currentQuickTagEnabled === '1') {
            check(window.quickTagFullscreenOptions?.keyboardLock === 'browser',
                'authorized native viewer requests browser-specific fullscreen key routing');
        }
        window.quickTagInputPhase = 'fullscreen-t';
        await waitFor(() => !quickTagPopover.hidden, 'Shift+T did not open quick tags in fullscreen.');
        const hudTagButton = quickTagViewer.querySelector('.lightbox-quick-photo-tag-button.lightbox-hud');
        const quickPopoverRect = quickTagPopover.getBoundingClientRect();
        check(quickTagFullscreenMode === 'native'
            ? document.fullscreenElement === quickTagViewer
            : quickTagViewer.classList.contains('is-css-fullscreen')
                || quickTagViewer.classList.contains('is-fullscreen'),
        'fullscreen mode is recorded as native or application-managed without conflating the two');
        check(hudTagButton instanceof HTMLElement && !hudTagButton.hidden
            && quickTagPopover.parentElement === quickTagViewer
            && quickPopoverRect.left >= 0 && quickPopoverRect.top >= 0
            && quickPopoverRect.right <= innerWidth && quickPopoverRect.bottom <= innerHeight,
        `fullscreen quick tags use the visible HUD and remain inside the active viewer viewport: ${JSON.stringify({
            mode: quickTagFullscreenMode,
            nativeFullscreen: document.fullscreenElement === quickTagViewer,
            hudHidden: hudTagButton?.hidden ?? null,
            visualViewport: window.visualViewport ? {left:visualViewport.offsetLeft,top:visualViewport.offsetTop,width:visualViewport.width,height:visualViewport.height} : null,
            popupStyle: {left:quickTagPopover.style.left,top:quickTagPopover.style.top,position:getComputedStyle(quickTagPopover).position,margin:getComputedStyle(quickTagPopover).margin},
            viewerRect: {left:quickTagViewer.getBoundingClientRect().left,top:quickTagViewer.getBoundingClientRect().top},
            popupParent: quickTagPopover.parentElement?.className || '',
            rect: {
                left: quickPopoverRect.left,
                top: quickPopoverRect.top,
                right: quickPopoverRect.right,
                bottom: quickPopoverRect.bottom,
            },
            viewport: {width: innerWidth, height: innerHeight},
        })}`);
        window.quickTagInputPhase = 'fullscreen-hud-held-open';
        await new Promise(resolve => setTimeout(resolve, QUICK_TAG_HUD_AUTO_HIDE_WAIT_MS));
        check(quickTagViewer.classList.contains('is-ui-visible'),
            'the open quick-tag editor keeps its fullscreen HUD visible past the normal auto-hide delay');
        window.quickTagInputPhase = 'fullscreen-enter';
        await waitFor(() => quickTagSubmissions.length === 2, 'Enter did not submit the remembered tag in fullscreen.');
        check(quickTagSubmissions[1].imageId === 2 && quickTagSubmissions[1].galleryId === 70,
            'fullscreen tag mutation remains bound to the active physical source image');
        await waitFor(() => quickTagPopover.hidden,
            'Confirmed successful fullscreen add did not close its current editor.');
        // Each reopening owns a new request. Earlier successful/failed locks
        // cannot establish that this request exposed its deferred resolver.
        const acquisitionsBeforeReopen = quickTagKeyboardLock.acquired;
        const rejectionsBeforeReopen = quickTagKeyboardLock.rejected;
        window.quickTagDeferNextKeyboardLock = true;
        window.quickTagInputPhase = 'fullscreen-reopen-t';
        await waitFor(() => !quickTagPopover.hidden,
            'T did not reopen the fullscreen editor after a confirmed save.');
        if (quickTagKeyboardLock.supported) {
            await waitFor(() => (
                quickTagKeyboardLock.acquired > acquisitionsBeforeReopen
                    && typeof quickTagDeferredKeyboardLockResolver === 'function'
            ) || quickTagKeyboardLock.rejected > rejectionsBeforeReopen,
            'The reopened editor Keyboard Lock did not expose its deferred resolver or reject.');
        }
        if (quickTagDeferredKeyboardLockResolver && !quickTagDeferredKeyboardLockSettled) {
            const releasesBeforeRebind = quickTagKeyboardLock.releases;
            quickTagPopover.querySelector('[data-quick-photo-tag-close]').click();
            check(quickTagPopover.hidden && document.activeElement === hudTagButton
                && quickTagSubmissions.length === 2,
            'the × control closes unsaved input, restores HUD focus, and sends no write');
            window.quickTagInputPhase = 'fullscreen-stale-reopen-t';
            await waitFor(() => !quickTagPopover.hidden,
                'T did not bind a new popup while the prior lock request was pending.');
            window.quickTagDeferredKeyboardLockResolver();
            await waitFor(() => quickTagDeferredKeyboardLockSettled,
                'The intentionally delayed Keyboard Lock promise did not settle.');
            check(quickTagKeyboardLock.releases === releasesBeforeRebind
                && !quickTagPopover.hidden,
            'stale lock completion is retained for the newer popup instead of unlocking it');
        }
        if (quickTagKeyboardLock.supported) {
            const releasesBeforeStaleRejectCase = quickTagKeyboardLock.releases;
            quickTagPopover.querySelector('[data-quick-photo-tag-close]').click();
            check(quickTagPopover.hidden,
                'closing the resolved lock owner hides the editor before testing rejection recovery');
            await waitFor(() => quickTagKeyboardLock.releases > releasesBeforeStaleRejectCase,
                'Closing the resolved lock owner did not release Keyboard Lock.');
            window.quickTagRejectNextKeyboardLock = true;
            window.quickTagInputPhase = 'fullscreen-reject-t';
            await waitFor(() => !quickTagPopover.hidden
                && typeof window.quickTagDeferredKeyboardLockRejector === 'function',
            'The deferred rejection lock request did not start.');
            const attemptsBeforeRejection = quickTagKeyboardLock.attempts;
            const failuresBeforeRejection = quickTagKeyboardLock.rejected;
            quickTagPopover.querySelector('[data-quick-photo-tag-close]').click();
            check(quickTagPopover.hidden && document.activeElement === hudTagButton,
                '× closes the rejected-request owner and restores focus to its trigger');
            window.quickTagInputPhase = 'fullscreen-stale-reject-reopen-t';
            await waitFor(() => !quickTagPopover.hidden,
                'A new popup did not open while the old lock request was pending.');
            window.quickTagDeferredKeyboardLockRejector();
            await waitFor(() => quickTagKeyboardLock.rejected > failuresBeforeRejection
                && quickTagKeyboardLock.attempts > attemptsBeforeRejection,
            'A stale rejected request did not reconcile the newer popup lock owner.');
            check(!quickTagPopover.hidden,
                'stale lock rejection leaves the newer quick-tag editor open');
        }
        const quickTagEscapeLockAcquired = quickTagKeyboardLock.acquired > 0;
        window.quickTagInputPhase = 'fullscreen-escape';
        await waitFor(() => quickTagPopover.hidden,
            'Escape or the browser fullscreen-exit fallback did not dismiss the fullscreen quick-tag editor.');
        if (quickTagEscapeLockAcquired) {
            check(!quickTagViewer.hidden && document.fullscreenElement === quickTagViewer,
                'an acquired native Escape lock lets the first Escape close only the editor');
            check(quickTagKeyboardLock.releases > 0,
                'closing the fullscreen editor releases its acquired Keyboard Lock');
        }
        else {
            check(!quickTagViewer.hidden,
                'a denied or unavailable native Escape lock still dismisses the popup with browser fullscreen exit');
        }
        window.quickTagInputPhase = 'fullscreen-hud-auto-hide-restored';
        if (document.fullscreenElement === quickTagViewer) {
            await waitFor(() => !quickTagViewer.classList.contains('is-ui-visible'),
                'Closing quick tags did not restore the normal fullscreen HUD auto-hide.');
        }
        else {
            window.quickTagInputPhase = 'viewer-close';
            await waitFor(() => quickTagViewer.hidden,
                'The viewer did not close after the browser exited fullscreen.');
        }
        if (quickTagViewer.hidden) {
            window.quickTagInputPhase = 'quick-tag-done';
        }
        else {
        window.quickTagInputPhase = 'fullscreen-outside-t';
        await waitFor(() => !quickTagPopover.hidden,
            'T did not reopen quick tags before testing outside-click dismissal.');
        window.quickTagInputPhase = 'fullscreen-outside-hud-hold';
        await new Promise(resolve => setTimeout(resolve, QUICK_TAG_HUD_AUTO_HIDE_WAIT_MS));
        check(quickTagViewer.classList.contains('is-ui-visible'),
            'the fullscreen HUD stays visible while quick tags remain open');
        quickTagViewer.querySelector('[data-lightbox-title]').dispatchEvent(
            new MouseEvent('click', {bubbles: true}),
        );
        check(quickTagPopover.hidden && quickTagViewer.classList.contains('is-ui-visible')
            && document.activeElement !== hudTagButton,
            'outside click closes the editor and rearms the HUD without restoring focus to its trigger');
        window.quickTagInputPhase = 'fullscreen-outside-hud-auto-hide';
        await waitFor(() => !quickTagViewer.classList.contains('is-ui-visible'),
            'Outside-click dismissal did not restore the fullscreen HUD auto-hide.');
        window.quickTagInputPhase = 'fullscreen-exit';
        await waitFor(() => quickTagViewer.hidden === false
            && document.fullscreenElement !== quickTagViewer
            && !quickTagViewer.classList.contains('is-css-fullscreen')
            && !quickTagViewer.classList.contains('is-fullscreen'),
        'Second Escape did not exit fullscreen while preserving the lightbox.');
        window.quickTagInputPhase = 'viewer-close';
        await waitFor(() => quickTagViewer.hidden, 'Third Escape did not close the lightbox after leaving fullscreen.');
        }
        if (document.fullscreenElement === quickTagViewer) await document.exitFullscreen();
        window.quickTagInputPhase = 'quick-tag-done';
        document.dispatchEvent(new CustomEvent('quickPhotoTagSlideshowChanged', {detail: {active: true}}));
        check([...quickTagViewer.querySelectorAll('[data-quick-photo-tag-viewer]')].every(button => button.hidden),
            'slideshow state hides both viewer tag controls');

        const requestedPaths = (await imageStats()).map(item => item.path);
        check(!requestedPaths.some(source => source.startsWith('/media/b/full.svg')),
            'navigation and zoom must not request neighboring photos original sources');
        check(requestedPaths.some(source => source.startsWith('/media/a/full.svg')),
            'the reopened active photo original must be requested for the bounded failure and preview-restore case');
        check(requestedPaths.some(source => source.startsWith('/media/c/full.svg')),
            'explicit zoom must request the authorized active-card original');
        check(errors.length === 0, `browser errors: ${errors.join('; ')}`);
        result.textContent = `BROWSER PASS: native lightbox quick-tag keyboard flow, remembered photo tag, fullscreen HUD and active-source targeting, plus real A/B/C image load/decode races, sparse metadata windows, close/reopen invalidation, detached-load cancellation and bounded original requests. Keyboard Lock: ${JSON.stringify(quickTagKeyboardLock)}.`;
    } catch (error) {
        result.textContent = `BROWSER FAIL: ${error.stack}\n${errors.join('\n')}`;
    } finally {
        teardownGalleryLightbox();
        window.fetch = originalFetch;
        window.Image = NativeImage;
        HTMLImageElement.prototype.decode = nativeImageDecode;
    }
</script>
</body></html>
